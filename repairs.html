function TrackView({ tickets }) {
  const [input, setInput]       = useState("");
  const [result, setResult]     = useState(null);
  const [searched, setSearched] = useState(false);

  const doSearch = () => {
    const q = input.trim().toLowerCase();
    const t = tickets.find(x =>
      x.id.toLowerCase() === q ||
      x.customerPhone.replace(/\D/g,"").includes(q.replace(/\D/g,""))
    );
    setResult(t || null);
    setSearched(true);
  };

  const s = result ? (STATUSES.find(x => x.id === result.status) || STATUSES[0]) : null;
  const emoji = { received:"📥", diagnosing:"🔍", awaiting_parts:"⏳", in_repair:"🔧", ready:"✅", collected:"📦" };

  return (
    <div style={{ maxWidth:520, margin:"0 auto" }}>
      <div style={{ background:T.card, border:`1px solid ${T.border}`, borderRadius:16, padding:"28px 28px 24px", boxShadow:"0 2px 12px rgba(0,0,0,0.08)" }}>
        <div style={{ textAlign:"center", marginBottom:28 }}>
          <div style={{ fontSize:40, marginBottom:10 }}>📱</div>
          <h2 style={{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:24, margin:0, color:T.text }}>Track Your Repair</h2>
          <p style={{ color:T.muted, fontSize:14, marginTop:8, lineHeight:1.6 }}>
            Enter your <strong>ticket ID</strong> (e.g. TPP-AB3X7K) or the <strong>phone number</strong> you gave at drop-off.
          </p>
        </div>

        <div style={{ display:"flex", gap:10, marginBottom:8 }}>
          <input value={input} onChange={e => setInput(e.target.value.toUpperCase())}
            onKeyDown={e => e.key === "Enter" && doSearch()}
            placeholder="Ticket ID or phone number"
            style={{ flex:1, ...iS, fontSize:16, fontFamily:"'Syne',sans-serif", fontWeight:700, letterSpacing:1, background:"#F8F9FB" }} />
          <button onClick={doSearch} style={{ background:T.blue, color:"#FFF", border:"none", borderRadius:8, padding:"10px 22px", fontWeight:700, fontSize:14, cursor:"pointer", fontFamily:"inherit", whiteSpace:"nowrap" }}>
            Search
          </button>
        </div>
        <div style={{ fontSize:11, color:T.muted, textAlign:"center", marginBottom:4 }}>Your ticket ID is on the receipt given at drop-off</div>

        {searched && !result && (
          <div style={{ marginTop:22, textAlign:"center", padding:"24px 20px", background:"#F9FAFB", borderRadius:12, border:"1px solid #E5E7EB" }}>
            <div style={{ fontSize:36, marginBottom:10 }}>🔍</div>
            <div style={{ fontSize:15, fontWeight:700, color:T.text, marginBottom:6 }}>Ticket not found</div>
            <div style={{ fontSize:13, color:T.muted, marginBottom:20, lineHeight:1.6 }}>
              No ticket found for <strong>{input}</strong>. Double-check your ticket ID or the phone number you gave at drop-off, then try again.
            </div>
            <WaBtn />
          </div>
        )}

        {result && s && (
          <div style={{ marginTop:22 }}>
            <div style={{ background:s.bg, border:`2px solid ${s.color}40`, borderRadius:14, padding:"24px 20px", textAlign:"center", marginBottom:18 }}>
              <div style={{ fontSize:44, marginBottom:8 }}>{emoji[result.status] || "📱"}</div>
              <div style={{ fontFamily:"'Syne',sans-serif", fontSize:22, fontWeight:800, color:s.color }}>{s.label}</div>
              <div style={{ fontSize:12, color:T.muted, marginTop:5 }}>Last updated {fmt(result.updatedAt)}</div>
            </div>

            {[
              ["Ticket ID",    result.id],
              ["Device",       `${result.deviceBrand} ${result.deviceModel}`],
              ["Issue",        result.faultDescription],
              ["Est. Cost",    result.estimatedCost ? fmtMoney(result.estimatedCost) : "To be confirmed"],
              ["Est. Ready",   result.estimatedCompletion ? fmtDate(result.estimatedCompletion) : "To be confirmed"],
              ...(result.finalCost ? [["Final Cost", fmtMoney(result.finalCost)]] : []),
            ].map(([k, v]) => (
              <div key={k} style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:12, fontSize:13, paddingBottom:12, borderBottom:"1px solid #E5E7EB" }}>
                <span style={{ color:T.muted, flexShrink:0, marginRight:12 }}>{k}</span>
                <span style={{ fontWeight:500, textAlign:"right", maxWidth:"65%" }}>{v}</span>
              </div>
            ))}

            {result.status === "ready" && (
              <div style={{ background:T.greenLt, border:"1px solid #A7F3D0", borderRadius:12, padding:"20px 18px", marginTop:8, textAlign:"center" }}>
                <div style={{ fontWeight:800, color:T.green, fontSize:16, marginBottom:6 }}>📍 Your device is ready!</div>
                <div style={{ fontSize:13, color:"#065F46", marginBottom:4, lineHeight:1.7 }}>
                  Please collect within <strong>3 days</strong> to avoid storage fees.
                </div>
                <div style={{ fontSize:13, color:"#065F46", fontWeight:600, marginBottom:18 }}>{ADDRESS}</div>
                <WaBtn label="💬 Let us know you're coming" />
              </div>
            )}

            {result.status === "collected" && (
              <div style={{ background:"#F3F4F6", border:"1px solid #E5E7EB", borderRadius:12, padding:"16px 18px", marginTop:8, textAlign:"center" }}>
                <div style={{ fontSize:13, color:T.muted, lineHeight:1.6 }}>✅ This device has been collected. Thank you for choosing The Phone Plug!</div>
              </div>
            )}

            {!["ready","collected"].includes(result.status) && (
              <div style={{ marginTop:16, padding:"14px 16px", background:"#F9FAFB", borderRadius:10, fontSize:12, color:T.muted, textAlign:"center", border:"1px solid #E5E7EB" }}>
                Questions? DM <strong style={{ color:T.blue }}>{INSTAGRAM}</strong> or{" "}
                <a href={`https://wa.me/${WA_NUMBER}`} target="_blank" rel="noopener noreferrer" style={{ color:"#25D366", fontWeight:700, textDecoration:"none" }}>WhatsApp us</a>.
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

export default function App() {
  const [tickets, setTickets] = useState([]);

  useEffect(() => {
    (async () => {
      const saved = await load("tpp-tickets-v1");
      setTickets(Array.isArray(saved) ? saved : []);
    })();
  }, []);

  return (
    <div style={{ minHeight:"100vh", background:T.black, fontFamily:"inherit" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap');
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'DM Sans',sans-serif;background:#0A0A0A;}
        input,button{font-family:'DM Sans',sans-serif;}
        input::placeholder{color:#9CA3AF;}
        input:focus{outline:2px solid rgba(26,86,219,0.25);outline-offset:0;border-color:#1A56DB!important;}
        ::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-thumb{background:#333;border-radius:3px;}
      `}</style>

      {/* ── Header ── */}
      <div style={{ background:T.black, borderBottom:"1px solid rgba(255,255,255,0.08)" }}>
        <div style={{ maxWidth:600, margin:"0 auto", padding:"0 20px" }}>

          {/* Logo + name */}
          <div style={{ display:"flex", alignItems:"center", gap:16, paddingTop:22, paddingBottom:18, borderBottom:"1px solid rgba(255,255,255,0.07)" }}>
            <img src={LOGO_SRC} alt="The Phone Plug" style={{ height:64, width:"auto", objectFit:"contain", flexShrink:0 }} />
            <div>
              <div style={{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:22, color:"#FFFFFF", letterSpacing:-0.3, lineHeight:1 }}>THE PHONE PLUG</div>
              <div style={{ fontSize:11, color:"rgba(255,255,255,0.4)", marginTop:5, letterSpacing:"0.5px", textTransform:"uppercase" }}>Repair · Accessories · Smartphones</div>
            </div>
          </div>

          {/* Contact row */}
          <div style={{ display:"flex", flexWrap:"wrap", alignItems:"center", justifyContent:"space-between", gap:10, padding:"12px 0" }}>
            <div style={{ display:"flex", gap:16, flexWrap:"wrap" }}>
              <a href={`tel:${PHONE_1.replace(/-/g,"")}`} style={{ fontSize:13, color:"rgba(255,255,255,0.7)", textDecoration:"none" }}>📞 {PHONE_1}</a>
              <a href={`tel:${PHONE_2.replace(/-/g,"")}`} style={{ fontSize:13, color:"rgba(255,255,255,0.7)", textDecoration:"none" }}>📞 {PHONE_2}</a>
            </div>
            <div style={{ display:"flex", gap:14 }}>
              <a href="https://instagram.com/phoneplug_ja" target="_blank" rel="noopener noreferrer" style={{ fontSize:13, color:"#60A5FA", textDecoration:"none", fontWeight:600 }}>📷 {INSTAGRAM}</a>
              <a href={`https://wa.me/${WA_NUMBER}`} target="_blank" rel="noopener noreferrer" style={{ fontSize:13, color:"#25D366", textDecoration:"none", fontWeight:600 }}>💬 WhatsApp</a>
            </div>
          </div>

          {/* Address */}
          <div style={{ paddingBottom:14, fontSize:12, color:"rgba(255,255,255,0.35)" }}>
            📍 {ADDRESS}
          </div>
        </div>
      </div>

      {/* ── Content ── */}
      <div style={{ background:T.bg, minHeight:"calc(100vh - 180px)" }}>
        <div style={{ maxWidth:600, margin:"0 auto", padding:"36px 20px 60px" }}>
          <TrackView tickets={tickets} />
        </div>
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
