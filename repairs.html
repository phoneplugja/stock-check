    const { useState, useEffect } = React;

// ── Constants ─────────────────────────────────────────────────────────────────
const WA_NUMBER  = "18764905515";
const PHONE_1    = "876-490-5515";
const PHONE_2    = "876-672-2442";
const INSTAGRAM  = "@phoneplug_ja";
const ADDRESS    = "Shop 5D, Hagley Park Plaza, Half Way Tree, Kingston";
const STORE_URL  = "phoneplugja.com";

// Light-mode status colors — pastel tint for the panel, a darker saturated
// shade of the same hue for text/icons so it stays readable on white.
const STATUSES = [
  { id:"received",       label:"Received",          color:"#0e88bd", bg:"#eaf6fb" },
  { id:"diagnosing",     label:"Diagnosing",         color:"#7c3aed", bg:"#f5f3ff" },
  { id:"awaiting_parts", label:"Awaiting Parts",     color:"#b45309", bg:"#fffbeb" },
  { id:"in_repair",      label:"In Repair",          color:"#2563eb", bg:"#eff6ff" },
  { id:"ready",          label:"Ready for Pickup",   color:"#059669", bg:"#ecfdf5" },
  { id:"collected",      label:"Collected",          color:"#64748b", bg:"#f1f5f9" },
];

const fmt = (iso) => {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
  catch { return iso; }
};
const fmtDate = (iso) => {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); }
  catch { return iso; }
};
const fmtMoney = (n) => {
  const num = parseFloat(n) || 0;
  return "JMD " + Math.abs(num).toLocaleString("en-JM",{minimumFractionDigits:2,maximumFractionDigits:2});
};

const load = async (key) => {
  try { const s = await _db.collection('tpp').doc(key).get(); return s.exists ? s.data().v : []; }
  catch(e) { console.error('load:', e); return []; }
};

// Light, modern theme — dark header stays as-is, everything below it is
// easy-on-the-eyes white/light-grey so it's comfortable to read.
const T = {
  bg:"#f3f6fa", card:"#ffffff", border:"rgba(15,23,42,0.09)",
  black:"#080c10", text:"#0f172a", muted:"#64748b",
  accent:"#0e88bd", accentSoft:"#eaf6fb", accentBorder:"rgba(14,136,189,0.3)",
  green:"#059669", greenLt:"#ecfdf5",
};

const iS = { width:"100%", background:"#f8fafc", border:`1.5px solid ${T.border}`, borderRadius:10, padding:"11px 14px", color:T.text, fontSize:14, fontFamily:"inherit", outline:"none", boxSizing:"border-box", transition:"border-color .15s, background .15s" };

const WaBtn = ({ label="💬 WhatsApp Us" }) => (
  <a href={`https://wa.me/${WA_NUMBER}`} target="_blank" rel="noopener noreferrer" className="tpp-btn"
    style={{ display:"inline-flex",alignItems:"center",gap:8,background:"#25D366",color:"#fff",padding:"12px 22px",borderRadius:11,fontSize:14,fontWeight:700,textDecoration:"none", boxShadow:"0 10px 22px -8px rgba(37,211,102,0.55)" }}>
    {label}
  </a>
);


const LOGO_SRC = "/logo.png";

function TrackView({ tickets }) {
  const [input, setInput]       = useState("");
  const [result, setResult]     = useState(null);
  const [searched, setSearched] = useState(false);

  const doSearch = () => {
    const q = input.trim().toLowerCase();
    const t = tickets.find(x =>
      x.id.toLowerCase() === q ||
      x.customerPhone.replace(/\D/g,"").includes(q.replace(/\D/g,""))
    );
    setResult(t || null);
    setSearched(true);
  };

  const s = result ? (STATUSES.find(x => x.id === result.status) || STATUSES[0]) : null;
  const emoji = { received:"📥", diagnosing:"🔍", awaiting_parts:"⏳", in_repair:"🔧", ready:"✅", collected:"📦" };

  return (
    <div style={{ maxWidth:560, margin:"0 auto" }}>
      <div style={{ background:T.card, border:`1px solid ${T.border}`, borderRadius:20, padding:"30px 28px 26px", boxShadow:"0 1px 2px rgba(15,23,42,0.04), 0 24px 48px -20px rgba(15,23,42,0.14)" }}>
        <div style={{ textAlign:"center", marginBottom:28 }}>
          <div style={{ width:64, height:64, borderRadius:18, background:"linear-gradient(135deg,#eaf6fb,#dcf0fa)", display:"flex", alignItems:"center", justifyContent:"center", margin:"0 auto 16px" }}>
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0e88bd" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <rect x="7" y="2" width="10" height="20" rx="2.5"/>
              <line x1="11" y1="18" x2="13" y2="18"/>
              <circle cx="16.5" cy="7.5" r="4.5" fill="#0e88bd" stroke="none"/>
              <path d="M15 7.5l1 1 2-2" stroke="#fff" strokeWidth="1.4"/>
            </svg>
          </div>
          <h2 style={{ fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:24, margin:0, color:T.text }}>Track Your Repair</h2>
          <p style={{ color:T.muted, fontSize:14, marginTop:8, lineHeight:1.6 }}>
            Enter your <strong>ticket ID</strong> (e.g. TPP-AB3X7K) or the <strong>phone number</strong> you gave at drop-off.
          </p>
        </div>

        <div style={{ display:"flex", gap:10, marginBottom:8 }}>
          <input value={input} onChange={e => setInput(e.target.value.toUpperCase())}
            onKeyDown={e => e.key === "Enter" && doSearch()}
            placeholder="Ticket ID or phone number"
            style={{ flex:1, ...iS, fontSize:16, fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, letterSpacing:1 }} />
          <button onClick={doSearch} className="tpp-btn" style={{ background:"linear-gradient(135deg,#22c2f2,#0e88bd)", color:"#fff", border:"none", borderRadius:11, padding:"11px 22px", fontWeight:700, fontSize:14, cursor:"pointer", fontFamily:"inherit", whiteSpace:"nowrap", boxShadow:"0 10px 24px -8px rgba(14,136,189,0.5)" }}>
            Search
          </button>
        </div>
        <div style={{ fontSize:11, color:T.muted, textAlign:"center", marginBottom:4 }}>Your ticket ID is on the receipt given at drop-off</div>

        {searched && !result && (
          <div style={{ marginTop:22, textAlign:"center", padding:"24px 20px", background:"#f8fafc", borderRadius:14, border:`1px solid ${T.border}` }}>
            <div style={{ fontSize:36, marginBottom:10 }}>🔍</div>
            <div style={{ fontSize:15, fontWeight:700, color:T.text, marginBottom:6 }}>Ticket not found</div>
            <div style={{ fontSize:13, color:T.muted, marginBottom:20, lineHeight:1.6 }}>
              No ticket found for <strong>{input}</strong>. Double-check your ticket ID or the phone number you gave at drop-off, then try again.
            </div>
            <WaBtn />
          </div>
        )}

        {result && s && (
          <div style={{ marginTop:22 }}>
            <div style={{ background:s.bg, border:`1px solid ${s.color}30`, borderRadius:16, padding:"24px 20px", textAlign:"center", marginBottom:18 }}>
              <div style={{ fontSize:44, marginBottom:8 }}>{emoji[result.status] || "📱"}</div>
              <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:22, fontWeight:700, color:s.color }}>{s.label}</div>
              <div style={{ fontSize:12, color:T.muted, marginTop:5 }}>Last updated {fmt(result.updatedAt)}</div>
            </div>

            {[
              ["Ticket ID",    result.id],
              ["Device",       `${result.deviceBrand} ${result.deviceModel}`],
              ["Issue",        result.faultDescription],
              ["Est. Cost",    result.estimatedCost ? fmtMoney(result.estimatedCost) : "To be confirmed"],
              ["Est. Ready",   result.estimatedCompletion ? fmtDate(result.estimatedCompletion) : "To be confirmed"],
              ...(result.finalCost ? [["Final Cost", fmtMoney(result.finalCost)]] : []),
            ].map(([k, v]) => (
              <div key={k} style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:12, fontSize:13, paddingBottom:12, borderBottom:`1px solid ${T.border}` }}>
                <span style={{ color:T.muted, flexShrink:0, marginRight:12 }}>{k}</span>
                <span style={{ fontWeight:500, textAlign:"right", maxWidth:"65%", color:T.text }}>{v}</span>
              </div>
            ))}

            {result.status === "ready" && (
              <div style={{ background:T.greenLt, border:"1px solid rgba(5,150,105,0.25)", borderRadius:14, padding:"20px 18px", marginTop:8, textAlign:"center" }}>
                <div style={{ fontWeight:800, color:T.green, fontSize:16, marginBottom:6 }}>📍 Your device is ready!</div>
                <div style={{ fontSize:13, color:"#065f46", marginBottom:4, lineHeight:1.7 }}>
                  Please collect within <strong>3 days</strong> to avoid storage fees.
                </div>
                <div style={{ fontSize:13, color:"#065f46", fontWeight:600, marginBottom:18 }}>{ADDRESS}</div>
                <WaBtn label="💬 Let us know you're coming" />
              </div>
            )}

            {result.status === "collected" && (
              <div style={{ background:"#f8fafc", border:`1px solid ${T.border}`, borderRadius:14, padding:"16px 18px", marginTop:8, textAlign:"center" }}>
                <div style={{ fontSize:13, color:T.muted, lineHeight:1.6 }}>✅ This device has been collected. Thank you for choosing The Phone Plug!</div>
              </div>
            )}

            {!["ready","collected"].includes(result.status) && (
              <div style={{ marginTop:16, padding:"14px 16px", background:"#f8fafc", borderRadius:12, fontSize:12, color:T.muted, textAlign:"center", border:`1px solid ${T.border}` }}>
                Questions? DM <strong style={{ color:T.accent }}>{INSTAGRAM}</strong> or{" "}
                <a href={`https://wa.me/${WA_NUMBER}`} target="_blank" rel="noopener noreferrer" style={{ color:"#25D366", fontWeight:700, textDecoration:"none" }}>WhatsApp us</a>.
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [tickets, setTickets] = useState([]);

  useEffect(() => {
    (async () => {
      const saved = await load("tpp-tickets-v1");
      setTickets(Array.isArray(saved) ? saved : []);
    })();
  }, []);

  return (
    <div style={{ minHeight:"100vh", background:T.bg, fontFamily:"inherit" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Inter',sans-serif;background:#f3f6fa;}
        input,button{font-family:'Inter',sans-serif;}
        input::placeholder{color:#94a3b8;}
        input:focus{outline:none;border-color:#0e88bd!important;background:#fff!important;box-shadow:0 0 0 4px rgba(14,136,189,0.12);}
        ::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px;}
        .tpp-btn{transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;}
        .tpp-btn:hover{transform:translateY(-1px); filter:brightness(1.04);}
        .tpp-btn:active{transform:translateY(0);}
        @media (max-width:640px){ .tpp-wordmark{display:none;} .tpp-cta-text{display:none;} }
      `}</style>

      <Header active="track" />

      {/* ── Content (light, easy to read) ── */}
      <div style={{ minHeight:"calc(100vh - 240px)" }}>
        <div style={{ maxWidth:640, margin:"0 auto", padding:"36px 20px 60px" }}>
          <TrackView tickets={tickets} />
        </div>
      </div>

      <Footer />
    </div>
  );
}


    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
