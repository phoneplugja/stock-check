<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no">
  <title>The Phone Plug — Book a Repair</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyB6WlaYxrA2eEYUztSOYs5HiLD9PTOswlQ",
      authDomain: "phone-plug-3a7fe.firebaseapp.com",
      projectId: "phone-plug-3a7fe",
      storageBucket: "phone-plug-3a7fe.firebasestorage.app",
      messagingSenderId: "847520590345",
      appId: "1:847520590345:web:fb544f0b517e6a55f6e6d8"
    });
    const _db = firebase.firestore();
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    // ── Constants ────────────────────────────────────────────────────────────
    const WA_NUMBER = "18764905515";
    const PHONE_1   = "876-490-5515";
    const PHONE_2   = "876-672-2442";
    const INSTAGRAM = "@phoneplug_ja";
    const EMAIL     = "support@phoneplugja.com";
    const ADDRESS   = "Shop 5D, Hagley Park Plaza, Half Way Tree, Kingston";
    const LOGO_SRC  = "/logo.png";

    // Light, modern theme — dark header stays as-is, everything below it is
    // easy-on-the-eyes white/light-grey so long forms aren't a strain to read.
    const T = {
      bg:"#f3f6fa", card:"#ffffff", border:"rgba(15,23,42,0.09)", borderSoft:"rgba(15,23,42,0.06)",
      black:"#080c10", text:"#0f172a", muted:"#64748b",
      accent:"#0e88bd", accentSoft:"#eaf6fb", accentBorder:"rgba(14,136,189,0.3)",
      green:"#059669", greenLt:"#ecfdf5",
      red:"#dc2626", redLt:"#fef2f2",
    };

    const iS = {
      width:"100%", background:"#f8fafc", border:`1.5px solid ${T.border}`,
      borderRadius:10, padding:"11px 14px", color:T.text, fontSize:14,
      fontFamily:"inherit", outline:"none", boxSizing:"border-box", transition:"border-color .15s, background .15s"
    };

    const iSErr = { ...iS, borderColor:T.red, background:T.redLt };

    const DEVICE_TYPES   = ["Smartphone","Tablet","Laptop","Smartwatch","Accessory","Other"];
    const COMMON_ISSUES  = ["Screen damage","Battery issue","Charging port","Camera fault","Speaker/mic","Water damage","Software issue","Back glass","Button fault","Other"];
    const ALPHA          = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    const genRef         = () => "BK-" + Array.from({length:6},()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join("");

    const save = async (key, val) => {
      try { await _db.collection("tpp").doc(key).set({ v: val, ts: Date.now() }); }
      catch(e) { console.error("save:", e); throw e; }
    };

    const loadArr = async (key) => {
      try {
        const s = await _db.collection("tpp").doc(key).get();
        return s.exists && Array.isArray(s.data().v) ? s.data().v : [];
      } catch(e) { return []; }
    };

    // ── Shared UI ─────────────────────────────────────────────────────────────
    const WaBtn = ({ label="💬 WhatsApp Us" }) => (
      <a href={`https://wa.me/${WA_NUMBER}`} target="_blank" rel="noopener noreferrer" className="tpp-btn"
        style={{ display:"inline-flex", alignItems:"center", gap:8, background:"#25D366", color:"#fff", padding:"12px 22px", borderRadius:11, fontSize:14, fontWeight:700, textDecoration:"none", boxShadow:"0 10px 22px -8px rgba(37,211,102,0.55)" }}>
        {label}
      </a>
    );

    const Field = ({ label, required, error, hint, children }) => (
      <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
        <label style={{ fontSize:12.5, fontWeight:600, color:T.muted }}>
          {label}{required && <span style={{ color:T.accent, marginLeft:2 }}>*</span>}
          {hint && <span style={{ fontWeight:400, marginLeft:6, color:"#94a3b8" }}>{hint}</span>}
        </label>
        {children}
        {error && <span style={{ fontSize:12, color:T.red, marginTop:1, fontWeight:500 }}>{error}</span>}
      </div>
    );

    // Card = the single elevated surface for a step. Section = a labeled group of
    // fields *inside* that one card, separated by a hairline rather than its own
    // nested box — this is what keeps the page from reading as boxes-in-boxes.
    const Card = ({ children, style:s }) => (
      <div style={{ background:T.card, border:`1px solid ${T.border}`, borderRadius:20, padding:"30px 28px 26px", boxShadow:"0 1px 2px rgba(15,23,42,0.04), 0 24px 48px -20px rgba(15,23,42,0.14)", ...s }}>
        {children}
      </div>
    );

    const Section = ({ children, last, style:s }) => (
      <div style={{ paddingBottom: last?0:24, marginBottom: last?0:24, borderBottom: last?"none":`1px solid ${T.borderSoft}`, ...s }}>
        {children}
      </div>
    );

    const ST = ({ children }) => (
      <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:11, fontWeight:700, color:T.accent, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:14 }}>
        {children}
      </div>
    );

    const StepBar = ({ current }) => {
      const steps = ["Your Info","Device & Issue","Confirm"];
      return (
        <div style={{ display:"flex", alignItems:"flex-start", marginBottom:26, gap:0 }}>
          {steps.map((s,i) => {
            const done    = i < current;
            const active  = i === current;
            const col     = done ? T.green : active ? T.accent : "#cbd5e1";
            return (
              <React.Fragment key={i}>
                <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:6 }}>
                  <div style={{
                    width:30, height:30, borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center",
                    fontSize:12, fontWeight:800, color: done||active ? "#fff" : "#94a3b8",
                    background: done ? T.green : active ? "linear-gradient(135deg,#22c2f2,#0e88bd)" : "#eef2f6",
                    boxShadow: active ? "0 6px 16px -4px rgba(14,136,189,0.55)" : "none",
                    transition:"all .3s"
                  }}>
                    {done ? "✓" : i+1}
                  </div>
                  <span style={{ fontSize:11, fontWeight:600, color:col, whiteSpace:"nowrap" }}>{s}</span>
                </div>
                {i < steps.length-1 && <div style={{ flex:1, height:3, borderRadius:99, background: done ? T.green : "#e2e8f0", margin:"14px 8px 0", transition:"background .3s" }} />}
              </React.Fragment>
            );
          })}
        </div>
      );
    };

    const Btn = ({ children, onClick, variant="primary", full, disabled, style:s }) => {
      const v = {
        primary: { background:"linear-gradient(135deg,#22c2f2,#0e88bd)", color:"#fff", border:"none", boxShadow:"0 10px 24px -8px rgba(14,136,189,0.5)" },
        ghost:   { background:"#ffffff", color:T.text, border:`1.5px solid ${T.border}`, boxShadow:"none" },
        green:   { background:T.greenLt, color:T.green, border:"1px solid rgba(5,150,105,0.25)", boxShadow:"none" },
      };
      return (
        <button onClick={onClick} disabled={disabled} className="tpp-btn" style={{ ...v[variant], borderRadius:11, padding:"12px 22px", fontSize:14, fontWeight:700, cursor:disabled?"not-allowed":"pointer", fontFamily:"inherit", width:full?"100%":"auto", opacity:disabled?.5:1, ...s }}>
          {children}
        </button>
      );
    };

    // ── Main Booking Form ─────────────────────────────────────────────────────
    function BookingForm() {
      const empty = {
        customerName:"", customerPhone:"", customerEmail:"",
        deviceType:"Smartphone", deviceBrand:"", deviceModel:"",
        deviceColor:"", deviceImei:"",
        selectedIssues:[], issueDescription:"",
        preferredDate:"", preferredTime:"", notes:""
      };
      const [step,    setStep]    = useState(0);
      const [form,    setFormS]   = useState(empty);
      const [errs,    setErrs]    = useState({});
      const [saving,  setSaving]  = useState(false);
      const [bookRef, setBookRef] = useState("");

      const set = (k,v) => { setFormS(p=>({...p,[k]:v})); setErrs(p=>({...p,[k]:""})); };

      const toggleIssue = (issue) => {
        const cur = form.selectedIssues;
        set("selectedIssues", cur.includes(issue) ? cur.filter(i=>i!==issue) : [...cur,issue]);
      };

      const validate = (s) => {
        const e = {};
        if (s===0) {
          if (!form.customerName.trim())                                                e.customerName    = "Name is required";
          if (!form.customerPhone.trim()||form.customerPhone.replace(/\D/g,"").length<7) e.customerPhone = "Valid phone number required";
          if (form.customerEmail && !/\S+@\S+\.\S+/.test(form.customerEmail))           e.customerEmail  = "Invalid email";
        }
        if (s===1) {
          if (!form.deviceBrand.trim()) e.deviceBrand = "Brand is required";
          if (!form.deviceModel.trim()) e.deviceModel = "Model is required";
          if (!form.issueDescription.trim() && form.selectedIssues.length===0) e.issueDescription = "Please describe the issue";
        }
        return e;
      };

      const next = (s) => {
        const e = validate(s);
        if (Object.keys(e).length) { setErrs(e); return; }
        setStep(s+1);
        window.scrollTo({top:0,behavior:"smooth"});
      };

      const submit = async () => {
        setSaving(true);
        try {
          const ref = genRef();
          const issueText = [
            ...form.selectedIssues,
            ...(form.issueDescription ? [form.issueDescription] : [])
          ].join(" · ");

          const ticket = {
            id: ref,
            bookingRef: ref,
            customerName: form.customerName,
            customerPhone: form.customerPhone,
            customerEmail: form.customerEmail,
            deviceType: form.deviceType,
            deviceBrand: form.deviceBrand,
            deviceModel: form.deviceModel,
            deviceColor: form.deviceColor,
            deviceImei: form.deviceImei,
            issueDescription: issueText,
            notes: form.notes,
            preferredDate: form.preferredDate,
            preferredTime: form.preferredTime,
            status: "scheduled",
            source: "online_booking",
            createdAt: new Date().toISOString()
          };

          // Load existing bookings and prepend
          const existing = await loadArr("tpp-bookings");
          await save("tpp-bookings", [ticket, ...existing]);

          setBookRef(ref);
          setStep(3);
        } catch(e) {
          alert("Something went wrong. Please try again or contact us directly.\n\n" + e.message);
        } finally {
          setSaving(false);
        }
      };

      // ── Step 0: Customer info ──────────────────────────────────────────────
      if (step===0) return (
        <div>
          <StepBar current={0} />
          <Card>
            <Section last>
              <ST>Your Information</ST>
              <div className="field-grid-2" style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, marginBottom:16 }}>
                <Field label="Full Name" required error={errs.customerName}>
                  <input style={errs.customerName?iSErr:iS} placeholder="e.g. Marcus Brown" value={form.customerName} onChange={e=>set("customerName",e.target.value)} />
                </Field>
                <Field label="Phone Number" required hint="7–11 digits" error={errs.customerPhone}>
                  <input style={errs.customerPhone?iSErr:iS} placeholder="e.g. 8761234567" value={form.customerPhone} onChange={e=>set("customerPhone",e.target.value.replace(/[^0-9+\s()-]/g,""))} maxLength={15} />
                </Field>
              </div>
              <Field label="Email Address" hint="Optional — for status updates" error={errs.customerEmail}>
                <input type="email" style={errs.customerEmail?iSErr:iS} placeholder="customer@email.com" value={form.customerEmail} onChange={e=>set("customerEmail",e.target.value)} />
              </Field>
            </Section>
          </Card>
          <div style={{ background:T.accentSoft, border:`1px solid ${T.accentBorder}`, borderRadius:12, padding:"13px 16px", fontSize:13, color:"#0a6690", margin:"16px 0 20px", lineHeight:1.6 }}>
            💡 We'll contact you on this number to confirm your appointment time.
          </div>
          <Btn onClick={()=>next(0)}>Continue →</Btn>
        </div>
      );

      // ── Step 1: Device + issue ─────────────────────────────────────────────
      if (step===1) return (
        <div>
          <StepBar current={1} />
          <Card>
            <Section>
              <ST>Device Information</ST>
              <div className="field-grid-3" style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:16, marginBottom:16 }}>
                <Field label="Type">
                  <select style={iS} value={form.deviceType} onChange={e=>set("deviceType",e.target.value)}>
                    {DEVICE_TYPES.map(d=><option key={d}>{d}</option>)}
                  </select>
                </Field>
                <Field label="Brand" required error={errs.deviceBrand}>
                  <select style={errs.deviceBrand?iSErr:iS} value={form.deviceBrand} onChange={e=>{ set("deviceBrand",e.target.value); set("deviceModel",""); }}>
                    <option value="">— Select Make —</option>
                    {["Samsung","Apple","Huawei","Xiaomi","OnePlus","Motorola","LG","Sony","Nokia","Tecno","Infinix","Itel","HOTWAV","Other"].map(m=><option key={m}>{m}</option>)}
                  </select>
                </Field>
                <Field label="Model" required error={errs.deviceModel}>
                  {form.deviceBrand === "Other" || !form.deviceBrand
                    ? <input style={errs.deviceModel?iSErr:iS} placeholder={form.deviceBrand?"Type model name":"Select make first"} value={form.deviceModel} onChange={e=>set("deviceModel",e.target.value)} disabled={!form.deviceBrand} />
                    : <select style={errs.deviceModel?iSErr:iS} value={form.deviceModel} onChange={e=>set("deviceModel",e.target.value)} disabled={!form.deviceBrand}>
                        <option value="">— Select Model —</option>
                        {({
                          Samsung:["Galaxy S24 Ultra","Galaxy S24+","Galaxy S24","Galaxy S23 Ultra","Galaxy S23+","Galaxy S23","Galaxy S22 Ultra","Galaxy S22+","Galaxy S22","Galaxy S21 Ultra","Galaxy S21+","Galaxy S21","Galaxy S20 Ultra","Galaxy S20+","Galaxy S20","Galaxy A55","Galaxy A54","Galaxy A35","Galaxy A34","Galaxy A25","Galaxy A24","Galaxy A15","Galaxy A14","Galaxy A05s","Galaxy Note 20 Ultra","Galaxy Note 20","Galaxy Z Fold 5","Galaxy Z Flip 5","Other"],
                          Apple:["iPhone 15 Pro Max","iPhone 15 Pro","iPhone 15 Plus","iPhone 15","iPhone 14 Pro Max","iPhone 14 Pro","iPhone 14 Plus","iPhone 14","iPhone 13 Pro Max","iPhone 13 Pro","iPhone 13","iPhone 13 Mini","iPhone 12 Pro Max","iPhone 12 Pro","iPhone 12","iPhone 12 Mini","iPhone 11 Pro Max","iPhone 11 Pro","iPhone 11","iPhone XS Max","iPhone XR","iPhone X","iPhone SE (3rd gen)","iPhone SE (2nd gen)","Other"],
                          Huawei:["P60 Pro","P50 Pro","P40 Pro","P30 Pro","Mate 50 Pro","Mate 40 Pro","Nova 11","Nova 10","Other"],
                          Xiaomi:["14 Ultra","14 Pro","14","13 Pro","Redmi Note 13 Pro+","Redmi Note 13","Poco X6 Pro","Other"],
                          OnePlus:["12","11","10 Pro","Nord 3","Nord 2T","Other"],
                          Motorola:["Edge 40 Pro","Moto G84","Moto G54","Moto G34","Other"],
                          LG:["V60","V50","G8","Other"],
                          Sony:["Xperia 1 V","Xperia 5 V","Other"],
                          Nokia:["G42","G22","C32","Other"],
                          Tecno:["Phantom X2 Pro","Spark 20 Pro+","Camon 20 Pro","Other"],
                          Infinix:["Note 40 Pro","Hot 40 Pro","Smart 8","Other"],
                          Itel:["A70","P55","S23","Other"],
                          HOTWAV:["Note 12","Cyber 13 Pro","T8","Other"]
                        }[form.deviceBrand]||["Other"]).map(m=><option key={m}>{m}</option>)}
                      </select>
                  }
                </Field>
              </div>
              <div className="field-grid-2" style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16 }}>
                <Field label="Color">
                  <input style={iS} placeholder="Space Black, White…" value={form.deviceColor} onChange={e=>set("deviceColor",e.target.value)} />
                </Field>
                <Field label="IMEI / Serial" hint="Dial *#06#">
                  <input style={iS} placeholder="15-digit IMEI (optional)" value={form.deviceImei} onChange={e=>set("deviceImei",e.target.value)} />
                </Field>
              </div>
            </Section>

            <Section>
              <ST>Issue</ST>
              <p style={{ fontSize:13, color:T.muted, marginBottom:14 }}>Select all that apply, then add details below.</p>
              <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:16 }}>
                {COMMON_ISSUES.map(issue => {
                  const sel = form.selectedIssues.includes(issue);
                  return (
                    <button key={issue} onClick={()=>toggleIssue(issue)} style={{ padding:"8px 14px", borderRadius:99, border:`1.5px solid ${sel?T.accentBorder:T.border}`, background:sel?T.accentSoft:"#f8fafc", color:sel?T.accent:T.muted, fontSize:13, fontWeight:600, cursor:"pointer", transition:"all .15s", fontFamily:"inherit" }}>
                      {sel ? "✓ " : ""}{issue}
                    </button>
                  );
                })}
              </div>
              <Field label={form.selectedIssues.length===0?"Additional details (required)":"Additional details"} error={errs.issueDescription}>
                <textarea style={{ ...(errs.issueDescription?iSErr:iS), minHeight:90, resize:"vertical" }} placeholder="Describe the problem — when it started, what you've noticed…" value={form.issueDescription} onChange={e=>set("issueDescription",e.target.value)} />
              </Field>
            </Section>

            <Section last>
              <ST>Preferred Appointment</ST>
              <div className="field-grid-2" style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, marginBottom:16 }}>
                <Field label="Preferred Date">
                  <input type="date" style={iS} value={form.preferredDate} onChange={e=>set("preferredDate",e.target.value)} />
                </Field>
                <Field label="Preferred Time">
                  <select style={iS} value={form.preferredTime} onChange={e=>set("preferredTime",e.target.value)}>
                    <option value="">Any time</option>
                    <option>Morning (9am–12pm)</option>
                    <option>Afternoon (12pm–3pm)</option>
                    <option>Late afternoon (3pm–6pm)</option>
                  </select>
                </Field>
              </div>
              <Field label="Additional notes">
                <textarea style={{ ...iS, minHeight:64, resize:"vertical" }} placeholder="Anything else we should know? e.g. screen is cracked but still functional…" value={form.notes} onChange={e=>set("notes",e.target.value)} />
              </Field>
            </Section>
          </Card>

          <div style={{ display:"flex", gap:10, marginTop:20 }}>
            <Btn variant="ghost" onClick={()=>setStep(0)}>← Back</Btn>
            <Btn onClick={()=>next(1)}>Review Booking →</Btn>
          </div>
        </div>
      );

      // ── Step 2: Confirm ────────────────────────────────────────────────────
      if (step===2) {
        const issueText = [...form.selectedIssues, ...(form.issueDescription?[form.issueDescription]:[])].join(" · ");
        return (
          <div>
            <StepBar current={2} />
            <Card>
              <Section>
                <ST>Customer</ST>
                <div style={{ fontWeight:700, fontSize:16, marginBottom:4 }}>{form.customerName}</div>
                <div style={{ fontSize:13, color:T.muted }}>{form.customerPhone}{form.customerEmail ? ` · ${form.customerEmail}` : ""}</div>
              </Section>
              <Section>
                <ST>Device</ST>
                <div style={{ fontWeight:700, fontSize:16, marginBottom:4 }}>{form.deviceBrand} {form.deviceModel}</div>
                <div style={{ fontSize:13, color:T.muted }}>{form.deviceType}{form.deviceColor ? ` · ${form.deviceColor}` : ""}{form.deviceImei ? ` · IMEI: ${form.deviceImei}` : ""}</div>
              </Section>
              <Section last={!(form.preferredDate || form.preferredTime || form.notes)}>
                <ST>Issue</ST>
                <div style={{ fontSize:14, lineHeight:1.7 }}>{issueText || "—"}</div>
              </Section>
              {(form.preferredDate || form.preferredTime || form.notes) && (
                <Section last>
                  <ST>Appointment Preference</ST>
                  {form.preferredDate && <div style={{ fontSize:13, color:T.muted, marginBottom:4 }}>📅 {form.preferredDate}{form.preferredTime ? ` · ${form.preferredTime}` : ""}</div>}
                  {form.notes && <div style={{ fontSize:13, color:T.muted }}>📝 {form.notes}</div>}
                </Section>
              )}
            </Card>
            <div style={{ background:"#f8fafc", border:`1px solid ${T.border}`, borderRadius:12, padding:"13px 16px", fontSize:13, color:T.muted, margin:"16px 0 20px", lineHeight:1.6 }}>
              By submitting, you confirm this information is accurate. We'll contact you to confirm your slot. Walk-ins also welcome.
            </div>
            <div style={{ display:"flex", gap:10 }}>
              <Btn variant="ghost" onClick={()=>setStep(1)}>← Edit</Btn>
              <Btn onClick={submit} disabled={saving}>{saving ? "Submitting…" : "✓ Confirm Booking"}</Btn>
            </div>
          </div>
        );
      }

      // ── Step 3: Success ────────────────────────────────────────────────────
      return (
        <Card>
          <div style={{ textAlign:"center", padding:"16px 8px" }}>
            <div style={{ fontSize:52, marginBottom:14 }}>🎉</div>
            <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:24, marginBottom:8, color:T.text }}>Booking Confirmed!</div>
            <p style={{ fontSize:14, color:T.muted, lineHeight:1.7, marginBottom:24, maxWidth:380, margin:"0 auto 24px" }}>
              We've received your repair request. Our team will be in touch shortly to confirm your appointment.
            </p>
            <div style={{ background:"linear-gradient(135deg,#eaf6fb,#f3fbfe)", border:`1px dashed ${T.accentBorder}`, borderRadius:16, padding:"20px 24px", display:"inline-block", marginBottom:24 }}>
              <div style={{ fontSize:11, fontWeight:700, color:T.accent, textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:6 }}>Your Booking Reference</div>
              <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:28, color:T.accent, letterSpacing:"0.1em" }}>{bookRef}</div>
              <div style={{ fontSize:12, color:T.muted, marginTop:6 }}>Screenshot this for your records</div>
            </div>
            <p style={{ fontSize:13, color:T.muted, lineHeight:1.7, marginBottom:20 }}>
              Walk-ins always welcome at <strong style={{ color:T.text }}>{ADDRESS}</strong>
            </p>
            <div style={{ display:"flex", justifyContent:"center", gap:12, flexWrap:"wrap" }}>
              <WaBtn label="💬 Message us on WhatsApp" />
              <a href="/repairs.html" className="tpp-btn" style={{ display:"inline-flex", alignItems:"center", gap:8, background:"#ffffff", color:T.text, padding:"12px 20px", borderRadius:11, fontSize:14, fontWeight:700, textDecoration:"none", border:`1.5px solid ${T.border}` }}>
                🔍 Track a Repair
              </a>
            </div>
          </div>
        </Card>
      );
    }

    // ── Nav tabs ──────────────────────────────────────────────────────────────
    const NAV_TABS = [
      { key:"stock", label:"Stock Checker", href:"/" },
      { key:"track", label:"Track Repair",  href:"/repairs.html" },
      { key:"book",  label:"Book a Repair", href:"/book-repair.html" },
    ];
    function Header({ active }) {
      return (
        <header style={{ position:"sticky", top:0, zIndex:100, background:"rgba(8,12,16,0.85)", backdropFilter:"blur(16px)", WebkitBackdropFilter:"blur(16px)", borderBottom:"1px solid rgba(255,255,255,0.08)" }}>
          <div style={{ maxWidth:900, margin:"0 auto", padding:"0 20px", height:72, display:"flex", alignItems:"center", justifyContent:"space-between", gap:10 }}>
