<!DOCTYPE html>
<html lang="en">
<head>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyB6WlaYxrA2eEYUztSOYs5HiLD9PTOswlQ",
      authDomain: "phone-plug-3a7fe.firebaseapp.com",
      projectId: "phone-plug-3a7fe",
      storageBucket: "phone-plug-3a7fe.firebasestorage.app",

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── Constants ────────────────────────────────────────────────────────────
    const WA_NUMBER = "18764905515";
    const PHONE_1   = "876-490-5515";

    const T = {
      bg:"#f3f6fa", card:"#ffffff", border:"rgba(15,23,42,0.09)", borderSoft:"rgba(15,23,42,0.06)",
      black:"#080c10", text:"#0f172a", muted:"#64748b",
      accent:"#0e88bd", accentSoft:"#eaf6fb", accentBorder:"rgba(14,136,189,0.3)",
      green:"#059669", greenLt:"#ecfdf5",
      red:"#dc2626", redLt:"#fef2f2",
      // Vibrant hero gradient shared with the site's promo banner/popup — used for the
      // headline moments (entry, win) so the whole flow feels like one connected piece.
      promo:"linear-gradient(115deg, #0e88bd 0%, #4f9ff5 32%, #7c5cff 68%, #fb5f8a 100%)",
      violet:"#6d4fe0", violetSoft:"#f2effe", violetBorder:"rgba(109,79,224,0.25)",
      slate:"#475569", slateSoft:"#f1f5f9",
    };

    // Small inline icon set — used instead of emoji so the whole flow reads as one
    // designed system rather than default platform glyphs.
    const Icon = {
      spark: (p) => <svg width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" {...p}><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill={p.fill||"#fff"}/></svg>,
      arrow: (p) => <svg width={p.size||16} height={p.size||16} viewBox="0 0 24 24" fill="none" {...p}><path d="M5 12h14M13 6l6 6-6 6" stroke={p.stroke||"#fff"} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg>,
      lock: (p) => <svg width={p.size||22} height={p.size||22} viewBox="0 0 24 24" fill="none" {...p}><rect x="5" y="11" width="14" height="9" rx="2" stroke={p.stroke||"#fff"} strokeWidth="1.8"/><path d="M8 11V8a4 4 0 1 1 8 0v3" stroke={p.stroke||"#fff"} strokeWidth="1.8" strokeLinecap="round"/></svg>,
      check: (p) => <svg width={p.size||16} height={p.size||16} viewBox="0 0 24 24" fill="none" {...p}><path d="M5 13l4 4L19 7" stroke={p.stroke||"currentColor"} strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    };

    // Circular gradient badge with an optional pulsing ring — the icon "hero" used
    // wherever the flow wants a moment of emphasis (entry, spin, win, locked).
    const IconBadge = ({ children, gradient, pulse, size=64 }) => (
      <div style={{ position:"relative", width:size, height:size, margin:"0 auto" }}>
        {pulse && <span className="tpp-pulse-ring" style={{ position:"absolute", inset:0, borderRadius:"50%", border:"2px solid rgba(255,255,255,0.55)" }} />}
        <div style={{ position:"relative", width:size, height:size, borderRadius:"50%", background:gradient, display:"flex", alignItems:"center", justifyContent:"center" }}>
          {children}
        </div>
      </div>
    );

    // Gradient "hero" panel used at the top of a card for headline moments.
    const Hero = ({ children, gradient=T.promo, style:s }) => (
      <div style={{ position:"relative", overflow:"hidden", background:gradient, backgroundSize:"180% 180%", animation:"tpp-drift 12s ease-in-out infinite", padding:"34px 26px 30px", ...s }}>
        <span style={{ position:"absolute", width:130, height:130, borderRadius:"50%", background:"rgba(255,255,255,0.14)", top:-56, right:-36 }} />
        <span style={{ position:"absolute", width:85, height:85, borderRadius:"50%", background:"rgba(255,255,255,0.14)", bottom:-46, left:-26 }} />
        <div style={{ position:"relative" }}>{children}</div>
      </div>
    );

    const Eyebrow = ({ children, light }) => (
      <div style={{ display:"inline-block", background: light ? "rgba(255,255,255,0.22)" : T.violetSoft, color: light ? "#fff" : T.violet, fontSize:10.5, fontWeight:800, letterSpacing:"0.09em", textTransform:"uppercase", padding:"5px 12px", borderRadius:999, marginBottom:10 }}>
        {children}
      </div>
    );

    const iS = {
      width:"100%", background:"#f8fafc", border:`1.5px solid ${T.border}`,
      borderRadius:10, padding:"13px 14px", color:T.text, fontSize:15,
      fontFamily:"inherit", outline:"none", boxSizing:"border-box", transition:"border-color .15s, background .15s"
    };
    const iSErr = { ...iS, borderColor:T.red, background:T.redLt };

    // ── Firestore storage ────────────────────────────────────────────────────
    // Unlike the rest of the site (one growing array per doc), spin records get their
    // own document per code / per device. A promo like this can rack up thousands of
    // spins fast, and a single array-doc has a 1MiB ceiling plus gets slower to read
    // and write the bigger it gets. One doc each keeps every read/write small and cheap
    // no matter how many spins run.
    const CODES_COL   = "spin_codes";
    const DEVICES_COL = "spin_devices";
    // How long after a code expires it's still kept around (so staff see "Expired" with
    // real details instead of "not found" if someone shows up late). After this, a
    // Firestore TTL policy on the `purgeAt` field auto-deletes it — set that up once in
    // the Firebase console: Firestore → TTL policies → collection `spin_codes`, field `purgeAt`.
    const PURGE_GRACE_DAYS = 90;

    // ── Prize config ─────────────────────────────────────────────────────────
    // Percentage off, capped at a JMD ceiling — not a flat dollar amount. This is what
    // makes the spin itself meaningful (a real, different outcome every time) while still
    // protecting margin on both small tickets (the % keeps payouts proportional) and large
    // ones (the cap stops a big spin from wiping out a big-ticket repair). Weighted odds;
    // order matters for the cumulative-weight pick below.
    // Colors move along the same blue→violet→coral sweep as the rest of the site's gradient
    // system, instead of unrelated pie-chart hues — so the wheel reads as one brand object,
    // and the rare top prize (25%) lands on the warmest, most "special" end of the sweep.
    const PRIZES = [
      { percent: 10, cap: 500,  weight: 50, color: "#0e88bd", colorLt: "#3fc4f0" },
      { percent: 15, cap: 750,  weight: 30, color: "#5850e0", colorLt: "#8579ff" },
      { percent: 20, cap: 1000, weight: 15, color: "#9147e8", colorLt: "#b87bff" },
      { percent: 25, cap: 1500, weight: 5,  color: "#e0457e", colorLt: "#ff7aa8" },
    ];
    const CODE_VALID_DAYS = 45;

    // 8 cosmetic slices around the wheel, weighted to roughly mirror the real odds above.
    // Real prize selection uses PRIZES' exact weights — this array only controls where the
    // wheel visually lands.
    const SLICES = [10, 15, 10, 20, 10, 15, 10, 25];
    const SEG = 360 / SLICES.length;

    const money = (n) => "JMD $" + n.toLocaleString("en-JM");
    // What a prize's discount would look like applied to a given repair total.
    const discountFor = (prize, repairTotal) => Math.min(Math.round(prize.percent/100 * repairTotal), prize.cap);

    const pickPrize = () => {
      const total = PRIZES.reduce((s,p)=>s+p.weight,0);
      let r = Math.random() * total;
      for (const p of PRIZES) { if (r < p.weight) return p; r -= p.weight; }
      return PRIZES[0];
    };

    const genCode = () => {
      const ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      return "SPIN-" + Array.from({length:6},()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join("");
    };

    // ── Best-effort device fingerprint ──────────────────────────────────────
    // Not bulletproof (nothing client-side is), but combined with a localStorage flag it
    // stops the vast majority of casual repeat-spin attempts, including a cleared-localStorage
    // retry on the same physical device.
    const fingerprint = () => {
      const bits = [
        navigator.userAgent, navigator.language, navigator.platform,
        String(navigator.hardwareConcurrency||""), String(screen.width)+"x"+String(screen.height),
        String(screen.colorDepth), Intl.DateTimeFormat().resolvedOptions().timeZone||""
      ].join("|");
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i=0;i<bits.length;i++){
        const ch = bits.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = (h1 ^ (h1>>>16)) >>> 0;
      h2 = (h2 ^ (h2>>>16)) >>> 0;
      return "fp_" + h1.toString(36) + h2.toString(36);
    };

    // ── Shared UI ────────────────────────────────────────────────────────────
    const Btn = ({ children, onClick, variant="primary", full, disabled, style:s }) => {
      const v = {
        primary: { background:"linear-gradient(135deg,#22c2f2,#0e88bd)", color:"#fff", border:"none", boxShadow:"0 10px 24px -8px rgba(14,136,189,0.5)" },
        ghost:   { background:"#ffffff", color:T.text, border:`1.5px solid ${T.border}`, boxShadow:"none" },
        spin:    { background:"linear-gradient(135deg,#7c5cff,#0e88bd)", color:"#fff", border:"none", boxShadow:"0 14px 28px -10px rgba(76,60,220,0.55)" },
      };
      return (
        <button onClick={onClick} disabled={disabled} style={{ ...v[variant], borderRadius:14, padding:"14px 22px", fontSize:15, fontWeight:700, fontFamily:"'Space Grotesk',sans-serif", cursor:disabled?"not-allowed":"pointer", width:full?"100%":"auto", opacity:disabled?.5:1, transition:"transform .15s, box-shadow .15s", display:"inline-flex", alignItems:"center", justifyContent:"center", gap:8 }}>
          {children}
        </button>
      );
    };

    // padTop lets a Hero sit flush against the card's top edge with no gap/border seam.
    const Card = ({ children, style:s, padTop=true }) => (
      <div style={{ background:T.card, border:`1px solid ${T.border}`, borderRadius:24, overflow:"hidden", padding: padTop ? "32px 26px" : 0, boxShadow:"0 1px 2px rgba(15,23,42,0.04), 0 24px 48px -20px rgba(15,23,42,0.16)", ...s }}>
        {children}
      </div>
    );

    // A small pill link back to another page on the site — placed right under the headline
    // (not buried at the bottom of the card) so it's visible the instant the screen loads,
    // no scrolling required. Real <a> tags, so they work without JS.
    const CompactNavBtn = ({ href, children }) => (
      <a href={href} style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", gap:5, background:T.accentSoft, color:T.accent, border:`1px solid ${T.accentBorder}`, borderRadius:9, padding:"9px 10px", fontSize:12, fontWeight:700, fontFamily:"'Space Grotesk',sans-serif", textDecoration:"none", textAlign:"center", lineHeight:1.2 }}>
        {children}
      </a>
    );

    const WaBtn = ({ label="WhatsApp Us" }) => (
      <a href={`https://wa.me/${WA_NUMBER}`} target="_blank" rel="noopener noreferrer"
        style={{ display:"inline-flex", alignItems:"center", gap:8, background:"#25D366", color:"#fff", padding:"12px 22px", borderRadius:11, fontSize:14, fontWeight:700, fontFamily:"'Space Grotesk',sans-serif", textDecoration:"none", boxShadow:"0 10px 22px -8px rgba(37,211,102,0.55)" }}>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.77.46 3.5 1.35 5.02L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2Zm5.8 14.14c-.24.68-1.4 1.3-1.93 1.36-.5.06-1.08.28-3.62-.75-3.05-1.24-5.02-4.35-5.17-4.55-.15-.2-1.24-1.65-1.24-3.15s.79-2.23 1.07-2.53c.28-.3.6-.37.8-.37.2 0 .4 0 .58.01.19.01.44-.07.68.53.25.6.85 2.08.92 2.23.07.15.12.33.02.53-.1.2-.15.33-.3.5-.15.18-.31.4-.44.53-.15.15-.3.31-.13.6.18.3.79 1.32 1.7 2.14 1.18 1.05 2.16 1.38 2.46 1.53.3.15.48.13.65-.08.18-.2.75-.88.95-1.18.2-.3.4-.25.68-.15.28.1 1.76.83 2.06.98.3.15.5.23.58.35.07.13.07.75-.17 1.42Z"/></svg>
        {label}
      </a>
    );

    // ── The Wheel (SVG) ─────────────────────────────────────────────────────
    const polar = (cx, cy, r, angleDeg) => {
      const a = (angleDeg - 90) * Math.PI / 180; // -90 so 0deg = 12 o'clock
      return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
    };
    const arcPath = (cx, cy, r, startDeg, endDeg) => {
      const s = polar(cx, cy, r, endDeg), e = polar(cx, cy, r, startDeg);
      const large = endDeg - startDeg <= 180 ? 0 : 1;
      return `M ${cx} ${cy} L ${s.x} ${s.y} A ${r} ${r} 0 ${large} 0 ${e.x} ${e.y} Z`;
    };

    const Wheel = React.forwardRef(({ rotation, spinning }, ref) => {
      const size = 300, cx = size/2, cy = size/2, r = size/2 - 6;
      const colorFor = (pct) => (PRIZES.find(p=>p.percent===pct) || PRIZES[0]);
      return (
        <div style={{ position:"relative", width:size, height:size, margin:"0 auto" }}>
          {/* pointer */}
          <div style={{ position:"absolute", top:-4, left:"50%", transform:"translateX(-50%)", zIndex:3,
            width:0, height:0, borderLeft:"14px solid transparent", borderRight:"14px solid transparent",
            borderTop:"24px solid #0f172a", filter:"drop-shadow(0 3px 4px rgba(0,0,0,0.25))" }} />
          <svg
            ref={ref}
            width={size} height={size} viewBox={`0 0 ${size} ${size}`}
            style={{
              display:"block", borderRadius:"50%",
              boxShadow:"0 0 0 8px #fff, 0 0 0 11px rgba(15,23,42,0.12), 0 24px 48px -18px rgba(15,23,42,0.4)",
              transform:`rotate(${rotation}deg)`,
              transition: spinning ? "transform 4.6s cubic-bezier(0.14, 0.75, 0.13, 1)" : "none"
            }}>
            <defs>
              {PRIZES.map(p => (
                <radialGradient key={p.percent} id={`wheelGrad${p.percent}`} cx="50%" cy="50%" r="75%">
                  <stop offset="0%" stopColor={p.colorLt} />
                  <stop offset="100%" stopColor={p.color} />
                </radialGradient>
              ))}
              <linearGradient id="wheelHub" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#22c2f2" />
                <stop offset="50%" stopColor="#7c5cff" />
                <stop offset="100%" stopColor="#fb5f8a" />
              </linearGradient>
            </defs>
            {SLICES.map((pct,i) => {
              const start = i*SEG, end = (i+1)*SEG, mid = start + SEG/2;
              const label = polar(cx, cy, r*0.62, mid);
              return (
                <g key={i}>
                  <path d={arcPath(cx,cy,r,start,end)} fill={`url(#wheelGrad${pct})`} stroke="rgba(255,255,255,0.85)" strokeWidth="2" />
                  <text x={label.x} y={label.y} fill="#fff" fontSize="14" fontWeight="800" fontFamily="'Space Grotesk',sans-serif"
                    textAnchor="middle" dominantBaseline="middle" transform={`rotate(${mid} ${label.x} ${label.y})`}
                    style={{ textShadow:"0 1px 3px rgba(0,0,0,0.35)" }}>
                    {pct}%
                  </text>
                </g>
              );
            })}
            <circle cx={cx} cy={cy} r={24} fill="url(#wheelHub)" stroke="#fff" strokeWidth="3" />
            <text x={cx} y={cy+1} fill="#fff" fontSize="9" fontWeight="800" textAnchor="middle" dominantBaseline="middle" fontFamily="'Space Grotesk',sans-serif">TPP</text>
          </svg>
        </div>
      );
    });

    // ── Screens ──────────────────────────────────────────────────────────────
    function AlreadySpun({ record }) {
      return (
        <Card padTop={false}>
          <Hero gradient="linear-gradient(115deg,#475569,#64748b)" style={{ textAlign:"center", padding:"34px 26px 28px" }}>
            <IconBadge gradient="rgba(255,255,255,0.2)" size={60}><Icon.lock size={26} /></IconBadge>
            <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:20, color:"#fff", marginTop:14 }}>
              This device has already spun
            </div>
          </Hero>
          <div style={{ padding:"24px 26px 30px", textAlign:"center" }}>
            <div style={{ display:"flex", gap:8, marginBottom:20 }}>
              <CompactNavBtn href="/book-repair.html">Book a Repair</CompactNavBtn>
              <CompactNavBtn href="/">Stock Checker</CompactNavBtn>
            </div>
            <div style={{ fontSize:14, color:T.muted, lineHeight:1.6, marginBottom: record ? 18 : 22 }}>
              One spin per customer. {record ? "Here's your prize from before. To redeem, have your discount code saved or just give us the phone number you spun with." : "If you think this is a mistake, our team can look it up by your phone number."}
            </div>
            {record && (
              <div style={{ background:T.violetSoft, border:`1px solid ${T.violetBorder}`, borderRadius:14, padding:"16px 18px", marginBottom:20 }}>
                <div style={{ fontSize:12, fontWeight:700, color:T.violet, textTransform:"uppercase", letterSpacing:"0.05em", marginBottom:6 }}>Your Prize</div>
                <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:26, color:T.text, marginBottom:6 }}>{record.percent}% OFF <span style={{fontSize:14,fontWeight:600,color:T.muted}}>(up to {money(record.cap)})</span></div>
                <div style={{ fontFamily:"monospace", fontSize:16, fontWeight:700, letterSpacing:2, background:"#fff", border:`1px dashed ${T.violetBorder}`, borderRadius:8, padding:"8px 10px", marginBottom:6 }}>{record.code}</div>
                <div style={{ fontSize:12, color:T.muted }}>Valid until {new Date(record.expiresAt).toLocaleDateString("en-JM",{year:"numeric",month:"long",day:"numeric"})}</div>
              </div>
            )}
            <WaBtn label="Contact Us" />
          </div>
        </Card>
      );
    }

    function EntryForm({ onStart }) {
      const [name, setName]   = useState("");
      const [phone, setPhone] = useState("");
      const [err, setErr]     = useState("");
      const [agree, setAgree] = useState(false);

      const go = () => {
        const digits = phone.replace(/\D/g,"");
        if (digits.length < 7) { setErr("Enter a valid phone number so staff can find your prize."); return; }
        if (!agree) { setErr("Please confirm you're 18+ and agree to one spin per customer."); return; }
        onStart({ name: name.trim(), phone: phone.trim() });
      };

      return (
        <Card padTop={false}>
          <Hero style={{ textAlign:"center" }}>
            <IconBadge gradient="rgba(255,255,255,0.2)" pulse><Icon.spark size={28} /></IconBadge>
            <Eyebrow light>New Shop · Intro Offer</Eyebrow>
            <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:23, color:"#fff", letterSpacing:"-0.01em" }}>Spin & Win</div>
          </Hero>
          <div style={{ padding:"24px 26px 30px" }}>
          <div style={{ textAlign:"center", marginBottom:22 }}>
            <div style={{ fontSize:14, color:T.muted, lineHeight:1.6 }}>
              Every spin wins a discount off your next repair — guaranteed. Enter your info below to unlock your spin.
            </div>
          </div>

          <div style={{ display:"flex", flexDirection:"column", gap:14, marginBottom:16 }}>
            <div>
              <label style={{ fontSize:12.5, fontWeight:600, color:T.muted, display:"block", marginBottom:6 }}>Name <span style={{fontWeight:400,color:"#94a3b8"}}>(optional)</span></label>
              <input style={iS} placeholder="e.g. Marcus Brown" value={name} onChange={e=>setName(e.target.value)} />
            </div>
            <div>
              <label style={{ fontSize:12.5, fontWeight:600, color:T.muted, display:"block", marginBottom:6 }}>
                Phone Number <span style={{ color:T.accent }}>*</span>
                <span style={{fontWeight:400,color:"#94a3b8", marginLeft:6}}>staff will look this up when you redeem</span>
              </label>
              <input style={err && phone.replace(/\D/g,"").length<7 ? iSErr : iS} placeholder="e.g. 8761234567" value={phone}
                onChange={e=>{setPhone(e.target.value.replace(/[^0-9+\s()-]/g,"")); setErr("");}} maxLength={15} />
            </div>
          </div>

          <label style={{ display:"flex", alignItems:"flex-start", gap:8, fontSize:12.5, color:T.muted, marginBottom: err ? 8 : 20, cursor:"pointer" }}>
            <input type="checkbox" checked={agree} onChange={e=>{setAgree(e.target.checked); setErr("");}} style={{ marginTop:2 }} />
            <span>I'm 18+ and understand this device can only spin once. One prize per customer.</span>
          </label>
          {err && <div style={{ fontSize:12.5, color:T.red, fontWeight:600, marginBottom:14 }}>{err}</div>}

          <Btn variant="spin" full onClick={go}>Unlock My Spin <Icon.arrow /></Btn>
          </div>
        </Card>
      );
    }

    function SpinScreen({ customer, onWon }) {
      const [rotation, setRotation] = useState(0);
      const [spinning, setSpinning] = useState(false);
      const [busy, setBusy] = useState(false);
      const wheelRef = useRef(null);

      const spin = async () => {
        if (spinning || busy) return;
        setBusy(true);
        const prize = pickPrize();
        // pick a slice (of possibly several) matching this prize, purely cosmetic
        const candidates = SLICES.map((a,i)=>i).filter(i=>SLICES[i]===prize.percent);
        const idx = candidates[Math.floor(Math.random()*candidates.length)];
        const center = idx*SEG + SEG/2;
        const extraSpins = 5 + Math.floor(Math.random()*2); // 5-6 full turns
        const delta = extraSpins*360 + ((360 - center) % 360);
        setSpinning(true);
        setRotation(r => r + delta);

        setTimeout(async () => {
          try {
            await _authReady;
            // genCode() has ~1 billion possible values, but check-and-retry costs nothing
            // and guarantees no two customers ever collide on the same code/doc-id.
            let code = genCode();
            for (let i=0; i<3; i++) {
              const clash = await _db.collection(CODES_COL).doc(code).get();
              if (!clash.exists) break;
              code = genCode();
            }
            const now = new Date();
            const expires = new Date(now.getTime() + CODE_VALID_DAYS*24*60*60*1000);
            const purgeAt = new Date(expires.getTime() + PURGE_GRACE_DAYS*24*60*60*1000);
            const record = {
              code, percent: prize.percent, cap: prize.cap,
              name: customer.name, phone: customer.phone,
              phoneNorm: customer.phone.replace(/\D/g,"").slice(-10), // last-10-digits key so lookups don't care about a leading country code
              deviceId: customer.deviceId,
              createdAt: now.toISOString(), expiresAt: expires.toISOString(),
              redeemed: false, redeemedAt: null, redeemedBy: null,
              repairTotal: null, appliedAmount: null, // filled in by staff at redemption
              // Timestamp (not string) so a Firestore TTL policy can key off it and
              // auto-delete the doc once the grace period passes.
              purgeAt: firebase.firestore.Timestamp.fromDate(purgeAt),
            };
            await _db.collection(CODES_COL).doc(code).set(record);
            await _db.collection(DEVICES_COL).doc(customer.deviceId).set({
              code, createdAt: now.toISOString(), purgeAt: firebase.firestore.Timestamp.fromDate(purgeAt),
            });

            try {
              localStorage.setItem("tpp-spin-done", JSON.stringify({ code, percent: prize.percent, cap: prize.cap, expiresAt: expires.toISOString() }));
            } catch(e) {}

            onWon(record);
          } catch(e) {
            alert("Something went wrong saving your prize. Please try again or contact us.\n\n" + e.message);
            setBusy(false);
            setSpinning(false);
          }
        }, 4700);
      };

      return (
        <Card style={{ textAlign:"center" }}>
          <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontWeight:800, fontSize:18, marginBottom:4 }}>
            {customer.name ? `Good luck, ${customer.name.split(" ")[0]}!` : "Good luck!"}
          </div>
          <div style={{ fontSize:13, color:T.muted, marginBottom:22 }}>Tap the button to spin the wheel.</div>
          <Wheel ref={wheelRef} rotation={rotation} spinning={spinning} />
          <div style={{ marginTop:26 }}>
            <Btn variant="spin" onClick={spin} disabled={spinning || busy} style={{ fontSize:16, padding:"16px 32px" }}>
              {spinning ? "Spinning…" : <React.Fragment>Spin the Wheel <Icon.arrow /></React.Fragment>}
            </Btn>
          </div>
        </Card>
      );
    }

    function WinScreen({ record }) {
      const expiresLabel = new Date(record.expiresAt).toLocaleDateString("en-JM",{year:"numeric",month:"long",day:"numeric"});
      const [copied, setCopied] = useState(false);
      const copy = () => {
        try { navigator.clipboard.writeText(record.code); setCopied(true); setTimeout(()=>setCopied(false), 1800); } catch(e) {}
      };
      return (
        <Card padTop={false}>
          <Hero style={{ textAlign:"center" }}>
            <IconBadge gradient="rgba(255,255,255,0.2)" pulse><Icon.spark size={28} /></IconBadge>
            <Eyebrow light>You Won!</Eyebrow>
            <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:32, color:"#fff", letterSpacing:"-0.01em" }}>{record.percent}% OFF</div>
            <div style={{ fontSize:13, color:"rgba(255,255,255,0.85)", marginTop:4 }}>up to {money(record.cap)}</div>
          </Hero>
          <div style={{ padding:"24px 26px 30px", textAlign:"center" }}>

          <div style={{ display:"flex", gap:8, marginBottom:20 }}>
            <CompactNavBtn href="/book-repair.html">Book a Repair</CompactNavBtn>
            <CompactNavBtn href="/">Stock Checker</CompactNavBtn>
          </div>

          <div style={{ background:T.violetSoft, border:`1px solid ${T.violetBorder}`, borderRadius:14, padding:"18px 18px 16px", marginBottom:18 }}>
            <div style={{ fontSize:11.5, fontWeight:700, color:T.violet, textTransform:"uppercase", letterSpacing:"0.05em", marginBottom:8 }}>Your Redemption Code</div>
            <div style={{ fontFamily:"monospace", fontSize:22, fontWeight:800, letterSpacing:3, color:T.text, marginBottom:10 }}>{record.code}</div>
            <button onClick={copy} style={{ background:"#fff", border:`1px solid ${T.violetBorder}`, borderRadius:8, padding:"7px 14px", fontSize:12.5, fontWeight:700, color:T.violet, cursor:"pointer", fontFamily:"inherit", display:"inline-flex", alignItems:"center", gap:6 }}>
              {copied ? <React.Fragment><Icon.check size={13} stroke={T.violet} /> Copied</React.Fragment> : "Copy Code"}
            </button>
          </div>

          <div style={{ textAlign:"left", background:T.accentSoft, border:`1px solid ${T.accentBorder}`, borderRadius:14, padding:"16px 18px", marginBottom:20, fontSize:13.5, color:T.text, lineHeight:1.7 }}>
            <b>How to redeem:</b> Show this code or give us the phone number <b>{record.phone}</b> when you visit. Staff will apply {record.percent}% off your total repair cost, up to a max of {money(record.cap)}.<br/>
            <b>Valid until:</b> {expiresLabel} ({CODE_VALID_DAYS} days)
          </div>

          <div style={{ fontSize:12.5, color:T.muted, marginBottom:18 }}>Screenshot this screen so you don't lose your code.</div>
          <WaBtn label="Message Us Your Code" />
          </div>
        </Card>
      );
    }

    // ── App ──────────────────────────────────────────────────────────────────
    function App() {
      const [loading, setLoading] = useState(true);
      const [locked, setLocked]   = useState(false);
      const [localRecord, setLocalRecord] = useState(null);
      const [customer, setCustomer] = useState(null); // {name, phone, deviceId}
      const [won, setWon] = useState(null);
      const deviceId = useRef(fingerprint()).current;

      useEffect(() => {
        (async () => {
          try {
            const raw = localStorage.getItem("tpp-spin-done");
            if (raw) { setLocalRecord(JSON.parse(raw)); setLocked(true); setLoading(false); return; }
          } catch(e) {}
          try {
            await _authReady;
            const devDoc = await _db.collection(DEVICES_COL).doc(deviceId).get();
            if (devDoc.exists) setLocked(true);
          } catch(e) {}
          setLoading(false);
        })();
      }, []);

      if (loading) {
        return <div style={{ textAlign:"center", padding:"80px 20px", color:T.muted, fontSize:14 }}>Loading…</div>;
      }
      if (locked) {
        return <AlreadySpun record={localRecord} />;
      }
      if (won) {
        return <WinScreen record={won} />;
      }
      if (customer) {
        return <SpinScreen customer={customer} onWon={setWon} />;
      }
      return <EntryForm onStart={(c)=>setCustomer({ ...c, deviceId })} />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      <div style={{ minHeight:"100vh", background:`linear-gradient(180deg, ${T.black} 0%, ${T.black} 180px, ${T.bg} 180px)`, fontFamily:"'Inter',sans-serif", color:T.text }}>
        <div style={{ maxWidth:460, margin:"0 auto", padding:"28px 18px 60px" }}>
          <div style={{ textAlign:"center", marginBottom:26, color:"#fff" }}>
            <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontWeight:800, fontSize:20, letterSpacing:"-0.01em" }}>The Phone Plug</div>
            <div style={{ fontSize:12.5, color:"rgba(255,255,255,0.65)", marginTop:2 }}>Half Way Tree, Kingston · {PHONE_1}</div>
          </div>
          <App />
        </div>
      </div>
    );
  </script>
</body>
</html>
