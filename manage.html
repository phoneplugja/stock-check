const sendTicketEmail = async (ticket, type = "auto") => {
  if (!ticket.customerEmail) {
    alert("No email address on file for this customer.");
    return false;
  }
  const s = STATUSES.find(x => x.id === ticket.status) || STATUSES[0];
  const params = {
    to_email:      ticket.customerEmail,
    customer_name: ticket.customerName,
    ticket_id:     ticket.id,
    device:        `${ticket.deviceBrand} ${ticket.deviceModel}`,
    issue:         ticket.faultDescription,
    status:        s.label,
    est_cost:      ticket.estimatedCost ? fmtMoney(ticket.estimatedCost) : "TBD",
    final_cost:    ticket.finalCost ? fmtMoney(ticket.finalCost) : ticket.estimatedCost ? fmtMoney(ticket.estimatedCost) : "TBD",
    est_ready:     ticket.estimatedCompletion ? fmtDate(ticket.estimatedCompletion) : "TBD",
  };
  // Pick the right template based on ticket status
  let tpl;
  if (type === "ready" || ticket.status === "ready") {
    tpl = EMAILJS_TPL_READY;
  } else if (["awaiting_parts", "in_repair"].includes(ticket.status)) {
    tpl = EMAILJS_TPL_UPDATE;
  } else {
    tpl = EMAILJS_TPL_CONFIRM;
  }
  try {
    await emailjs.send(EMAILJS_SERVICE_ID, tpl, params);
    return true;
  } catch (e) {
    console.error("EmailJS error:", e);
    alert("Email failed to send. Check console for details.");
    return false;
  }
};

const ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const genId = (existing = []) => {
  let id;
  do {
    id = "TPP-" + Array.from({
      length: 6
    }, () => ALPHA[Math.floor(Math.random() * ALPHA.length)]).join("");
  } while (existing.includes(id));
  return id;
};
const todayStr = () => new Date().toISOString().slice(0, 10);
const fmt = iso => {
  if (!iso) return "—";
  try {
    return new Date(iso).toLocaleString("en-GB", {
      day: "2-digit",
      month: "short",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    });
  } catch {
    return iso;
  }
};
const fmtDate = iso => {
  if (!iso) return "—";
  try {
    return new Date(iso).toLocaleDateString("en-GB", {
      day: "2-digit",
      month: "short",
      year: "numeric"
    });
  } catch {
    return iso;
  }
};
const fmtMoney = n => {
  const num = parseFloat(n) || 0;
  return "JMD " + Math.abs(num).toLocaleString("en-JM", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
};

const load = async key => {
  try {
    const s = await _db.collection('tpp').doc(key).get();
    return s.exists ? s.data().v : null;
  } catch (e) {
    console.error("FB load:", e);
    return null;
  }
};
const save = async (key, val) => {
  try {
    await _db.collection('tpp').doc(key).set({ v: val, ts: Date.now() });
  } catch (e) {
    console.error("FB save:", e);
  }
};

function BarcodeScanner({onDetected,onClose}){
  const E=React.createElement;
  const videoRef=React.useRef(null);
  const [error,setError]=useState("");
  const [manualCode,setManualCode]=useState("");
  useEffect(()=>{
    let stream=null,interval=null;
    (async()=>{
      try{
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
        if(videoRef.current)videoRef.current.srcObject=stream;
        if("BarcodeDetector" in window){
          const detector=new BarcodeDetector({formats:["ean_13","ean_8","code_128","code_39","upc_a","upc_e","qr_code"]});
          interval=setInterval(async()=>{
            if(videoRef.current){try{const codes=await detector.detect(videoRef.current);if(codes.length>0){clearInterval(interval);onDetected(codes[0].rawValue);}}catch{}}
          },300);
        }else{setError("Camera scanning not supported. Use manual entry.");}
      }catch{setError("Camera access denied. Enter barcode manually.");}
    })();
    return()=>{clearInterval(interval);if(stream)stream.getTracks().forEach(t=>t.stop());};
  },[]);
  return E("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:2000,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,padding:20}},
    E("div",{style:{color:"#fff",fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:18}},"📷 Scan Barcode"),
    !error&&E("video",{ref:videoRef,autoPlay:true,playsInline:true,style:{width:"100%",maxWidth:360,borderRadius:12,border:"3px solid "+T.blue}}),
    error&&E("div",{style:{color:T.amber,fontSize:13,textAlign:"center",maxWidth:320}},error),
    E("div",{style:{display:"flex",gap:8,width:"100%",maxWidth:360}},
      E(Input,{placeholder:"Or type barcode manually...",value:manualCode,onChange:e=>setManualCode(e.target.value),onKeyDown:e=>e.key==="Enter"&&manualCode.trim()&&onDetected(manualCode.trim()),style:{flex:1,background:"#fff"}}),
      E(Btn,{onClick:()=>manualCode.trim()&&onDetected(manualCode.trim())},"→")
    ),
    E(Btn,{variant:"ghost",onClick:onClose,style:{color:"#fff",border:"1px solid rgba(255,255,255,0.3)"}},"✕ Cancel")
  );
}

const IMEI_CATEGORIES = ["Like New Samsung","Like New iPhones","New in box","HOTWAV","Tablets"];

const isImeiCategory = (cat) => IMEI_CATEGORIES.includes(cat);

const getAvailableStock = (product) => {
  if (!product) return 0;
  if (isImeiCategory(product.category)) {
    return (product.units||[]).filter(u=>u.status==="Available").length;
  }
  return product.stock || 0;
};

const saveCatalog = async (products) => {
  if (!products) return;
  if (products.length > 80) {
    const CHUNK = 80, chunks = [];
    for (let i = 0; i < products.length; i += CHUNK) chunks.push(products.slice(i, i+CHUNK));
    await save("tpp-products-meta", { total:products.length, chunks:chunks.length, updated:new Date().toISOString() });
    for (let i = 0; i < chunks.length; i++) await save(`tpp-products-chunk-${i}`, chunks[i]);
  } else {
    await save("tpp-products", products);
  }
};

const loadCatalog = async () => {
  try {
    const meta = await load("tpp-products-meta");
    if (meta && meta.chunks) {
      const all = [];
      for (let i = 0; i < meta.chunks; i++) {
        const c = await load(`tpp-products-chunk-${i}`);
        if (Array.isArray(c)) all.push(...c);
      }
      return all;
    }
  } catch {}
  return await loadArr("tpp-products");
};

  const [ncbTransfer,setNcbTransfer]=useState("");

  const [otherPayment,setOtherPayment]=useState("");
  const [appliedCredit,setAppliedCredit]=useState(null); // store credit applied
  const [note,setNote]=useState("");

  const [lastSale,setLastSale]=useState(null);
  // History
  const [selectedSale,setSelectedSale]=useState(null);
  const [unitPicker,setUnitPicker]=useState(null); // {product, units[]}
  const [showVoided,setShowVoided]=useState(false);
  const [historySearch,setHistorySearch]=useState("");
  const [emailModal,setEmailModal]=useState(null); // {sale, email}
  const [emailSending,setEmailSending]=useState(false);
  // Exchange/Return
  const [isExchange,setIsExchange]=useState(false);
  const [isReturn,setIsReturn]=useState(false);
  const [exchangeOrigSale,setExchangeOrigSale]=useState(null);
  const [returnOrigSale,setReturnOrigSale]=useState(null);
  const [returnItems,setReturnItems]=useState([]);

  useEffect(()=>{

      const t=await loadArr("tpp-tickets-v1");
      setTickets((t||[]).filter(tk=>["received","diagnosing","awaiting_parts","in_repair","ready"].includes(tk.status)));
      const [s,c,pk]=await Promise.all([loadArr("tpp-sales"),loadArr("tpp-customers"),loadArr("tpp-parked-sales")]);
      setSales(s||[]); setCustomers(c||[]); setParkedSales(pk||[]);
      const cr=await loadArr("tpp-store-credits");
      setCredits((cr||[]).filter(c=>!c.used&&new Date(c.expiresAt)>new Date()));
    })();
  },[]);

  // Customer autocomplete
  useEffect(()=>{
    const q=(customerName+customerPhone+customerEmail).toLowerCase().trim();
    if(!q){setCustomerSuggestions([]);return;}
    setCustomerSuggestions(customers.filter(c=>
      c.name?.toLowerCase().includes(customerName.toLowerCase())||
      (customerPhone&&c.phone?.includes(customerPhone))||
      (customerEmail&&c.email?.toLowerCase().includes(customerEmail.toLowerCase()))
    ).slice(0,4));
  },[customerName,customerPhone,customerEmail,customers]);

  // Search phones + products + tickets
  useEffect(()=>{
    if(!search.trim()){setSearchResults([]);return;}
    const q=search.toLowerCase();
    // Search unified catalog — IMEI products show available units, others show stock count
    const catalogRes=products
      .filter(p=>{
        if(!p.name) return false;
        return p.name.toLowerCase().includes(q)||(p.barcode||"").includes(search)||(p.sku||"").includes(search);
      })
      .slice(0,10).map(p=>{
        const isImei=isImeiCategory(p.category);
        const avail=getAvailableStock(p);
        const availUnits=isImei?(p.units||[]).filter(u=>u.status==="Available"):[];
        return {
          type:isImei?"imei_product":"product",
          id:p.id, name:p.name,
          price:parseFloat(p.price)||0,
          stock:avail,
          availUnits,
          raw:p,
          outOfStock: avail<=0 && !isImei
        };
      });
    const phoneRes=[];
    const prodRes=catalogRes;
    const tickRes=tickets
      .filter(t=>t.id?.toLowerCase().includes(q)||t.customerName?.toLowerCase().includes(q)||t.customerPhone?.includes(q))
      .slice(0,3).map(t=>({type:"ticket",id:t.id,name:`Repair Deposit — ${t.customerName} (${t.id})`,price:0,subLabel:`${t.deviceBrand||""} ${t.deviceModel||""} · ${t.status}`,raw:t}));
    setSearchResults([...phoneRes,...prodRes,...tickRes]);
  },[search,phones,products,tickets]);

  const addToCart=(item)=>{
    if(item.type==="ticket"){
      if(cart.find(c=>c.ticketId===item.id)){alert("This ticket is already in the cart.");return;}
      setCart(c=>[...c,{type:"ticket",id:item.id,name:item.name,price:0,qty:1,ticketId:item.id,isDeposit:true,raw:item.raw}]);

              updatedCatalog[pidx].stock=updatedCatalog[pidx].units.filter(u=>u.status==="Available").length;

          // Decrement stock for non-IMEI products

          });
          await saveCatalog(updatedCatalog);
          setProducts(updatedCatalog);
        }
      } catch(e){ console.error("Catalog update after sale:", e); }

      // Log deposit against ticket
      if(hasTicket){

          await save("tpp-tickets-v1",updatedTickets);
        }
      }

      // Mark store credit as used
      if(appliedCredit){
        const allCredits=await loadArr("tpp-store-credits");
        const updatedCredits=allCredits.map(c=>c.id===appliedCredit.id?{...c,used:true,usedAt:new Date().toISOString(),usedOnSale:saleId}:c);
        await save("tpp-store-credits",updatedCredits);
      }

      // Save customer
      await saveCustomer(customerName,customerPhone,customerEmail);

      setLastSale(sale);resetForm();
    }finally{setProcessing(false);}
  };

  const voidSale=async(sale)=>{
    const reason=prompt("Reason for voiding?");
    if(!reason)return;
    const allSales=await loadArr("tpp-sales");
    const updated=allSales.map(s=>s.id===sale.id?{...s,voided:true,voidReason:reason,voidedAt:new Date().toISOString()}:s);

  // Exchange
  const startExchange=(origSale)=>{
    setExchangeOrigSale(origSale);setIsExchange(true);
    setCustomerName(origSale.customerName||"");setCustomerPhone(origSale.customerPhone||"");setCustomerEmail(origSale.customerEmail||"");

  // Exchange diff calculated live

  const exchDiff=isExchange?total-exchOrigTotal:0;

  // Return

    }
    // Return phones to Under Testing
    let updatedPhones=[...phones];
    selected.filter(i=>i.type==="phone"&&i.imei).forEach(item=>{
      updatedPhones=updatedPhones.map(p=>p.imei===item.imei?{...p,availability:"Under Testing",history:[...(p.history||[]),{status:"Under Testing",ts:new Date().toISOString(),note:`Returned from sale ${returnOrigSale.id}`}]}:p);
    });

    // Issue store credit if selected
    if(returnCredit==="store_credit"){
      const credit={id:Date.now().toString(),customerName,customerPhone,amount:refundTotal,issuedAt:new Date().toISOString(),expiresAt:new Date(Date.now()+365*24*60*60*1000).toISOString(),sourceSaleId:returnOrigSale.id,used:false};
      const allCredits=await loadArr("tpp-store-credits");
      await save("tpp-store-credits",[credit,...allCredits]);
    }
    // Log return
    const existing=await loadArr("tpp-sales");
    const returnSale={id:genSaleId(existing.map(s=>s.id),"RCP"),customerName,customerPhone,customerEmail,items:selected.map(i=>({...i,price:-Math.abs(i.price),qty:i.returnQty||1})),subtotal:-refundTotal,discounts:[],totalDiscount:0,total:-refundTotal,refundType:returnCredit,refundAmount:refundTotal,returnOrigSaleId:returnOrigSale.id,isReturn:true,servedBy:user?.name||"",createdAt:new Date().toISOString(),date:todayStr()};
    await save("tpp-sales",[returnSale,...existing]);setSales(prev=>[returnSale,...prev]);
    alert(`↩ Return processed — ${fmtMoney(refundTotal)}\n${returnCredit==="store_credit"?"🏪 Store credit issued (valid 1 year).":returnCredit==="bank_transfer"?"🏦 Bank transfer refund to be processed.":"💵 Cash refund to be given."}\n${selected.filter(i=>i.type==="phone").length>0?"📱 Returned phones sent to testing queue.":""}`);
    resetForm();setView("pos");
  };

  // ── History view ─────────────────────────────────────────────────────────────
  if(view==="history"){
    const filtered=sales.filter(s=>showVoided?true:!s.voided).filter(s=>!historySearch||s.id?.toLowerCase().includes(historySearch.toLowerCase())||s.customerName?.toLowerCase().includes(historySearch.toLowerCase())||s.customerPhone?.includes(historySearch)).slice(0,60);
    if(selectedSale)return E("div",{style:{maxWidth:600,margin:"0 auto"}},
      // Email modal

          E(Field,{label:"Send to email"},E(Input,{type:"email",value:emailModal.email,onChange:e=>setEmailModal(prev=>({...prev,email:e.target.value})),placeholder:"Email address"})),
          E("div",{style:{fontSize:12,color:T.muted,marginBottom:12}},"You can change this email — it won't update the customer record."),
          E("div",{style:{display:"flex",gap:8}},

            E(Btn,{disabled:emailSending||!emailModal.email,onClick:async()=>{setEmailSending(true);const ok=await sendReceiptEmail(emailModal.sale,emailModal.email);setEmailSending(false);setEmailModal(null);alert(ok?"✅ Receipt sent!":"❌ Failed to send. Check EmailJS settings.");}},emailSending?"Sending…":"Send")
          )

        E("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},

          !selectedSale.voided&&E(Btn,{variant:"ghost",style:{fontSize:11,padding:"6px 10px"},onClick:()=>setEmailModal({sale:selectedSale,email:selectedSale.customerEmail||""})},"📧 Email"),

const DEBT_CATEGORIES = ["Credit Card", "Loan", "Pay-in-4", "Other"];
const DEBT_TYPES = ["Personal", "Business"];
const CAT_COLORS = { "Credit Card":"#378ADD", "Loan":"#BA7517", "Pay-in-4":"#7C3AED", "Other":"#888780" };
const CAT_ICONS  = { "Credit Card":"💳", "Loan":"🏦", "Pay-in-4":"🔵", "Other":"📋" };

// ── Helpers ──────────────────────────────────────────────────────────────────
function daysUntilDate(dateStr) {
  if (!dateStr) return null;
  return Math.ceil((new Date(dateStr) - new Date()) / 86400000);
}

function daysUntilDueDay(day) {
  if (!day) return null;
  const now = new Date();
  const due = new Date(now.getFullYear(), now.getMonth(), parseInt(day));
  if (due < now) due.setMonth(due.getMonth() + 1);
  return Math.ceil((due - now) / 86400000);
}

function estPayoffDate(balance, apr, minPayment) {
  if (!balance || balance <= 0) return "Paid off";
  if (!apr || apr <= 0) {
    if (!minPayment || minPayment <= 0) return "—";
    const months = Math.ceil(balance / minPayment);
    const d = new Date(); d.setMonth(d.getMonth() + months);
    return d.toLocaleDateString("en-US",{month:"short",year:"numeric"});
  }
  const r = apr / 100 / 12;
  const pmt = minPayment || 0;
  if (pmt <= balance * r) return "Interest only — no payoff";
  let bal = balance, months = 0;
  while (bal > 0.01 && months < 600) { bal = bal*(1+r) - pmt; months++; }
  if (months >= 600) return "∞";
  const d = new Date(); d.setMonth(d.getMonth() + months);
  return d.toLocaleDateString("en-US",{month:"short",year:"numeric"});
}

function getAlerts(debts, payments) {
  const alerts = [];
  const today = new Date();
  debts.forEach(debt => {
    if ((debt.balance||0) <= 0) return;
    const debtPayments = payments.filter(p=>p.debtId===debt.id);
    const lastPmt = debtPayments[0];
    const daysSincePayment = lastPmt ? Math.floor((today - new Date(lastPmt.date)) / 86400000) : null;

    // Due date alerts
    if (debt.nextPaymentDate) {
      const days = daysUntilDate(debt.nextPaymentDate);
      if (days < 0) alerts.push({ level:"red", debt:debt.name, msg:`Payment overdue since ${fmtDate(debt.nextPaymentDate)}`, debtId:debt.id });
      else if (days <= 3) alerts.push({ level:"red", debt:debt.name, msg:`Payment due in ${days} day${days===1?"":"s"} (${fmtDate(debt.nextPaymentDate)})`, debtId:debt.id });
      else if (days <= 7) alerts.push({ level:"amber", debt:debt.name, msg:`Payment due ${fmtDate(debt.nextPaymentDate)}`, debtId:debt.id });
    } else if (debt.due) {
      const days = daysUntilDueDay(debt.due);
      if (days <= 3) alerts.push({ level:"red", debt:debt.name, msg:`Payment due in ${days} day${days===1?"":"s"} (day ${debt.due})`, debtId:debt.id });
      else if (days <= 7) alerts.push({ level:"amber", debt:debt.name, msg:`Payment due in ${days} days (day ${debt.due})`, debtId:debt.id });
    }

    // No payment logged in 35+ days
    if (daysSincePayment !== null && daysSincePayment > 35) {
      alerts.push({ level:"amber", debt:debt.name, msg:`No payment logged in ${daysSincePayment} days — confirm payment was made`, debtId:debt.id });
    } else if (daysSincePayment === null && debt.createdAt) {
      const daysSinceAdded = Math.floor((today - new Date(debt.createdAt)) / 86400000);
      if (daysSinceAdded > 35) alerts.push({ level:"blue", debt:debt.name, msg:`No payments logged yet — tap to log your first payment`, debtId:debt.id });
    }

    // Not on autopay warning
    if (!debt.autopay && debt.due) {
      const days = daysUntilDueDay(debt.due);
      if (days <= 5) alerts.push({ level:"amber", debt:debt.name, msg:`Not on autopay — manual payment needed by day ${debt.due}`, debtId:debt.id });
    }

    // Credit card: statement closing soon
    if (debt.category === "Credit Card" && debt.statementDay) {
      const now = new Date();
      let stmtDate = new Date(now.getFullYear(), now.getMonth(), parseInt(debt.statementDay));
      if (stmtDate < now) stmtDate.setMonth(stmtDate.getMonth()+1);
      const days = Math.ceil((stmtDate - now) / 86400000);
      if (days <= 5) alerts.push({ level:"blue", debt:debt.name, msg:`Statement closes in ${days} day${days===1?"":"s"} — pay down before then to reduce reported utilization`, debtId:debt.id });
    }

    // Pay-in-4: next installment
    if (debt.category === "Pay-in-4" && debt.nextInstallmentDate) {
      const days = daysUntilDate(debt.nextInstallmentDate);
      if (days !== null && days <= 5) alerts.push({ level: days<=2?"red":"amber", debt:debt.name, msg:`Next installment ${days<=0?"overdue":"due in "+days+" days"}: ${fmtMoney(debt.nextInstallmentAmount||0)}`, debtId:debt.id });
    }
  });
  return alerts;
}

function StockReceiving({ products, onProductsUpdate, invoiceType, allPhones = [], onPhonesDone }) {
  const E = React.createElement;
  const [drafts, setDrafts] = useState([]);
  const [activeDraft, setActiveDraft] = useState(null);
  const [history, setHistory] = useState([]);
  const [view, setView] = useState("main"); // "main" | "po" | "history"
  const [saving, setSaving] = useState(false);
  const [submitted, setSubmitted] = useState(false);

  // AI scanning state
  const [scanning, setScanning] = useState(false);
  const [scanError, setScanError] = useState("");
  const fileInputRef = React.useRef(null);

  const scanInvoice = async (file) => {
    // Phone invoices go through InvoiceImporter (already has full flow)
    if (invoiceType === "phones") {
      alert("For phone invoices, use the 📱 Phones tab → Import Invoice. This gives you full IMEI entry and per-device verification.");
      return;
    }
    setScanning(true); setScanError("");
    const typeHints = {
      accessories: "accessories like phone cases, chargers, cables, screen protectors, headphones",
      parts: "phone repair parts like screens, batteries, charging ports, cameras, back glass",
      gadgets: "tech gadgets like smartwatches, earbuds, powerbanks, tablets",
      mixture: "a mix of phone accessories, parts, and gadgets"
    };
    const typeHint = typeHints[invoiceType] || "phone shop accessories and parts";
    try {
      const base64 = await new Promise((res, rej) => {
        const reader = new FileReader();
        reader.onload = () => res(reader.result.split(",")[1]);
        reader.onerror = rej;
        reader.readAsDataURL(file);
      });
      const isPDF = file.type === "application/pdf";
      const mediaType = isPDF ? "application/pdf" : file.type || "image/jpeg";

      const response = await fetch("/api/claude", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{
            role: "user",
            content: [
              isPDF
                ? { type: "document", source: { type: "base64", media_type: mediaType, data: base64 } }
                : { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
              { type: "text", text: `You are parsing a supplier invoice for a phone shop. This invoice contains ${typeHint}. Extract all line items and invoice details.

Return ONLY valid JSON, no markdown:
{
  "supplier": "supplier name or empty string",
  "poRef": "invoice number or empty string",
  "invoiceTotal": "total as number string or empty string",
  "receivedDate": "date YYYY-MM-DD or empty string",
  "lines": [
    {
      "name": "exact product name from invoice",
      "qty": "quantity as number string",
      "costPerUnit": "unit cost as number string",
      "category": "one of: Accessories - Samsung Cases, Accessories - Apple Cases, Accessories- Samsung, Accessories- Apple, Parts & Components, Gadgets, Tablets, Other",
      "barcode": "barcode or SKU if visible, else empty string"
    }
  ]
}` }
            ]
          }]
        })
      });

      const data = await response.json();
      const text = data.content?.find(c=>c.type==="text")?.text || "";
      const clean = text.replace(/```json|```/g,"").trim();
      const parsed = JSON.parse(clean);

      if (parsed.supplier) setPO("supplier", parsed.supplier);
      if (parsed.poRef) setPO("poRef", parsed.poRef);
      if (parsed.invoiceTotal) setPO("invoiceTotal", parsed.invoiceTotal);
      if (parsed.receivedDate) setPO("receivedDate", parsed.receivedDate);

      if (parsed.lines?.length > 0) {
        const newLines = parsed.lines.map(line => {
          const q = (line.name||"").toLowerCase();
          // Try to match to existing catalog
          const match = products.find(p =>
            p.name.toLowerCase().includes(q.slice(0,12)) ||
            q.includes(p.name.toLowerCase().slice(0,12)) ||
            (line.barcode && p.barcode === line.barcode)
          );
          return {
            productId: match?.id || null,
            name: match?.name || line.name,
            aiName: line.name,
            category: match?.category || line.category || "Other",
            isNew: !match,
            costPerUnit: line.costPerUnit || "",
            qty: line.qty || "1",
            barcode: line.barcode || match?.barcode || "",
            sku: match?.sku || "",
            price: match?.price || 0,
            needsVerification: !match
          };
        });
        setLines(newLines);
        setView("po");
        alert(`✅ Scanned ${parsed.lines.length} line items. Review — items flagged ⚠️ need to be matched or confirmed as new.`);
      } else {
        setScanError("No line items found. Try a clearer image or enter manually.");
      }
    } catch(e) {
      setScanError("Scan failed: " + e.message);
      console.error(e);
    } finally { setScanning(false); }
  };

  // PO header state
  const emptyPO = { supplier:"", poRef:"", invoiceTotal:"", shipping:"", tax:"", receivedDate:todayStr(), notes:"" };
  const [po, setPOS] = useState(emptyPO);
  const [savedPOs, setSavedPOs] = useState([]);
  const [showPOPicker, setShowPOPicker] = useState(false);

  useEffect(() => {
    loadArr("tpp-purchase-orders").then(all => setSavedPOs((all||[]).filter(p=>p.status==="open")));
  }, [view]);
  const setPO = (k,v) => setPOS(p=>({...p,[k]:v}));

  // Line items
  const [lines, setLines] = useState([]);
  const [search, setSearch] = useState("");
  const [catFilter, setCatFilter] = useState("all");
  const [searchResults, setSearchResults] = useState([]);
  const [showNewLine, setShowNewLine] = useState(false);
  const emptyNew = { name:"", category:"Accessory", price:"", costPerUnit:"", barcode:"", qty:"1", sku:"" };
  const [newLine, setNewLine] = useState(emptyNew);
  const setNL = (k,v) => setNewLine(p=>({...p,[k]:v}));

  useEffect(() => {
    loadArr("tpp-stock-receives").then(setHistory);
    loadArr("tpp-po-drafts").then(setDrafts);
  }, []);

  // Categories from products
  const categories = ["all", ...Array.from(new Set(products.map(p=>p.category).filter(Boolean))).sort()];

  // Search
  useEffect(() => {
    if (!search.trim()) { setSearchResults([]); return; }
    const q = search.toLowerCase();
    const results = products.filter(p => {
      const matchCat = catFilter === "all" || p.category === catFilter;
      const matchQ = p.name.toLowerCase().includes(q) || (p.barcode||"").includes(q) || (p.sku||"").toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
      return matchCat && matchQ;
    }).slice(0,8);
    setSearchResults(results);
  }, [search, catFilter, products]);

  const lineTotal = lines.reduce((s,l) => s + (parseFloat(l.costPerUnit)||0)*(parseInt(l.qty)||0), 0);
  const invoiceAmt = parseFloat(po.invoiceTotal)||0;
  const variance = invoiceAmt > 0 ? invoiceAmt - lineTotal : 0;
  const reconciled = invoiceAmt > 0 && Math.abs(variance) < 0.01;

  const addExistingLine = (product) => {
    const existing = lines.find(l=>l.productId===product.id);
    if (existing) { setLines(ls=>ls.map(l=>l.productId===product.id?{...l,qty:String(parseInt(l.qty)+1)}:l)); }
    else { setLines(ls=>[...ls, { productId:product.id, name:product.name, category:product.category, isNew:false, costPerUnit:String(product.cost||0), qty:"1", barcode:product.barcode||"", sku:product.sku||"", price:product.price||0 }]); }
    setSearch(""); setSearchResults([]);
  };

  const addNewLine = () => {
    if (!newLine.name.trim()||!newLine.qty) { alert("Name and quantity required."); return; }
    setLines(ls=>[...ls, { ...newLine, productId:null, isNew:true }]);
    setNewLine(emptyNew); setShowNewLine(false);
  };

  const removeLine = (i) => setLines(ls=>ls.filter((_,idx)=>idx!==i));
  const updateLine = (i,k,v) => setLines(ls=>ls.map((l,idx)=>idx===i?{...l,[k]:v}:l));

  const saveDraft = async () => {
    const draft = { id: activeDraft?.id || Date.now().toString(), po, lines, savedAt: new Date().toISOString() };
    const updated = drafts.filter(d=>d.id!==draft.id);
    updated.unshift(draft);
    await save("tpp-po-drafts", updated);
    setDrafts(updated); setActiveDraft(draft);
    alert("✅ Draft saved. Resume anytime from the main screen.");
  };

  const loadDraft = (draft) => {
    setPOS(draft.po); setLines(draft.lines); setActiveDraft(draft); setView("po");
  };

  const deleteDraft = async (id) => {
    const updated = drafts.filter(d=>d.id!==id);
    await save("tpp-po-drafts", updated); setDrafts(updated);
    if (activeDraft?.id===id) { setPOS(emptyPO); setLines([]); setActiveDraft(null); }
  };

  const receiveAll = async () => {
    if (lines.length===0) { alert("Add at least one line item."); return; }
    if (invoiceAmt > 0 && !reconciled) {
      const proceed = confirm(`⚠️ Invoice total (${fmtMoney(invoiceAmt)}) does not match line item sum (${fmtMoney(lineTotal)}).

Variance: ${fmtMoney(Math.abs(variance))} ${variance>0?"short":"over"}.

Proceed anyway?`);
      if (!proceed) return;
    }
    const hasPO = po.supplier.trim() || po.poRef.trim();
    setSaving(true);
    try {
      let updatedProducts = [...products];
      const receiveEntries = [];
      const todos = await loadArr("tpp-todos");
      const newTodos = [];

      for (const line of lines) {
        const qty = parseInt(line.qty)||0;
        const cost = parseFloat(line.costPerUnit)||0;

        if (line.isNew) {
          // Create new product
          const newId = `new-${Date.now()}-${Math.random().toString(36).slice(2,6)}`;
          const newProduct = { id:newId, name:line.name, category:line.category, price:parseFloat(line.price)||0, cost, stock:qty, barcode:line.barcode||"", sku:line.sku||newId, variable_price:false, purchase_pending:!hasPO };
          updatedProducts.unshift(newProduct);
          receiveEntries.push({ id:Date.now().toString()+Math.random(), type:"new", productId:newId, productName:line.name, qty, costPerUnit:cost, poRef:po.poRef, supplier:po.supplier, receivedDate:po.receivedDate, purchase_pending:!hasPO, createdAt:new Date().toISOString() });
        } else {
          // Update existing
          updatedProducts = updatedProducts.map(p => p.id===line.productId ? {...p, stock:(p.stock||0)+qty, cost:cost||p.cost, purchase_pending:!hasPO} : p);
          receiveEntries.push({ id:Date.now().toString()+Math.random(), type:"existing", productId:line.productId, productName:line.name, qty, costPerUnit:cost, poRef:po.poRef, supplier:po.supplier, receivedDate:po.receivedDate, purchase_pending:!hasPO, createdAt:new Date().toISOString() });
        }
      }

      if (!hasPO) {
        newTodos.push({ id:Date.now().toString(), text:`Add purchase details for PO received ${po.receivedDate} — ${lines.length} items, total JMD ${fmtMoney(lineTotal)}`, createdAt:new Date().toISOString(), resolved:false, source:"system", priority:"high" });
      }

      await onProductsUpdate(updatedProducts);
      const updatedHistory = [...receiveEntries, ...history];
      await save("tpp-stock-receives", updatedHistory);
      setHistory(updatedHistory);
      if (newTodos.length) await save("tpp-todos", [...newTodos, ...todos]);

      // Remove draft if this was one
      if (activeDraft) {
        const updatedDrafts = drafts.filter(d=>d.id!==activeDraft.id);
        await save("tpp-po-drafts", updatedDrafts); setDrafts(updatedDrafts);
      }

      // If invoiceType is phones, prompt to add to phone inventory
      if (invoiceType === "phones" && receiveEntries.length > 0) {
        const allCurrentPhones = allPhones ? [...allPhones] : await loadArr("tpp-phones-v1") || [];
        const newPhoneEntries = [];
        for (const entry of receiveEntries) {
          for (let u = 0; u < entry.qty; u++) {
            const imei = prompt(`Enter IMEI for unit ${u+1} of ${entry.qty}:\n${entry.productName}\n(Leave blank to skip this unit)`);
            if (imei === null) break; // cancelled
            const phone = {
              id: Date.now().toString() + Math.random().toString(36).slice(2,6),
              make: entry.make || "", model: entry.model || entry.productName,
              storage: entry.storage || "", color: entry.color || "",
              imei: imei.trim(), availability: "Available",
              total_invoice: String(entry.costPerUnit||0),
              expected_sell: "", order_number: po.poRef||"",
              supplier: po.supplier||"", receivedDate: po.receivedDate,
              source: "po_receive", poRef: po.poRef||"",
              createdAt: new Date().toISOString(),
              history: [{ status:"Available", ts:new Date().toISOString(), note:`Received via PO: ${po.poRef||"manual"}` }]
            };
            newPhoneEntries.push(phone);
          }
        }
        if (newPhoneEntries.length > 0 && onPhonesDone) {
          const updatedPhones = [...newPhoneEntries, ...allCurrentPhones];
          await save("tpp-phones-v1", updatedPhones);
          onPhonesDone(updatedPhones);
        }
      }

      setPOS(emptyPO); setLines([]); setActiveDraft(null); setView("main");
      setSaving(false);
      const phoneMsg = invoiceType==="phones" ? " Phone inventory updated." : "";
      alert(`✅ Received ${lines.length} line items across ${receiveEntries.reduce((s,e)=>s+e.qty,0)} total units.${phoneMsg}${!hasPO?" ⚠️ To-do created to add purchase details.":""}`);
      if (onPhonesDone && invoiceType==="phones") onPhonesDone();
    } catch(e) {
      setSaving(false);
      alert("Error: " + e.message);
    }
  };

  // ── MAIN VIEW ─────────────────────────────────────────────────────────────
  if (view === "main") return E("div", { style:{ maxWidth:600, margin:"0 auto" } },
    E("div", { style:{ marginBottom:20 } },
      E("h2", { style:{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:20, margin:0 } }, "📥 Receive Stock"),
      E("div", { style:{ fontSize:12, color:T.muted, marginTop:4 } }, "Log incoming stock against a purchase order. Draft and resume at any time.")
    ),
    drafts.length > 0 && E("div", { style:{ marginBottom:20 } },
      E(ST, null, `Saved Drafts (${drafts.length})`),
      E("div", { style:{ display:"flex", flexDirection:"column", gap:8 } },
        drafts.map((d,i) => E(Card, { key:i, style:{ borderLeft:`3px solid ${T.amber}` } },
          E("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center" } },
            E("div", null,
              E("div", { style:{ fontWeight:600, fontSize:13 } }, d.po.supplier||"No supplier", d.po.poRef ? ` — ${d.po.poRef}` : ""),
              E("div", { style:{ fontSize:11, color:T.muted, marginTop:2 } }, `${d.lines.length} line items · Saved ${fmtDate(d.savedAt)}`)
            ),
            E("div", { style:{ display:"flex", gap:8 } },
              E(Btn, { style:{ fontSize:12, padding:"6px 12px" }, onClick:()=>loadDraft(d) }, "▶ Continue"),
              E(Btn, { variant:"danger", style:{ fontSize:12, padding:"6px 12px" }, onClick:()=>deleteDraft(d.id) }, "✕")
            )
          )
        ))
      )
    ),
    E("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 } },
      E("button", { onClick:()=>setView("po"), style:{ background:T.card, border:`2px solid ${T.blue}`, borderRadius:12, padding:"24px 20px", textAlign:"center", cursor:"pointer", fontFamily:"inherit" } },
        E("div", { style:{ fontSize:28, marginBottom:8 } }, "📦"),
        E("div", { style:{ fontWeight:700, fontSize:14, color:T.text } }, "New Purchase Order"),
        E("div", { style:{ fontSize:12, color:T.muted, marginTop:4 } }, "Receive one or many items against a PO")
      ),
      E("button", { onClick:()=>fileInputRef.current?.click(), style:{ background:T.card, border:`2px solid ${T.blue}`, borderRadius:12, padding:"24px 20px", textAlign:"center", cursor:"pointer", fontFamily:"inherit", position:"relative" } },
        scanning && E("div", { style:{ position:"absolute", inset:0, background:"rgba(255,255,255,0.8)", borderRadius:12, display:"flex", alignItems:"center", justifyContent:"center", fontSize:13, fontWeight:700, color:T.blue } }, "🤖 Scanning…"),
        E("div", { style:{ fontSize:28, marginBottom:8 } }, "🤖"),
        E("div", { style:{ fontWeight:700, fontSize:14, color:T.text } }, "Scan Invoice (AI)"),
        E("div", { style:{ fontSize:12, color:T.muted, marginTop:4 } }, "Upload PDF or photo — AI fills the form")
      ),
      E("button", { onClick:()=>setView("history"), style:{ background:T.card, border:`2px solid ${T.border}`, borderRadius:12, padding:"24px 20px", textAlign:"center", cursor:"pointer", fontFamily:"inherit" } },
        E("div", { style:{ fontSize:28, marginBottom:8 } }, "📋"),
        E("div", { style:{ fontWeight:700, fontSize:14, color:T.text } }, "Receive History"),
        E("div", { style:{ fontSize:12, color:T.muted, marginTop:4 } }, `${history.length} entries logged`)
      )
    ),
    E("input", { ref:fileInputRef, type:"file", accept:"image/*,application/pdf", style:{ display:"none" }, onChange:e=>{ if(e.target.files[0]) scanInvoice(e.target.files[0]); e.target.value=""; } }),
    scanError && E("div", { style:{ background:T.redLt, border:`1px solid #FECACA`, borderRadius:10, padding:"12px 14px", fontSize:13, color:T.red, marginTop:12 } }, scanError)
  );

  // ── HISTORY VIEW ──────────────────────────────────────────────────────────
  if (view === "history") return E("div", { style:{ maxWidth:600, margin:"0 auto" } },
    E("button", { onClick:()=>setView("main"), style:{ background:"none", border:"none", color:T.blue, fontWeight:700, fontSize:13, cursor:"pointer", marginBottom:16, padding:0 } }, "← Back"),
    E("h2", { style:{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:20, marginBottom:16 } }, "Receive History"),
    history.length===0 ? E("div", { style:{ textAlign:"center", padding:"40px 20px", color:T.muted } }, "No stock received yet.") :
    E("div", { style:{ display:"flex", flexDirection:"column", gap:8 } },
      history.slice(0,30).map((h,i) => E(Card, { key:i, style:{ borderLeft:`3px solid ${h.purchase_pending?T.amber:T.green}` } },
        E("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center" } },
          E("div", null,
            E("div", { style:{ fontWeight:600, fontSize:13 } }, h.productName),
            E("div", { style:{ fontSize:11, color:T.muted, marginTop:2 } },
              `${h.qty} units`, h.costPerUnit?` · JMD ${fmtMoney(h.costPerUnit)}/unit`:"",
              h.supplier?` · ${h.supplier}`:"", h.poRef?` · PO: ${h.poRef}`:"",
              ` · ${h.receivedDate||fmtDate(h.createdAt)}`
            )
          ),
          h.purchase_pending && E("span", { style:{ background:T.amberLt, color:T.amber, borderRadius:6, padding:"3px 8px", fontSize:11, fontWeight:700, whiteSpace:"nowrap" } }, "⚠️ PO pending")
        )
      ))
    )
  );

  // ── PO ENTRY VIEW ─────────────────────────────────────────────────────────
  return E("div", { style:{ maxWidth:680, margin:"0 auto" } },
    E("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 } },
      E("button", { onClick:()=>setView("main"), style:{ background:"none", border:"none", color:T.blue, fontWeight:700, fontSize:13, cursor:"pointer", padding:0 } }, "← Back"),
      E("div", { style:{ display:"flex", gap:8 } },
        E(Btn, { variant:"ghost", style:{ fontSize:12, padding:"7px 12px" }, onClick:saveDraft }, "💾 Save Draft"),
        E(Btn, { style:{ fontSize:12, padding:"7px 12px" }, disabled:saving||lines.length===0, onClick:receiveAll }, saving?"Receiving…":"📥 Receive All")
      )
    ),
    lines.some(l=>l.needsVerification) && E("div", { style:{ background:T.amberLt, border:`1px solid #FDE68A`, borderRadius:10, padding:"10px 14px", fontSize:13, color:T.amber, marginBottom:16, fontWeight:600 } },
      `⚠️ ${lines.filter(l=>l.needsVerification).length} AI-scanned item(s) need to be matched to your catalog or confirmed as new. Use the dropdown on each flagged line.`
    ),
    E(Card, { style:{ marginBottom:16 } },
      E("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 } },
        E(ST, { style:{ margin:0 } }, "Purchase Order Details"),
        savedPOs.length > 0 && E("button", { onClick:()=>setShowPOPicker(s=>!s), style:{ background:T.blueLt, color:T.blue, border:`1px solid ${T.border}`, borderRadius:7, padding:"5px 12px", fontSize:12, fontWeight:600, cursor:"pointer", fontFamily:"inherit" } }, "📄 Load Saved PO")
      ),
      showPOPicker && E("div", { style:{ background:"#F9FAFB", border:`1px solid ${T.border}`, borderRadius:8, padding:12, marginBottom:12 } },
        savedPOs.map((sp,i) => E("div", { key:i, onClick:()=>{ setPOS({ supplier:sp.supplier, poRef:sp.poRef||"", invoiceTotal:String(sp.total||""), receivedDate:sp.date||todayStr(), notes:sp.notes||"" }); setShowPOPicker(false); }, style:{ padding:"8px 12px", cursor:"pointer", background:"#fff", borderRadius:6, marginBottom:6, border:`1px solid ${T.border}`, display:"flex", justifyContent:"space-between" } },
          E("div", null,
            E("div", { style:{ fontWeight:600, fontSize:13 } }, sp.supplier, sp.poRef ? ` — ${sp.poRef}` : ""),
            E("div", { style:{ fontSize:11, color:T.muted } }, sp.date, sp.total ? ` · ${fmtMoney(sp.total)}` : "")
          ),
          E("span", { style:{ color:T.blue, fontSize:12, fontWeight:700 } }, "Load →")
        ))
      ),
      E("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:12 } },
        E(Field, { label:"Supplier" }, E(Input, { placeholder:"e.g. Cell Parts JA", value:po.supplier, onChange:e=>setPO("supplier",e.target.value) })),
        E(Field, { label:"PO / Invoice Reference" }, E(Input, { placeholder:"Invoice # or PO number", value:po.poRef, onChange:e=>setPO("poRef",e.target.value) })),
        E(Field, { label:"Invoice Total (JMD)", hint:"For reconciliation" }, E(Input, { type:"number", placeholder:"0.00", value:po.invoiceTotal, onChange:e=>setPO("invoiceTotal",e.target.value) })),
        E(Field, { label:"Shipping Cost (USD)" }, E(Input, { type:"number", placeholder:"0.00", value:po.shipping||"", onChange:e=>setPO("shipping",e.target.value) })),
        E(Field, { label:"Tax Amount (USD)" }, E(Input, { type:"number", placeholder:"0.00", value:po.tax||"", onChange:e=>setPO("tax",e.target.value) })),
        E(Field, { label:"Date Received" }, E(Input, { type:"date", value:po.receivedDate, onChange:e=>setPO("receivedDate",e.target.value) }))
      ),
      E(Field, { label:"Notes" }, E(Input, { placeholder:"Optional", value:po.notes, onChange:e=>setPO("notes",e.target.value) }))
    ),

    // Line items
    E(Card, { style:{ marginBottom:16 } },
      E("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 } },
        E(ST, { style:{ margin:0 } }, `Line Items (${lines.length})`),
        E("div", { style:{ display:"flex", gap:8 } },
          E("button", { onClick:()=>setShowNewLine(s=>!s), style:{ background:T.blueLt, color:T.blue, border:`1px solid ${T.border}`, borderRadius:7, padding:"6px 10px", fontSize:12, fontWeight:700, cursor:"pointer", fontFamily:"inherit" } }, showNewLine?"✕ Cancel":"✨ New Item")
        )
      ),

      // Search existing
      E("div", { style:{ display:"flex", gap:8, marginBottom:8 } },
        E(Sel, { value:catFilter, onChange:e=>setCatFilter(e.target.value), style:{ width:"auto", minWidth:140 } },
          categories.map(c=>E("option",{key:c,value:c}, c==="all"?"All Categories":c))
        ),
        E(Input, { placeholder:"Search by name, SKU, barcode...", value:search, onChange:e=>setSearch(e.target.value), style:{ flex:1 } })
      ),
      searchResults.length>0 && E("div", { style:{ border:`1px solid ${T.border}`, borderRadius:8, overflow:"hidden", marginBottom:12 } },
        searchResults.map((p,i)=>E("div", { key:i, onClick:()=>addExistingLine(p), style:{ padding:"9px 14px", cursor:"pointer", borderBottom:i<searchResults.length-1?`1px solid ${T.border}`:"none", display:"flex", justifyContent:"space-between", alignItems:"center" } },
          E("div", null,
            E("div", { style:{ fontWeight:600, fontSize:13 } }, p.name),
            E("div", { style:{ fontSize:11, color:T.muted } }, p.category, p.sku?` · SKU: ${p.sku}`:"", p.barcode?` · ${p.barcode}`:"", ` · Stock: ${p.stock||0}`)
          ),
          E("div", { style:{ color:T.blue, fontWeight:700, fontSize:12 } }, fmtMoney(p.price))
        ))
      ),

      // New item inline form
      showNewLine && E("div", { style:{ background:"#F9FAFB", borderRadius:10, padding:"12px 14px", marginBottom:12, border:`1px solid ${T.border}` } },
        E(ST, null, "New Item"),
        E("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:10 } },
          E(Field, { label:"Name", required:true }, E(Input, { placeholder:"Product name", value:newLine.name, onChange:e=>setNL("name",e.target.value) })),
          E(Field, { label:"Category" }, E(Sel, { value:newLine.category, onChange:e=>setNL("category",e.target.value) }, ["Accessory","Case","Charger","Screen Protector","Cable","Headphones","Gadget","Other"].map(c=>E("option",{key:c},c)))),
          E(Field, { label:"Selling Price (JMD)" }, E(Input, { type:"number", placeholder:"0", value:newLine.price, onChange:e=>setNL("price",e.target.value) })),
          E(Field, { label:"Cost per Unit (JMD)" }, E(Input, { type:"number", placeholder:"0", value:newLine.costPerUnit, onChange:e=>setNL("costPerUnit",e.target.value) })),
          E(Field, { label:"Quantity" }, E(Input, { type:"number", placeholder:"1", value:newLine.qty, onChange:e=>setNL("qty",e.target.value) })),
          E(Field, { label:"Barcode / SKU" }, E(Input, { placeholder:"Optional", value:newLine.barcode, onChange:e=>setNL("barcode",e.target.value) }))
        ),
        E(Btn, { onClick:addNewLine, style:{ fontSize:12 } }, "+ Add to Order")
      ),

      // Line items list
      lines.length===0 ? E("div", { style:{ textAlign:"center", padding:"24px 20px", color:T.muted, fontSize:13 } }, "Search for existing items or create new ones above to add to this order.")
      : E("div", null,
        lines.map((line,i) => E("div", { key:i, style:{ display:"flex", alignItems:"center", gap:8, padding:"10px 0", borderTop:`1px solid ${T.border}` } },
          E("div", { style:{ flex:1, minWidth:0 } },
            E("div", { style:{ fontWeight:600, fontSize:13, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", display:"flex", alignItems:"center", gap:6 } },
              line.name,
              line.needsVerification && E("span", { style:{ background:T.amberLt, color:T.amber, fontSize:10, fontWeight:700, borderRadius:4, padding:"1px 5px", flexShrink:0 } }, "⚠️ Unmatched"),
              line.isNew && !line.needsVerification && E("span", { style:{ background:T.blueLt, color:T.blue, fontSize:10, fontWeight:700, borderRadius:4, padding:"1px 5px", flexShrink:0 } }, "NEW")
            ),

// ── Staff Hours ───────────────────────────────────────────────────────────────
function StaffHours({ user }) {
  const E = React.createElement;
  const [shifts, setShifts] = useState([]);
  const [clocked, setClocked] = useState(null);
  useEffect(()=>{
    loadArr("tpp-shifts").then(all=>{
      const myShifts = all.filter(s=>s.staffName===user?.name);
      setShifts(myShifts);
      const open = myShifts.find(s=>!s.clockOut);
      setClocked(open||null);
    });
  },[]);
  const clockIn = async ()=>{
    const now = new Date();
    const hour = now.getHours(), min = now.getMinutes();
    // Warn if clocking in more than 15 mins before scheduled shift (before 8:45am)
    const minuteOfDay = hour*60+min;
    const shiftStart = 9*60+30; // 9:30am
    if(minuteOfDay < shiftStart - 15) {
      if(!confirm(`You are clocking in more than 15 minutes before your shift (${now.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}).

This clock-in will be flagged for management approval. Continue?`)) return;
    }
    const shift={id:Date.now().toString(),staffName:user?.name,clockIn:new Date().toISOString(),clockOut:null,lunchOut:null,lunchBack:null,earlyFlag:minuteOfDay<shiftStart-15,createdAt:new Date().toISOString()};
    const all=await loadArr("tpp-shifts"); const updated=[shift,...all];
    await save("tpp-shifts",updated); setShifts(prev=>[shift,...prev]); setClocked(shift);
  };
  const lunchOut = async ()=>{
    const all=await loadArr("tpp-shifts");
    const updated=all.map(s=>s.id===clocked.id?{...s,lunchOut:new Date().toISOString()}:s);
    await save("tpp-shifts",updated);
    setShifts(prev=>prev.map(s=>s.id===clocked.id?{...s,lunchOut:new Date().toISOString()}:s));
    setClocked(prev=>({...prev,lunchOut:new Date().toISOString()}));
  };
  const lunchBack = async ()=>{
    const all=await loadArr("tpp-shifts");
    const updated=all.map(s=>s.id===clocked.id?{...s,lunchBack:new Date().toISOString()}:s);
    await save("tpp-shifts",updated);
    setShifts(prev=>prev.map(s=>s.id===clocked.id?{...s,lunchBack:new Date().toISOString()}:s));
    setClocked(prev=>({...prev,lunchBack:new Date().toISOString()}));
  };
  const clockOut = async ()=>{
    const all=await loadArr("tpp-shifts");
    const updated=all.map(s=>s.id===clocked.id?{...s,clockOut:new Date().toISOString()}:s);
    await save("tpp-shifts",updated);
    setShifts(prev=>prev.map(s=>s.id===clocked.id?{...s,clockOut:new Date().toISOString()}:s));
    setClocked(null);
  };
  const fmtDuration=(cin,cout)=>{
    const mins=Math.round((new Date(cout)-new Date(cin))/60000);
    return `${Math.floor(mins/60)}h ${mins%60}m`;
  };
  return E("div",{style:{maxWidth:500,margin:"0 auto"}},
    E("h2",{style:{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:20,marginBottom:20}},"⏱️ My Hours"),
    E(Card,{style:{marginBottom:20,textAlign:"center"}},
      clocked
        ? E("div",null,
            E("div",{style:{fontSize:13,color:T.muted,marginBottom:6}},`Clocked in at ${new Date(clocked.clockIn).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}`),
            clocked.earlyFlag&&E("div",{style:{fontSize:11,color:T.amber,fontWeight:600,marginBottom:8}},"⚠️ Early clock-in — pending management approval"),
            E("div",{style:{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}},
              !clocked.lunchOut&&E(Btn,{variant:"ghost",onClick:lunchOut,style:{fontSize:12}},"🍽️ Lunch Out"),
              clocked.lunchOut&&!clocked.lunchBack&&E(Btn,{variant:"ghost",onClick:lunchBack,style:{fontSize:12}},"↩ Lunch Back"),
              E(Btn,{variant:"danger",onClick:clockOut},"⏹ Clock Out")
            )
          )
        : E(Btn,{onClick:clockIn},"▶ Clock In")
    ),
    E("div",{style:{display:"flex",flexDirection:"column",gap:8}},
      shifts.filter(s=>s.clockOut).slice(0,10).map((s,i)=>E(Card,{key:i},
        E("div",{style:{display:"flex",justifyContent:"space-between",fontSize:13}},
          E("span",null,fmtDate(s.clockIn)),
          E("span",{style:{fontWeight:700}},fmtDuration(s.clockIn,s.clockOut))
        )
      ))
    )
  );
}

        if (meta&&meta.chunks) { const all=[]; for(let i=0;i<meta.chunks;i++){const c=await load(`tpp-products-chunk-${i}`);if(Array.isArray(c))all.push(...c);} setProducts(all); }
        else setProducts(await loadArr("tpp-products"));
      } catch { setProducts(await loadArr("tpp-products")); }
      setLoading(false);
    })();
  },[]);
  if (loading) return E("div",{style:{textAlign:"center",padding:"60px 20px",color:T.muted}},"Loading...");
  const avail = (phones||[]).filter(p=>!p.voided&&p.availability==="Available");
  const phoneCost = avail.reduce((s,p)=>s+(parseFloat(p.total_invoice)||0),0);
  const phoneRetail = avail.reduce((s,p)=>s+(parseFloat(p.expected_sell)||0),0);
  const catGroups = {};
  products.filter(p=>(p.stock||0)>0).forEach(p=>{
    const cat=p.category||"Other"; if(!catGroups[cat])catGroups[cat]={items:[],cost:0,retail:0};
    const cost=(parseFloat(p.cost)||0)*(p.stock||0); const retail=(parseFloat(p.price)||0)*(p.stock||0);
    catGroups[cat].items.push({...p,costVal:cost,retailVal:retail}); catGroups[cat].cost+=cost; catGroups[cat].retail+=retail;
  });
  const catCost=Object.values(catGroups).reduce((s,g)=>s+g.cost,0);
  const catRetail=Object.values(catGroups).reduce((s,g)=>s+g.retail,0);
  const grandCost=phoneCost+catCost; const grandRetail=phoneRetail+catRetail;
  const sv=view==="cost";
  return E("div",{style:{maxWidth:700,margin:"0 auto"}},
    E("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}},
      E("h2",{style:{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:20,margin:0}},"📊 Inventory Valuation"),
      E("div",{style:{display:"flex",gap:6}},
        E("button",{onClick:()=>setView("cost"),style:{background:view==="cost"?T.blue:"#F3F4F6",color:view==="cost"?"#fff":T.muted,border:"none",borderRadius:7,padding:"7px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}},"Cost Value"),
        E("button",{onClick:()=>setView("retail"),style:{background:view==="retail"?T.blue:"#F3F4F6",color:view==="retail"?"#fff":T.muted,border:"none",borderRadius:7,padding:"7px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}},"Retail Value")
      )
    ),
    E("div",{style:{background:T.blue,borderRadius:14,padding:"20px 24px",marginBottom:20,color:"#fff"}},
      E("div",{style:{fontSize:13,opacity:0.8,marginBottom:4}},sv?"Total at cost":"Total at retail"),
      E("div",{style:{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:32}},fmtMoney(sv?grandCost:grandRetail)),
      sv&&E("div",{style:{fontSize:12,opacity:0.7,marginTop:4}},`Retail: ${fmtMoney(grandRetail)} · Margin: ${fmtMoney(grandRetail-grandCost)}`)
    ),
    E(R2,null,
      E(Card,null,E("div",{style:{fontSize:13,color:T.muted,marginBottom:4}},`📱 Phones (${avail.length})`),E("div",{style:{fontWeight:700,fontSize:18,color:T.blue}},fmtMoney(sv?phoneCost:phoneRetail))),
      E(Card,null,E("div",{style:{fontSize:13,color:T.muted,marginBottom:4}},`📦 Catalog`),E("div",{style:{fontWeight:700,fontSize:18,color:T.blue}},fmtMoney(sv?catCost:catRetail)))
    )
  );
}

// ── Inventory Count ───────────────────────────────────────────────────────────
function InventoryCount({ user, isOwner }) {
  const E = React.createElement;
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [session, setSession] = useState(null);
  const [counts, setCounts] = useState({});
  const [scanInput, setScanInput] = useState("");
  const [lastScanned, setLastScanned] = useState(null);
  const [scanMode, setScanMode] = useState(false);
  const [catFilter, setCatFilter] = useState("all");
  const [search, setSearch] = useState("");
  const [saving, setSaving] = useState(false);
  const [history, setHistory] = useState([]);
  const [pendingCounts, setPendingCounts] = useState([]);
  const scanRef = React.useRef(null);

  useEffect(()=>{
    (async()=>{
      try {
        const meta=await load("tpp-products-meta");
        if(meta&&meta.chunks){const all=[];for(let i=0;i<meta.chunks;i++){const c=await load(`tpp-products-chunk-${i}`);if(Array.isArray(c))all.push(...c);}setProducts(all);}
        else setProducts(await loadArr("tpp-products"));
      } catch { setProducts(await loadArr("tpp-products")); }
      setHistory(await loadArr("tpp-count-history"));
      setPendingCounts(await loadArr("tpp-count-pending"));
      setLoading(false);
    })();
  },[]);

  useEffect(()=>{ if(scanMode&&scanRef.current)scanRef.current.focus(); },[scanMode]);

  const handleScan=(barcode)=>{
    const trimmed=barcode.trim(); if(!trimmed)return;
    const product=products.find(p=>p.barcode===trimmed||p.sku===trimmed);
    if(product){
      setCounts(prev=>({...prev,[product.id]:(parseInt(prev[product.id])||0)+1}));
      setLastScanned({name:product.name,newCount:(parseInt(counts[product.id])||0)+1});
    } else { setLastScanned({name:`Unknown: ${trimmed}`,error:true}); }
    setTimeout(()=>setLastScanned(null),2000); setScanInput("");
  };

  const commitCount = async ()=>{
    setSaving(true);
    try {
      let allProducts=[];
      const meta=await load("tpp-products-meta");
      if(meta&&meta.chunks){for(let i=0;i<meta.chunks;i++){const c=await load(`tpp-products-chunk-${i}`);if(Array.isArray(c))allProducts.push(...c);}}
      else allProducts=await loadArr("tpp-products");
      const adjustments=[];
      const updated=allProducts.map(p=>{
        const cq=counts[p.id];
        if(cq===""||cq===undefined)return p;
        const nq=parseInt(cq)||0;
        if(nq!==(p.stock||0))adjustments.push({name:p.name,expected:p.stock||0,counted:nq,diff:nq-(p.stock||0)});
        return{...p,stock:nq};
      });
      const staffSubmit = isOwner===false;
      const countRecord={id:Date.now().toString(),date:todayStr(),createdAt:new Date().toISOString(),totalCounted:Object.keys(counts).filter(k=>counts[k]!=="").length,adjustments,pending:staffSubmit,submittedBy:user?.name||"Staff"};
      if(!staffSubmit){
        if(meta&&meta.chunks){const CHUNK=100;const chunks=[];for(let i=0;i<updated.length;i+=CHUNK)chunks.push(updated.slice(i,i+CHUNK));await save("tpp-products-meta",{...meta,total:updated.length});for(let i=0;i<chunks.length;i++)await save(`tpp-products-chunk-${i}`,chunks[i]);}
        else await save("tpp-products",updated);
        setProducts(updated);
        await save("tpp-count-history",[countRecord,...history]); setHistory(prev=>[countRecord,...prev]);
      } else {
        const pending=[...pendingCounts,{...countRecord,countData:counts}];
        await save("tpp-count-pending",pending); setPendingCounts(pending);
      }
      setSession(null);setCounts({});setScanMode(false);
      alert(staffSubmit?`✅ Count submitted for owner approval. ${adjustments.length} discrepancy(s) found.`:`✅ Count complete. ${adjustments.length} adjustment(s) made.`);
      setSubmitted(true);
    } finally{setSaving(false);}
  };

  const [reviewingCount, setReviewingCount] = useState(null); // pending record being reviewed
  const [reviewEdits, setReviewEdits] = useState({}); // edits made during review

  const openReview = (record) => {
    setReviewingCount(record);
    setReviewEdits({...record.countData}); // start with submitted values
  };

  const approveCount = async (record, edits) => {
    let allProducts=[];
    const meta=await load("tpp-products-meta");
    if(meta&&meta.chunks){for(let i=0;i<meta.chunks;i++){const c=await load(`tpp-products-chunk-${i}`);if(Array.isArray(c))allProducts.push(...c);}}
    else allProducts=await loadArr("tpp-products");
    const updated=allProducts.map(p=>{
      const cq=edits?.[p.id];
      if(cq===""||cq===undefined)return p;
      return{...p,stock:parseInt(cq)||0};
    });
    if(meta&&meta.chunks){const CHUNK=100;const chunks=[];for(let i=0;i<updated.length;i+=CHUNK)chunks.push(updated.slice(i,i+CHUNK));await save("tpp-products-meta",{...meta,total:updated.length});for(let i=0;i<chunks.length;i++)await save(`tpp-products-chunk-${i}`,chunks[i]);}
    else await save("tpp-products",updated);
    const approved={...record,pending:false,approvedAt:new Date().toISOString(),finalCountData:edits};
    const updatedHistory=[approved,...history];await save("tpp-count-history",updatedHistory);setHistory(updatedHistory);
    const updatedPending=pendingCounts.filter(p=>p.id!==record.id);await save("tpp-count-pending",updatedPending);setPendingCounts(updatedPending);
    setProducts(updated);setReviewingCount(null);setReviewEdits({});
    alert("✅ Count approved and inventory updated.");
  };

  const rejectCount = async (record) => {
    if(!confirm(`Reject count submitted by ${record.submittedBy}? They will need to recount.`)) return;
    const updatedPending=pendingCounts.filter(p=>p.id!==record.id);
    await save("tpp-count-pending",updatedPending);setPendingCounts(updatedPending);
    setReviewingCount(null);setReviewEdits({});
    alert("Count rejected. Staff will need to resubmit.");
  };

  const cats=["all",...Array.from(new Set(products.map(p=>p.category).filter(Boolean))).sort()];
  const filteredProducts=products.filter(p=>{
    const mc=catFilter==="all"||p.category===catFilter;
    const mq=!search||p.name.toLowerCase().includes(search.toLowerCase())||(p.barcode||"").includes(search);
    return mc&&mq;
  });
  const counted=Object.keys(counts).filter(k=>counts[k]!=="");
  const discrepancies=products.filter(p=>counts[p.id]!==""&&counts[p.id]!==undefined&&parseInt(counts[p.id])!==(p.stock||0));

  if(loading)return E("div",{style:{textAlign:"center",padding:"60px 20px",color:T.muted}},"Loading...");

  if(!session)return E("div",{style:{maxWidth:600,margin:"0 auto"}},
    E("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}},
      E("div",null,E("h2",{style:{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:20,margin:0}},"🔢 Stock Count"),
        E("div",{style:{fontSize:12,color:T.muted,marginTop:4}},"Count your physical stock and reconcile with the system.")),
      E(Btn,{onClick:()=>{const init={};products.forEach(p=>{init[p.id]="";});setCounts(init);setSession("active");}},"▶ Start Count")
    ),
    // Review screen for a pending count
    reviewingCount&&E("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:1000,overflowY:"auto",padding:20}},
      E("div",{style:{background:"#fff",borderRadius:16,padding:24,maxWidth:680,margin:"0 auto"}},
        E("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}},
          E("div",{style:{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:18}},`📋 Review Count — ${reviewingCount.submittedBy}`),
          E("button",{onClick:()=>{setReviewingCount(null);setReviewEdits({});},style:{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"#888"}},"✕")
        ),
        E("div",{style:{fontSize:12,color:T.muted,marginBottom:16}},`Submitted ${fmtDate(reviewingCount.createdAt)} · ${reviewingCount.totalCounted} items counted · ${reviewingCount.adjustments?.length||0} discrepancy(s)`),
        E("div",{style:{background:T.amberLt,border:`1px solid #FDE68A`,borderRadius:8,padding:"10px 14px",marginBottom:16,fontSize:12,color:"#92400E"}},
          "Review each item below. Edit any counted values before approving. Changes you make here override the staff submission."
        ),
        // Discrepancies first
        reviewingCount.adjustments?.length>0&&E("div",{style:{marginBottom:16}},
          E(ST,null,`⚠️ Discrepancies (${reviewingCount.adjustments.length})`),
          E("div",{style:{display:"flex",flexDirection:"column",gap:6}},
            reviewingCount.adjustments.map((adj,i)=>{
              const pid = Object.keys(reviewingCount.countData||{}).find(k=>{
                const prod = products.find(p=>p.id===k);
                return prod?.name===adj.name;
              });
              return E("div",{key:i,style:{background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:8,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}},
                E("div",null,
                  E("div",{style:{fontWeight:600,fontSize:13}},adj.name),
                  E("div",{style:{fontSize:11,color:"#92400E",marginTop:2}},`Expected: ${adj.expected} · Submitted: ${adj.counted} · Diff: ${adj.diff>0?"+":""}${adj.diff}`)
                ),
                E("div",{style:{display:"flex",alignItems:"center",gap:8}},
                  E("div",{style:{fontSize:11,color:T.muted}},"Approve as:"),
                  E("input",{type:"number",min:"0",value:reviewEdits[pid]||adj.counted,onChange:e=>setReviewEdits(prev=>({...prev,[pid]:e.target.value})),style:{...iS,width:70,textAlign:"center",padding:"5px 8px"}})
                )
              );
            })
          )
        ),
        // All counted items summary
        E("div",{style:{marginBottom:16}},
          E(ST,null,"All Counted Items"),
          E("div",{style:{display:"flex",flexDirection:"column",gap:4,maxHeight:300,overflowY:"auto"}},
            Object.entries(reviewingCount.countData||{}).filter(([,v])=>v!=="").map(([pid,val])=>{
              const prod=products.find(p=>p.id===pid);
              if(!prod)return null;
              const isDisc=parseInt(val)!==(prod.stock||0);
              return E("div",{key:pid,style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 10px",background:isDisc?"#FFFBEB":"#F9FAFB",borderRadius:6,marginBottom:2}},
                E("div",{style:{fontSize:12,fontWeight:isDisc?600:400}},prod.name),
                E("div",{style:{display:"flex",alignItems:"center",gap:8,fontSize:12}},
                  E("span",{style:{color:T.muted}},`Exp: ${prod.stock||0}`),
                  E("input",{type:"number",min:"0",value:reviewEdits[pid]??val,onChange:e=>setReviewEdits(prev=>({...prev,[pid]:e.target.value})),style:{...iS,width:60,textAlign:"center",padding:"4px 6px",fontSize:11}})
                )
              );
            }).filter(Boolean)
          )
        ),
        E("div",{style:{display:"flex",gap:8,justifyContent:"flex-end"}},
          E(Btn,{variant:"danger",onClick:()=>rejectCount(reviewingCount)},"✕ Reject All"),
          E(Btn,{variant:"green",onClick:()=>approveCount(reviewingCount,reviewEdits)},"✅ Approve & Update Inventory")
        )
      )
    ),
    isOwner&&pendingCounts.length>0&&E("div",{style:{marginBottom:20}},
      E(ST,null,`⏳ Pending Approval (${pendingCounts.length})`),
      pendingCounts.map((r,i)=>E(Card,{key:i,style:{borderLeft:`3px solid ${T.amber}`}},
        E("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
          E("div",null,
            E("div",{style:{fontWeight:600,fontSize:13}},`Count by ${r.submittedBy} — ${r.date}`),
            E("div",{style:{fontSize:11,color:T.muted,marginTop:2}},`${r.totalCounted} items counted · ${r.adjustments?.length||0} discrepancy(s)`)
          ),
          E("div",{style:{display:"flex",gap:6}},
            E(Btn,{style:{fontSize:12},onClick:()=>openReview(r)},"👁️ Review"),
            E(Btn,{variant:"danger",style:{fontSize:12},onClick:()=>rejectCount(r)},"✕ Reject")
          )
        )
      ))
    ),
    history.length>0&&E("div",null,
      E(ST,null,"Previous Counts"),
      history.slice(0,5).map((h,i)=>E(Card,{key:i},
        E("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
          E("div",null,
            E("div",{style:{fontWeight:600,fontSize:13}},fmtDate(h.createdAt),h.submittedBy?` — ${h.submittedBy}`:""),
            E("div",{style:{fontSize:12,color:T.muted,marginTop:2}},`${h.totalCounted} counted · ${h.adjustments?.length||0} adjustments`,h.pending?" · ⏳ Pending":"")
          ),
          h.adjustments?.length>0&&E("span",{style:{background:T.amberLt,color:T.amber,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700}},`${h.adjustments.length} adj.`)
        )
      ))
    )
  );

  return E("div",{style:{maxWidth:700,margin:"0 auto"}},
    E("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}},
      E("div",null,
        E("h2",{style:{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:20,margin:0}},"🔢 Count in Progress"),
        E("div",{style:{fontSize:12,color:T.muted,marginTop:4}},`${counted.length} of ${products.length} counted · ${discrepancies.length} discrepancy(s)`)
      ),
      E("div",{style:{display:"flex",gap:8}},
        E(Btn,{variant:"ghost",onClick:()=>{if(confirm("Abandon count?"))setSession(null);}},"✕ Abandon"),
        E(Btn,{variant:"green",disabled:counted.length===0||saving||submitted,onClick:commitCount},saving?"Saving...":submitted?"✅ Submitted":isOwner===false?"Submit for Approval":"✅ Commit Count")
      )
    ),
    E("div",{style:{background:scanMode?T.blueLt:T.card,border:`1px solid ${scanMode?T.blue:T.border}`,borderRadius:12,padding:"14px 16px",marginBottom:16}},
      E("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:scanMode?12:0}},
        E("div",null,E("div",{style:{fontWeight:700,fontSize:14}},"📷 Barcode Scanner"),E("div",{style:{fontSize:12,color:T.muted}},"Camera or USB/Bluetooth scanner")),
        E("button",{onClick:()=>setScanMode(s=>!s),style:{background:scanMode?T.blue:"#F3F4F6",color:scanMode?"#fff":T.muted,border:"none",borderRadius:8,padding:"8px 16px",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit"}},scanMode?"ON":"OFF")
      ),
      scanMode&&E("div",null,
        lastScanned&&E("div",{style:{background:lastScanned.error?T.redLt:T.greenLt,borderRadius:8,padding:"8px 14px",marginBottom:8,fontSize:13,fontWeight:600,color:lastScanned.error?T.red:T.green}},lastScanned.error?`❌ ${lastScanned.name}`:`✅ ${lastScanned.name} — Count: ${lastScanned.newCount}`),
        E("div",{style:{display:"flex",gap:8}},
          E("input",{ref:scanRef,placeholder:"Scan or type barcode...",value:scanInput,onChange:e=>setScanInput(e.target.value),onKeyDown:e=>{if(e.key==="Enter")handleScan(scanInput);},style:{...iS,flex:1,fontSize:15,fontWeight:700},autoComplete:"off"}),
          E(Btn,{onClick:()=>handleScan(scanInput)},"→")
        )
      )
    ),
    discrepancies.length>0&&E("div",{style:{background:T.amberLt,border:`1px solid #FDE68A`,borderRadius:10,padding:"10px 16px",marginBottom:16,fontSize:13}},
      E("div",{style:{fontWeight:700,color:T.amber,marginBottom:6}},`⚠️ ${discrepancies.length} discrepancy(s)`),
      discrepancies.slice(0,3).map((p,i)=>E("div",{key:i,style:{fontSize:12,color:"#92400E"}},`${p.name}: expected ${p.stock||0}, counted ${counts[p.id]||0}`))
    ),
    E("div",{style:{display:"flex",gap:8,marginBottom:12}},
      E(Sel,{value:catFilter,onChange:e=>setCatFilter(e.target.value),style:{width:"auto"}},cats.map(c=>E("option",{key:c,value:c},c==="all"?"All Categories":c))),
      E(Input,{placeholder:"🔍 Search...",value:search,onChange:e=>setSearch(e.target.value)})
    ),
    E("div",{style:{display:"flex",flexDirection:"column",gap:6}},
      filteredProducts.map((p,i)=>{
        const cq=counts[p.id]; const hasDiff=cq!==""&&cq!==undefined&&parseInt(cq)!==(p.stock||0);
        const diff=cq!==""&&cq!==undefined?parseInt(cq||0)-(p.stock||0):0;
        return E("div",{key:i,style:{background:T.card,border:`1px solid ${hasDiff?"#FDE68A":T.border}`,borderRadius:10,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}},
          E("div",{style:{flex:1,minWidth:0}},
            E("div",{style:{fontSize:13,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},p.name),
            E("div",{style:{fontSize:11,color:T.muted,marginTop:2}},p.category,p.barcode?` · ${p.barcode}`:"")
          ),
          E("div",{style:{display:"flex",alignItems:"center",gap:8,flexShrink:0}},
            E("div",{style:{fontSize:12,color:T.muted,textAlign:"right"}},E("div",null,"Expected"),E("div",{style:{fontWeight:700,color:T.text}},p.stock||0)),
            E("input",{type:"number",min:"0",placeholder:"Count",value:counts[p.id]||"",onChange:e=>setCounts(prev=>({...prev,[p.id]:e.target.value})),style:{...iS,width:70,textAlign:"center",padding:"6px 8px",borderColor:hasDiff?"#FDE68A":T.border}}),
            hasDiff&&E("div",{style:{fontSize:12,fontWeight:700,color:diff>0?T.green:T.red,minWidth:36,textAlign:"center"}},`${diff>0?"+":""}${diff}`)
          )
        );
      })
    )
  );
}

// ── AI IMEI Scanner ──────────────────────────────────────────────────────────
function ImeiScanner({onDetected, onClose}) {
  const E = React.createElement;
  const [loading, setLoading] = useState(false);
  const [preview, setPreview] = useState(null);
  const [result, setResult] = useState("");
  const [error, setError] = useState("");
  const fileRef = React.useRef(null);
  const scanImage = async (file) => {
    setLoading(true); setError(""); setResult("");
    try {
      const b64 = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(",")[1]); r.onerror=rej; r.readAsDataURL(file); });
      setPreview(URL.createObjectURL(file));
      const apiKey = (() => { try { return localStorage.getItem("tpp_anthropic_key")||""; } catch { return ""; } })();
      if (!apiKey) { setError("No API key set. Add one in Settings."); setLoading(false); return; }
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST", headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:200,messages:[{role:"user",content:[
          {type:"image",source:{type:"base64",media_type:file.type,data:b64}},
          {type:"text",text:"Extract the IMEI number from this image. Return ONLY the 15-digit IMEI, nothing else. Multiple IMEIs: one per line. No IMEI found: return NOT_FOUND."}
        ]}]})
      });
      const data = await resp.json();
      const text = data.content?.[0]?.text?.trim()||"";
      if (!text||text==="NOT_FOUND") setError("No IMEI found. Try again or enter manually.");
      else setResult(text);
    } catch(e) { setError("Scan failed: "+e.message); }
    setLoading(false);
  };
