const sendTicketEmail = async (ticket, type = "auto") => {
  if (!ticket.customerEmail) {
    alert("No email address on file for this customer.");
    return false;
  }
  const s = STATUSES.find(x => x.id === ticket.status) || STATUSES[0];
  const params = {
    to_email:      ticket.customerEmail,
    customer_name: ticket.customerName,
    ticket_id:     ticket.id,
    device:        `${ticket.deviceBrand} ${ticket.deviceModel}`,
    issue:         ticket.faultDescription,
    status:        s.label,
    est_cost:      ticket.estimatedCost ? fmtMoney(ticket.estimatedCost) : "TBD",
    final_cost:    ticket.finalCost ? fmtMoney(ticket.finalCost) : ticket.estimatedCost ? fmtMoney(ticket.estimatedCost) : "TBD",
    est_ready:     ticket.estimatedCompletion ? fmtDate(ticket.estimatedCompletion) : "TBD",
  };
  // Pick the right template based on ticket status
  let tpl;
  if (type === "ready" || ticket.status === "ready") {
    tpl = EMAILJS_TPL_READY;
  } else if (["awaiting_parts", "in_repair"].includes(ticket.status)) {
    tpl = EMAILJS_TPL_UPDATE;
  } else {
    tpl = EMAILJS_TPL_CONFIRM;
  }
  try {
    await emailjs.send(EMAILJS_SERVICE_ID, tpl, params);
    return true;
  } catch (e) {
    console.error("EmailJS error:", e);
    alert("Email failed to send. Check console for details.");
    return false;
  }
};

const ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const genId = (existing = []) => {
  let id;
  do {
    id = "TPP-" + Array.from({
      length: 6
    }, () => ALPHA[Math.floor(Math.random() * ALPHA.length)]).join("");
  } while (existing.includes(id));
  return id;
};
const todayStr = () => new Date().toISOString().slice(0, 10);
const fmt = iso => {
  if (!iso) return "—";
  try {
    return new Date(iso).toLocaleString("en-GB", {
      day: "2-digit",
      month: "short",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    });
  } catch {
    return iso;
  }
};
const fmtDate = iso => {
  if (!iso) return "—";
  try {
    return new Date(iso).toLocaleDateString("en-GB", {
      day: "2-digit",
      month: "short",
      year: "numeric"
    });
  } catch {
    return iso;
  }
};
const fmtMoney = n => {
  const num = parseFloat(n) || 0;
  return "JMD " + Math.abs(num).toLocaleString("en-JM", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
};

const load = async key => {
  try {
    const s = await _db.collection('tpp').doc(key).get();
    return s.exists ? s.data().v : null;
  } catch (e) {
    console.error("FB load:", e);
    return null;
  }
};
const save = async (key, val) => {
  try {
    await _db.collection('tpp').doc(key).set({ v: val, ts: Date.now() });
  } catch (e) {
    console.error("FB save:", e);
  }
};

color, storage (e.g. "128 GB"), condition (default "9/10"), lock_status (default "Unlocked"), 
site (where purchased e.g. eBay), supplier (seller name if visible), 
item_cost (USD amount as number), tax (USD as number), shipping_cost (USD as number, divide total shipping evenly if multiple items), 
total_invoice (JMD leave as 0), payment_method (default "PayPal"), 
expected_sell (JMD leave as 0), notes.
If multiple phones are on one invoice, return one object per phone. 
Return ONLY the JSON array, no explanation, no markdown.` });
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{ "Content-Type":"application/json", "x-api-key": apiKey, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
        body: JSON.stringify({
          model:"claude-sonnet-4-5",
