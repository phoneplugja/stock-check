      ...l,
      receivedQty: l.qty,
      units: isImeiCategory(l.category) ? Array.from({length:l.qty},(_,i)=>({tempId:i,imei:"",status:"Available"})) : [],
      matchedProductId: null,
      isNew: false,
      sellPrice: "",
    })));
    setView("imei_entry");
  };

  // Update a unit's IMEI or status
  const updateUnit = (lineIdx, unitIdx, field, val) => {
    setReceiveLines(prev=>prev.map((l,li)=>li!==lineIdx?l:{
      ...l, units: l.units.map((u,ui)=>ui!==unitIdx?u:{...u,[field]:val})
    }));
  };

  // Commit the received stock to catalog
  const commitReceive = async () => {
    setSaving(true);
    try {
      let updatedCatalog = [...catalog];
      const receiveHistory = [];
      const today = todayStr();

      for (const line of receiveLines) {
        const isImei = isImeiCategory(line.category);
        const units = flagAllTesting
          ? line.units.map(u=>({...u,status:"Under Testing"}))
          : line.units;

        if (isImei) {
          // Find or create catalog product
          let product = updatedCatalog.find(p=>
            p.name?.toLowerCase()===line.name.toLowerCase() && p.category===line.category
          );
          if (!product) {
            product = {
              id: `prod-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,
              name: line.name, category: line.category,
              price: parseFloat(line.sellPrice)||0,
              cost: parseFloat(line.unitCost)||0,
              stock: 0, units: [],
              variable_price: false, createdAt: new Date().toISOString()
            };
            updatedCatalog = [product, ...updatedCatalog];
          }
          // Add units
          const newUnits = units.filter(u=>u.imei).map(u=>({
            id: `unit-${Date.now()}-${u.imei||Math.random().toString(36).slice(2,8)}`,
            imei: u.imei, status: u.status||"Available",
            cost: parseFloat(line.unitCost)||0,
            sellPrice: parseFloat(line.sellPrice)||0,
            receivedDate: today,
            poRef: selectedPO?.poRef||"",
            supplier: selectedPO?.supplier||"",
            history: [{status:u.status||"Available",ts:new Date().toISOString(),note:`Received${selectedPO?.poRef?" via PO "+selectedPO.poRef:""}`}]
          }));
          product.units = [...(product.units||[]), ...newUnits];
          product.stock = product.units.filter(u=>u.status==="Available").length;
          product.cost = parseFloat(line.unitCost)||product.cost;
          if (parseFloat(line.sellPrice)) product.price = parseFloat(line.sellPrice);
          updatedCatalog = updatedCatalog.map(p=>p.id===product.id?product:p);
          receiveHistory.push({ productName:line.name, category:line.category, qty:newUnits.length, unitCost:line.unitCost, receivedDate:today, poRef:selectedPO?.poRef||"", supplier:selectedPO?.supplier||"", createdAt:new Date().toISOString() });
        } else {
          // Non-IMEI: just add to stock count
          let product = updatedCatalog.find(p=>p.name?.toLowerCase()===line.name.toLowerCase()&&p.category===line.category);
          if (!product) {
            product = { id:`prod-${Date.now()}-${Math.random().toString(36).slice(2,6)}`, name:line.name, category:line.category, price:parseFloat(line.sellPrice)||0, cost:parseFloat(line.unitCost)||0, stock:0, units:[], variable_price:false, createdAt:new Date().toISOString() };
            updatedCatalog = [product, ...updatedCatalog];
          }
          product.stock = (product.stock||0) + (parseInt(line.receivedQty)||0);
          if (parseFloat(line.unitCost)) product.cost = parseFloat(line.unitCost);
          if (parseFloat(line.sellPrice)) product.price = parseFloat(line.sellPrice);
          updatedCatalog = updatedCatalog.map(p=>p.id===product.id?product:p);
          receiveHistory.push({ productName:line.name, category:line.category, qty:parseInt(line.receivedQty)||0, unitCost:line.unitCost, receivedDate:today, poRef:selectedPO?.poRef||"", supplier:selectedPO?.supplier||"", createdAt:new Date().toISOString() });
        }
      }

      await saveCatalog(updatedCatalog);
      // Save receive history
      const existingHistory = await loadArr("tpp-stock-receives");
      await save("tpp-stock-receives", [...receiveHistory, ...existingHistory]);
      // Mark PO as received
      if (selectedPO) {
        const allPOs = await loadArr("tpp-purchase-orders");
        await save("tpp-purchase-orders", allPOs.map(p=>p.id===selectedPO.id?{...p,status:"Received",receivedAt:new Date().toISOString()}:p));
      }
      if (onCatalogUpdate) onCatalogUpdate(updatedCatalog);
      setCatalog(updatedCatalog);
      alert(`✅ Stock received!\n${receiveLines.length} product(s) updated in catalog.${flagAllTesting?"\n⚠️ All phone/tablet units flagged for testing.":""}`);
      setView("choose"); setSelectedPO(null); setReceiveLines([]); setFlagAllTesting(false);
    } finally { setSaving(false); }
  };

  // ── IMEI Entry Screen ───────────────────────────────────────────────────────
  if (view==="imei_entry") return E("div",{style:{maxWidth:680,margin:"0 auto"}},
    showImeiScanner && E(ImeiScanner,{
      onDetected:(imei)=>{
        if(imeiTargetLine!==null){
          const line=receiveLines[imeiTargetLine.lineIdx];
          const nextEmpty=line.units.findIndex((u,i)=>i>=imeiTargetLine.unitIdx&&!u.imei);
          if(nextEmpty>=0) updateUnit(imeiTargetLine.lineIdx,nextEmpty,"imei",imei);
        }
        setShowImeiScanner(false); setImeiTargetLine(null);
      },
      onClose:()=>{setShowImeiScanner(false);setImeiTargetLine(null);}
    }),
    E("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}},
      E("button",{onClick:()=>{setView("choose");setSelectedPO(null);setReceiveLines([]);},style:{background:"none",border:"none",color:T.blue,fontWeight:700,fontSize:13,cursor:"pointer",padding:0}},"← Back"),
      E("div",{style:{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:18}},selectedPO?`Receiving PO — ${selectedPO.poRef||selectedPO.supplier}`:"Receiving Stock")
    ),
    // Flag all for testing
    E("div",{style:{background:T.amberLt,border:`1px solid #FDE68A`,borderRadius:8,padding:"10px 14px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center"}},
      E("div",{style:{fontSize:13,color:"#92400E"}},"Flag all phones/tablets for testing before sale"),
      E("label",{style:{display:"flex",alignItems:"center",gap:6,cursor:"pointer",fontSize:13,fontWeight:700,color:"#92400E"}},
        E("input",{type:"checkbox",checked:flagAllTesting,onChange:e=>setFlagAllTesting(e.target.checked)}),"Flag all"
      )
    ),
    E("div",{style:{display:"flex",flexDirection:"column",gap:14}},
      receiveLines.map((line,li)=>{
        const isImei = isImeiCategory(line.category);
        return E(Card,{key:li},
          E("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}},
            E("div",null,
              E("div",{style:{fontWeight:700,fontSize:14}},line.name),
              E("div",{style:{fontSize:12,color:T.muted}},line.category," · qty ",line.qty)
            ),
            isImei&&E("div",{style:{display:"flex",gap:6}},
              E("button",{onClick:()=>{setImeiTargetLine({lineIdx:li,unitIdx:0});setShowImeiScanner(true);},style:{background:T.blueLt,color:T.blue,border:"none",borderRadius:6,padding:"5px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}},"📷 Scan IMEI")
            )

            E(Field,{label:`Unit Cost (${selectedPO?.currency||"JMD"})`},E(Input,{type:"number",placeholder:"0",value:line.unitCost,onChange:e=>setReceiveLines(prev=>prev.map((l,i)=>i===li?{...l,unitCost:e.target.value}:l))})),

function PhoneTestingQueue({ phones, onUpdate }) {
  const E = React.createElement;
  const [testingPhone, setTestingPhone] = useState(null);
  const queue = (phones||[]).filter(p=>p.availability==="Under Testing"&&!p.voided);

  const runTest = async (phone) => {
    const tests = ["Screen","Battery","Charging Port","Front Camera","Rear Camera","Speaker","Microphone","Buttons","WiFi/Cellular","Overall"];
    const results = [];
    let allPassed = true;
    for(const test of tests){
      const r = prompt(`Testing: ${phone.make} ${phone.model}\n\n${test}\nEnter result (pass / fail / skip):`);
      if(r===null)return;
      const res = r.toLowerCase().includes("f")?"fail":r.toLowerCase().includes("s")?"skip":"pass";
      results.push({test,result:res});
      if(res==="fail")allPassed=false;
    }
    const notes = prompt("Additional notes (optional):")||"";
    const newStatus = allPassed?"Available":"To Be Repaired";
    const faults = results.filter(r=>r.result==="fail").map(r=>r.test).join(", ");
    alert(allPassed?"✅ All tests passed — phone marked Available.":`❌ Failed: ${faults}\nStatus → To Be Repaired.`);
    const updatedPhones=(phones||[]).map(p=>p.id===phone.id||p.imei===phone.imei?{
      ...p,availability:newStatus,
      testRecord:{date:new Date().toISOString(),results,notes,passed:allPassed},
      testedAt:new Date().toISOString(),
      history:[...(p.history||[]),{status:newStatus,ts:new Date().toISOString(),note:`Testing complete — ${allPassed?"PASSED":"FAILED"}${faults?" — "+faults:""}`}]
    }:p);
    await onUpdate(updatedPhones);
    setTestingPhone(null);
  };

  return E("div",{style:{maxWidth:640,margin:"0 auto"}},
    E("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}},
      E("div",null,
        E("h2",{style:{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:20,margin:0}},"🔬 Testing Queue"),
        E("div",{style:{fontSize:12,color:T.muted,marginTop:4}},`${queue.length} device${queue.length!==1?"s":""} awaiting testing`)
      )
