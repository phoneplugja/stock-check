const sendTicketEmail = async (ticket, type = "auto") => {
  if (!ticket.customerEmail) {
    alert("No email address on file for this customer.");
    return false;
  }
  const s = STATUSES.find(x => x.id === ticket.status) || STATUSES[0];
  const params = {
    to_email:      ticket.customerEmail,
    customer_name: ticket.customerName,
    ticket_id:     ticket.id,
    device:        `${ticket.deviceBrand} ${ticket.deviceModel}`,
    issue:         ticket.faultDescription,
    status:        s.label,
    est_cost:      ticket.estimatedCost ? fmtMoney(ticket.estimatedCost) : "TBD",
    final_cost:    ticket.finalCost ? fmtMoney(ticket.finalCost) : ticket.estimatedCost ? fmtMoney(ticket.estimatedCost) : "TBD",
    est_ready:     ticket.estimatedCompletion ? fmtDate(ticket.estimatedCompletion) : "TBD",
  };
  // Pick the right template based on ticket status
  let tpl;
  if (type === "ready" || ticket.status === "ready") {
    tpl = EMAILJS_TPL_READY;
  } else if (["awaiting_parts", "in_repair"].includes(ticket.status)) {
    tpl = EMAILJS_TPL_UPDATE;
  } else {
    tpl = EMAILJS_TPL_CONFIRM;
  }
  try {
    await emailjs.send(EMAILJS_SERVICE_ID, tpl, params);
    return true;
  } catch (e) {
    console.error("EmailJS error:", e);
    alert("Email failed to send. Check console for details.");
    return false;
  }
};

const ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const genId = (existing = []) => {
  let id;
  do {
    id = "TPP-" + Array.from({
      length: 6
    }, () => ALPHA[Math.floor(Math.random() * ALPHA.length)]).join("");
  } while (existing.includes(id));
  return id;
};
const todayStr = () => new Date().toISOString().slice(0, 10);
const fmt = iso => {
  if (!iso) return "—";
  try {
    return new Date(iso).toLocaleString("en-GB", {
      day: "2-digit",
      month: "short",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    });
  } catch {
    return iso;
  }
};
const fmtDate = iso => {
  if (!iso) return "—";
  try {
    return new Date(iso).toLocaleDateString("en-GB", {
      day: "2-digit",
      month: "short",
      year: "numeric"
    });
  } catch {
    return iso;
  }
};
const fmtMoney = n => {
  const num = parseFloat(n) || 0;
  return "JMD " + Math.abs(num).toLocaleString("en-JM", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
};

  try {
    const s = await _db.collection('tpp').doc(key).get();
    return s.exists ? s.data().v : null;
  } catch (e) {
    console.error("FB load:", e);
    return null;
  }
};

  }
};

const daysUntilDue = dueDay => {
  const d = new Date(); const cur = d.getDate();
  if (dueDay >= cur) return dueDay - cur;
  const dim = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  return dim - cur + dueDay;
};
const computeStreak = checkins => {
  let streak = 0; const todayKey = todayStr(); let cursor = new Date();
  if (!checkins.includes(todayKey)) cursor.setDate(cursor.getDate()-1);
  while (true) {
    const key = cursor.toISOString().slice(0,10);
    if (checkins.includes(key)) { streak++; cursor.setDate(cursor.getDate()-1); } else break;
  }
  return streak;
};

// ── Barcode Scanner ───────────────────────────────────────────────────────────
function BarcodeScanner({ onDetected, onClose }) {
  const E = React.createElement;
  const videoRef = React.useRef(null);
  const [error, setError] = useState("");
  const [scanning, setScanning] = useState(true);

  useEffect(() => {
    let stream = null;
    let interval = null;
    (async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        if (videoRef.current) videoRef.current.srcObject = stream;
        // Use BarcodeDetector if available, else show manual entry
        if ("BarcodeDetector" in window) {
          const detector = new BarcodeDetector({ formats: ["ean_13","ean_8","code_128","code_39","upc_a","upc_e","qr_code"] });
          interval = setInterval(async () => {
            if (videoRef.current && scanning) {
              try {
                const codes = await detector.detect(videoRef.current);
                if (codes.length > 0) {
                  clearInterval(interval);
                  onDetected(codes[0].rawValue);
                }
              } catch {}
            }
          }, 300);
        } else {
          setError("Camera scanning not supported on this browser. Use manual entry below.");
        }
      } catch(e) {
        setError("Camera access denied. Please allow camera access or enter barcode manually.");
      }
    })();
    return () => {
      clearInterval(interval);
      if (stream) stream.getTracks().forEach(t => t.stop());
    };
  }, []);

  const [manualCode, setManualCode] = useState("");

  return E("div", { style: { position:"fixed", inset:0, background:"rgba(0,0,0,0.85)", zIndex:2000, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:16, padding:20 } },
    E("div", { style: { color:"#fff", fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:18, marginBottom:4 } }, "📷 Scan Barcode"),
    !error && E("video", { ref: videoRef, autoPlay: true, playsInline: true, style: { width:"100%", maxWidth:360, borderRadius:12, border:"3px solid "+T.blue } }),
    error && E("div", { style: { color:T.amber, fontSize:13, textAlign:"center", maxWidth:320 } }, error),
    E("div", { style: { display:"flex", gap:8, width:"100%", maxWidth:360 } },
      E(Input, { placeholder:"Or type barcode manually...", value:manualCode, onChange:e=>setManualCode(e.target.value), onKeyDown:e=>e.key==="Enter"&&manualCode.trim()&&onDetected(manualCode.trim()), style:{ flex:1, background:"#fff" } }),
      E(Btn, { onClick:()=>manualCode.trim()&&onDetected(manualCode.trim()) }, "→")
    ),
    E(Btn, { variant:"ghost", onClick:onClose, style:{ color:"#fff", border:"1px solid rgba(255,255,255,0.3)" } }, "✕ Cancel")
  );
}

// ── Product Catalog Manager ───────────────────────────────────────────────────
function ProductCatalog({ onBack }) {
  const E = React.createElement;
  const [products, setProducts] = useState([]);
  const [services, setServices] = useState([]);
  const [form, setFormS] = useState({ name:"", category:"Accessory", price:"", barcode:"", stock:"" });
  const [adding, setAdding] = useState(false);
  const [search, setSearch] = useState("");
  const set = (k,v) => setFormS(p=>({...p,[k]:v}));

  useEffect(() => { loadArr("tpp-products").then(setProducts); }, []);

  const saveProduct = async () => {
    if (!form.name.trim() || !form.price) { alert("Name and price required."); return; }
    const newP = { id: genId(products.map(p=>p.id)), ...form, price: parseFloat(form.price), stock: parseInt(form.stock)||0, createdAt: new Date().toISOString() };
    const updated = [newP, ...products];
    await save("tpp-products", updated);
    setProducts(updated);
    setFormS({ name:"", category:"Accessory", price:"", barcode:"", stock:"" });
    setAdding(false);
  };

  const removeProduct = async (id) => {
    if (!confirm("Remove this product?")) return;
    const updated = products.filter(p=>p.id!==id);
    await save("tpp-products", updated);
    setProducts(updated);
  };

  const filtered = products.filter(p => !search || p.name.toLowerCase().includes(search.toLowerCase()) || (p.barcode||"").includes(search));

  return E("div", { style:{ maxWidth:600, margin:"0 auto" } },
    E("button", { onClick:onBack, style:{ background:"none", border:"none", color:T.blue, fontWeight:700, fontSize:13, cursor:"pointer", marginBottom:16, padding:0 } }, "← Back to POS"),
    E("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 } },
      E("h2", { style:{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:20 } }, "Product Catalog"),
      E(Btn, { onClick:()=>setAdding(a=>!a) }, adding ? "✕ Cancel" : "+ Add Product")
    ),
    adding && E(Card, { style:{ marginBottom:16 } },
      E(ST, null, "New Product"),
      E("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:12 } },
        E(Field, { label:"Name", required:true }, E(Input, { placeholder:"e.g. iPhone 15 Case", value:form.name, onChange:e=>set("name",e.target.value) })),
        E(Field, { label:"Category" }, E(Sel, { value:form.category, onChange:e=>set("category",e.target.value) },
          ["Accessory","Case","Charger","Screen Protector","Cable","Headphones","Repair Service","Other"].map(c=>E("option",{key:c},c))
        )),
        E(Field, { label:"Price (JMD)", required:true }, E(Input, { type:"number", placeholder:"0.00", value:form.price, onChange:e=>set("price",e.target.value) })),
        E(Field, { label:"Stock Qty" }, E(Input, { type:"number", placeholder:"0", value:form.stock, onChange:e=>set("stock",e.target.value) }))
      ),
      E(Field, { label:"Barcode", hint:"optional — for scanner" }, E(Input, { placeholder:"Scan or type barcode", value:form.barcode, onChange:e=>set("barcode",e.target.value) })),
      E("div", { style:{ marginTop:12 } }, E(Btn, { onClick:saveProduct }, "Save Product"))
    ),
    E(Input, { placeholder:"🔍 Search products or barcode...", value:search, onChange:e=>setSearch(e.target.value), style:{ marginBottom:14 } }),
    filtered.length === 0 ? E("div", { style:{ textAlign:"center", padding:"40px 20px", color:T.muted } }, "No products yet. Add your accessories and services above.") :
    E("div", { style:{ display:"flex", flexDirection:"column", gap:8 } },
      filtered.map((p,i) => E(Card, { key:i },
        E("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center" } },
          E("div", null,
            E("div", { style:{ fontWeight:700, fontSize:14 } }, p.name),
            E("div", { style:{ fontSize:12, color:T.muted, marginTop:2 } }, p.category, p.barcode ? ` · ${p.barcode}` : "", ` · Stock: ${p.stock}`)
          ),
          E("div", { style:{ display:"flex", alignItems:"center", gap:10 } },
            E("div", { style:{ fontWeight:700, color:T.blue, fontSize:15 } }, fmtMoney(p.price)),
            E("button", { onClick:()=>removeProduct(p.id), style:{ background:T.redLt, color:T.red, border:"none", borderRadius:6, padding:"4px 8px", fontSize:11, fontWeight:700, cursor:"pointer" } }, "✕")
          )
        )
      ))
    )
  );
}

// ── POS Main ─────────────────────────────────────────────────────────────────
function POSSystem({ phones, onPhonesUpdate }) {
  const E = React.createElement;
  const [view, setView] = useState("pos"); // "pos" | "catalog" | "history"
  const [cart, setCart] = useState([]);
  const [products, setProducts] = useState([]);
  const [tickets, setTickets] = useState([]);
  const [sales, setSales] = useState([]);
  const [search, setSearch] = useState("");
  const [posCategory, setPosCategory] = useState("all");
  const [searchResults, setSearchResults] = useState([]);
  const [showScanner, setShowScanner] = useState(false);
  const [customerName, setCustomerName] = useState("");
  const [customerPhone, setCustomerPhone] = useState("");
  const [customerEmail, setCustomerEmail] = useState("");
  const [customerSuggestions, setCustomerSuggestions] = useState([]);
  const [allCustomers, setAllCustomers] = useState([]);

  const searchCustomers = (q) => {
    if (!q.trim() || q.length < 2) { setCustomerSuggestions([]); return; }
    const matches = allCustomers.filter(c => c.name?.toLowerCase().includes(q.toLowerCase()) || c.phone?.includes(q)).slice(0,5);
    setCustomerSuggestions(matches);
  };
  const [discount, setDiscount] = useState("");
  const [cash, setCash] = useState("");
  const [debitCard, setDebitCard] = useState("");
  const [creditCard, setCreditCard] = useState("");
  const [ncbTransfer, setNcbTransfer] = useState("");
  const [scotiaTransfer, setScotiaTransfer] = useState("");
  const [otherPayment, setOtherPayment] = useState("");
  const [note, setNote] = useState("");
  const [processing, setSaving_] = useState(false);
  const [lastSale, setLastSale] = useState(null);
  const [emailSending, setEmailSending] = useState(false);
  const [exchangeMode, setExchangeMode] = useState(false);
  const [returnedItem, setReturnedItem] = useState(null); // item being returned
  const [returnSearch, setReturnSearch] = useState("");
  const [returnResults, setReturnResults] = useState([]);

  const searchForReturn = (q) => {
    setReturnSearch(q);
    if (!q.trim()) { setReturnResults([]); return; }
    // Search sales for receipts containing this customer/item
    const matches = sales.filter(s =>
      !s.voided && !s.type &&
      (s.customerName?.toLowerCase().includes(q.toLowerCase()) ||
       s.customerPhone?.includes(q) ||
       s.id?.toLowerCase().includes(q.toLowerCase()) ||
       s.items?.some(i=>i.name?.toLowerCase().includes(q.toLowerCase())))
    ).slice(0,5);
    setReturnResults(matches);
  };

  const startExchange = (sale, item) => {
    setReturnedItem({ sale, item });
    setReturnResults([]); setReturnSearch("");
    // Add the returned item as a negative line (credit)
    setCart([{ type:"return", id:`ret-${Date.now()}`, name:`↩️ Return: ${item.name}`, price:-(item.price||0), qty:1, originalSaleId:sale.id, returnedItem:item }]);
    setCustomerName(sale.customerName||""); setCustomerPhone(sale.customerPhone||""); setCustomerEmail(sale.customerEmail||"");
  };
  const [historySearch, setHistorySearch] = useState("");
  const [historyDate, setHistoryDate] = useState("");
  const [selectedSale, setSelectedSale] = useState(null);
  const [drafts, setDrafts] = useState([]);
  const [showDrafts, setShowDrafts] = useState(false);

  // Load and auto-expire drafts on mount
  useEffect(() => {
    loadArr("tpp-receipt-drafts").then(ds => {
      const today = todayStr();
      const valid = ds.filter(d => d.date === today);
      if (valid.length !== ds.length) save("tpp-receipt-drafts", valid);
      setDrafts(valid);
    });
  }, []);

  const saveDraft = async () => {
    if (cart.length === 0) { alert("Cart is empty."); return; }
    const draft = { id: Date.now().toString(), cart, customerName, customerEmail, discount, cash, card, transfer, note, date: todayStr(), savedAt: new Date().toISOString() };
    const existing = await loadArr("tpp-receipt-drafts");
    const updated = [draft, ...existing.filter(d=>d.date===todayStr())];
    await save("tpp-receipt-drafts", updated);
    setDrafts(updated);
    alert("✅ Draft saved. It will expire at end of day.");
  };

  const loadDraft = (draft) => {
    setCart(draft.cart||[]); setCustomerName(draft.customerName||""); setCustomerEmail(draft.customerEmail||"");
    setDiscount(draft.discount||""); setCash(draft.cash||""); setCard(draft.card||""); setTransfer(draft.transfer||""); setNote(draft.note||"");
    setDrafts(prev=>prev.filter(d=>d.id!==draft.id));
    save("tpp-receipt-drafts", drafts.filter(d=>d.id!==draft.id));
    setShowDrafts(false);
  };

  useEffect(() => {
    (async () => {
      const [t, s, custs, allT] = await Promise.all([
        loadArr("tpp-tickets-v1", false),
        loadArr("tpp-sales"),
        loadArr("tpp-customers"),
        loadArr("tpp-tickets-v1", false)
      ]);
      setTickets(t.filter(tk => ["received","diagnosing","awaiting_parts","in_repair","ready"].includes(tk.status)));
      setSales(s);
      // Merge customers from purchases + repair tickets
      const ticketCustomers = (allT||[]).filter(tk=>tk.customerName).map(tk=>({ name:tk.customerName, phone:tk.customerPhone||"", email:tk.customerEmail||"", source:"repair" }));
      const existingNames = new Set((custs||[]).map(c=>c.name?.toLowerCase()));
      const merged = [...(custs||[]), ...ticketCustomers.filter(tc=>!existingNames.has(tc.name?.toLowerCase()))];
      setAllCustomers(merged);
      // Load services catalog
      const svcs = await loadArr("tpp-services");
      if (svcs.length === 0) {
        // Seed common repair services
        const defaults = ["Screen Replacement","Battery Replacement","Charging Port Repair","Back Glass Repair","Camera Repair","Speaker/Mic Repair","Software Repair / Unlock","Water Damage Treatment","Labour"].map((name,i)=>({ id:`default-${i}`, name, createdAt:new Date().toISOString() }));
        await save("tpp-services", defaults);
        setServices(defaults);
      } else {
        setServices(svcs);
      }

      // Load products from chunked storage
      try {
        const meta = await load("tpp-products-meta");
        if (meta && meta.chunks) {
          const allProducts = [];
          for (let i = 0; i < meta.chunks; i++) {
            const chunk = await load(`tpp-products-chunk-${i}`);
            if (Array.isArray(chunk)) allProducts.push(...chunk);
          }
          setProducts(allProducts);
        } else {
          // Fallback to flat tpp-products key (manually added items)
          const p = await loadArr("tpp-products");
          setProducts(p);
        }
      } catch(e) {
        const p = await loadArr("tpp-products");
        setProducts(p);
      }
    })();
  }, []);

  // ── Search across phones, products, and repair tickets ──────────────────
  useEffect(() => {
    if (!search.trim()) { setSearchResults([]); return; }
    const q = search.toLowerCase();
    const matchingPhones = phones.filter(p => !p.voided && p.availability === "Available" && [p.make,p.model,p.color,p.imei,p.storage].some(v=>v?.toLowerCase().includes(q)));
    const phoneResults = matchingPhones.slice(0,8).map(p => {
      const last4 = p.imei ? `···${p.imei.slice(-4)}` : "No IMEI";
      const unitLabel = `${p.make} ${p.model} ${p.storage||""} — ${p.color||""} [${last4}]`;
      return { type:"phone", id:p.imei||p.order_number, name:unitLabel, subLabel:`IMEI: ${p.imei||"—"} · Expected: ${fmtMoney(p.expected_sell||0)}`, price: parseFloat(p.expected_sell)||0, imei:p.imei, raw:p };
    });
    const productResults = products
      .filter(p => {
        const matchCat = posCategory === "all" || p.category === posCategory;
        const matchQ = p.name.toLowerCase().includes(q) || (p.barcode||"").includes(search) || (p.sku||"").includes(search);
        return matchCat && (q ? matchQ : posCategory !== "all");
      })
      .slice(0,8)
      .map(p => ({ type:"product", id:p.id, name:p.name, price:p.price||0, variable_price:p.variable_price, barcode:p.barcode, sku:p.sku, raw:p }));
    const ticketResults = tickets
      .filter(t => t.id.toLowerCase().includes(q) || t.customerName?.toLowerCase().includes(q) || t.customerPhone?.includes(q))
      .slice(0,3)
      .map(t => {
        const depositsPaid = sales.filter(s => s.items?.some(i=>i.ticketId===t.id)).reduce((sum,s)=>sum+(s.total||0),0);
        const estimatedTotal = parseFloat(t.estimatedCost)||0;
        const balanceOwed = Math.max(0, estimatedTotal - depositsPaid);
        return {
          type:"ticket", id:t.id,
          name:`${t.customerName||"Customer"} — ${t.deviceBrand||""} ${t.deviceModel||""}`,
          subLabel:`Ticket: ${t.id} · ${t.status}${depositsPaid>0?` · Deposit paid: ${fmtMoney(depositsPaid)}`:""}${balanceOwed>0?` · Balance: ${fmtMoney(balanceOwed)}`:""}`,
          price:0, depositsPaid, balanceOwed, estimatedTotal, raw:t
        };
      });
    setSearchResults([...phoneResults, ...productResults, ...ticketResults]);
  }, [search, phones, products, tickets]);

  const addToCart = (item) => {
    if (item.type === "ticket") {
      const existing = cart.find(c=>c.id===item.id&&c.type==="deposit");
      if (existing) { alert("This ticket is already in the cart."); return; }
      const isCollection = item.depositsPaid > 0;
      // Auto-populate customer info from ticket
      if (item.raw.customerName) setCustomerName(item.raw.customerName);
      if (item.raw.customerPhone) setCustomerPhone(item.raw.customerPhone);
      if (item.raw.customerEmail) setCustomerEmail(item.raw.customerEmail);
      setCustomerSuggestions([]);
      setCart(c=>[...c, {
        type:"deposit", id:item.id,
        name:`Repair${isCollection?" (Collection)":""} — ${item.raw.deviceBrand||""} ${item.raw.deviceModel||""} (${item.id})`,
        subLabel: isCollection ? `Deposit paid: ${fmtMoney(item.depositsPaid)} · Add services below using 🔧 Add Service` : "New deposit — enter amount below",
        price: 0, qty:1, ticketId:item.id,
        depositsPaid: item.depositsPaid, balanceOwed: item.balanceOwed,
        isCollection,
        raw:item.raw
      }]);
    } else {
      // Variable price — prompt staff to enter price
      let finalPrice = item.price;
      if (item.variable_price || !item.price) {
        const entered = prompt(`Enter price for:\n${item.name}\n\n(JMD)`, "");
        if (entered === null) return; // cancelled
        finalPrice = parseFloat(entered) || 0;
        if (finalPrice <= 0) { alert("Please enter a valid price greater than 0."); return; }
      }
      const existing = cart.find(c=>c.id===item.id&&c.type!=="deposit");
      if (existing && !item.variable_price) {
        setCart(c=>c.map(ci=>ci.id===item.id ? {...ci, qty:ci.qty+1} : ci));
      } else {
        setCart(c=>[...c, { type:item.type, id:item.id, name:item.name, price:finalPrice, qty:1, variable_price:item.variable_price, raw:item.raw }]);
      }
    }
    setSearch(""); setSearchResults([]);
  };

  const removeFromCart = (idx) => setCart(c=>c.filter((_,i)=>i!==idx));
  const updateCartPrice = (idx, val) => setCart(c=>c.map((ci,i)=>i===idx?{...ci,price:parseFloat(val)||0}:ci));
  const updateCartQty = (idx, val) => setCart(c=>c.map((ci,i)=>i===idx?{...ci,qty:Math.max(1,parseInt(val)||1)}:ci));

  const subtotal = cart.reduce((s,i)=>s+(i.price*i.qty),0);
  const discountAmt = parseFloat(discount)||0;
  const total = Math.max(0, subtotal - discountAmt);
  const totalPaid = (parseFloat(cash)||0) + (parseFloat(debitCard)||0) + (parseFloat(creditCard)||0) + (parseFloat(ncbTransfer)||0) + (parseFloat(scotiaTransfer)||0) + (parseFloat(otherPayment)||0);
  const change = Math.max(0, (parseFloat(cash)||0) - (total - (parseFloat(debitCard)||0) - (parseFloat(creditCard)||0) - (parseFloat(ncbTransfer)||0) - (parseFloat(scotiaTransfer)||0) - (parseFloat(otherPayment)||0)));
  const canCheckout = cart.length > 0 && totalPaid >= total;

  const handleBarcodeDetected = (code) => {
    setShowScanner(false);
    const product = products.find(p => p.barcode === code || p.sku === code);
    if (product) {
      addToCart({ type:"product", id:product.id, name:product.name, price:product.price||0, variable_price:product.variable_price, raw:product });
    } else {
      const phone = phones.find(p => p.imei === code);
      if (phone && phone.availability === "Available") {
        addToCart({ type:"phone", id:phone.imei, name:`${phone.make} ${phone.model} ${phone.color} ${phone.storage}`, price:parseFloat(phone.expected_sell)||0, raw:phone });
      } else {
        setSearch(code);
        alert(`No item found for barcode: ${code}. Showing search results.`);
      }
    }
  };

  const checkout = async () => {
    if (!canCheckout) return;
    // Exchange mode — mark returned item back to Returned to Stock
    if (exchangeMode && returnedItem) {
      const returnedPhone = returnedItem.item;
      if (returnedPhone.imei) {
        const updatedPhones = phones.map(p => p.imei === returnedPhone.imei
          ? { ...p, availability:"Returned to Stock", returnedAt:new Date().toISOString(), history:[...(p.history||[]),{status:"Returned to Stock",note:`Exchange — receipt ${returnedItem.sale.id}`,ts:new Date().toISOString()}] }
          : p
        );
        await onPhonesUpdate(updatedPhones);
      }
    }

    // Check for purchase_pending items
    const pendingItems = cart.filter(i => i.raw?.purchase_pending);
    if (pendingItems.length > 0) {
      const names = pendingItems.map(i=>i.name).join(", ");
      const proceed = confirm(`⚠️ The following item(s) have no purchase record on file:\n\n${names}\n\nProceed anyway? A To Do will be created to remind you to add purchase details.`);
      if (!proceed) return;
    }

    setSaving_(true);
    try {
      const existing = await loadArr("tpp-sales");
      const saleId = genSaleId(existing.map(s=>s.id));
      const sale = {
        id: saleId, customerName, customerPhone, customerEmail,
        isExchange: exchangeMode,
        originalSaleId: returnedItem?.sale?.id || null,
        items: cart, subtotal, discount: discountAmt, total,
        cash: parseFloat(cash)||0, debitCard: parseFloat(debitCard)||0, creditCard: parseFloat(creditCard)||0,
        ncbTransfer: parseFloat(ncbTransfer)||0, scotiaTransfer: parseFloat(scotiaTransfer)||0, otherPayment: parseFloat(otherPayment)||0, change,
        note, createdAt: new Date().toISOString(),
        date: todayStr()
      };
      const updatedSales = [sale, ...existing];
      await save("tpp-sales", updatedSales);
      setSales(updatedSales);

      // Update phone availability — and create to-do if phone not in inventory
      let updatedPhones = [...phones];
      const soldOutTodos = [];
      cart.filter(i=>i.type==="phone").forEach(item => {
        const match = phones.find(p=>p.imei===item.id);
        if (match) {
          updatedPhones = updatedPhones.map(p =>
            p.imei === item.id ? { ...p, availability:"Sold", date_sold:todayStr(), actual_sell:String(item.price), sold_by:"POS", actual_profit:String(item.price-(parseFloat(p.total_invoice)||0)) } : p
          );
        } else {
          // Phone sold but not in inventory — create to-do
          soldOutTodos.push({ id:Date.now().toString()+Math.random(), text:`Phone sold via POS not in inventory: "${item.name}" — add IMEI entry and purchase order. Receipt: ${saleId}`, createdAt:new Date().toISOString(), resolved:false, source:"system", priority:"high" });
        }
      });
      await onPhonesUpdate(updatedPhones);
      if (soldOutTodos.length) {
        const existingTodos = await loadArr("tpp-todos");
        await save("tpp-todos", [...soldOutTodos, ...existingTodos]);
      }

      // Update product stock
      const updatedProducts = [...products];
      cart.filter(i=>i.type==="product").forEach(item => {
        const idx = updatedProducts.findIndex(p=>p.id===item.id);
        if (idx>=0) updatedProducts[idx] = { ...updatedProducts[idx], stock: Math.max(0,(updatedProducts[idx].stock||0)-item.qty) };
      });
      await save("tpp-products", updatedProducts);
      setProducts(updatedProducts);

      // Save/update customer profile
      if (customerName.trim()) {
        const existingCustomers = await loadArr("tpp-customers");
        const existingIdx = existingCustomers.findIndex(c=>c.name?.toLowerCase()===customerName.toLowerCase()&&(c.phone===customerPhone||!c.phone));
        if (existingIdx >= 0) {
          existingCustomers[existingIdx] = { ...existingCustomers[existingIdx], phone:customerPhone||existingCustomers[existingIdx].phone, email:customerEmail||existingCustomers[existingIdx].email, visitCount:(existingCustomers[existingIdx].visitCount||0)+1, lastVisit:new Date().toISOString() };
        } else {
          existingCustomers.unshift({ id:Date.now().toString(), name:customerName, phone:customerPhone, email:customerEmail, visitCount:1, firstVisit:new Date().toISOString(), lastVisit:new Date().toISOString() });
        }
        await save("tpp-customers", existingCustomers);
        setAllCustomers(existingCustomers);
      }

      // Log to-do for purchase_pending overrides
      if (pendingItems.length > 0) {
        const todos = await loadArr("tpp-todos");
        const todo = { id: Date.now().toString(), text:`POS override — add purchase details for: ${pendingItems.map(i=>i.name).join(", ")} (Receipt: ${saleId})`, createdAt: new Date().toISOString(), resolved: false, source: "pos_override", priority: "high" };
        await save("tpp-todos", [todo, ...todos]);
      }

      setLastSale(sale);
      setCart([]); setCustomerName(""); setCustomerPhone(""); setCustomerEmail(""); setDiscount(""); setCash(""); setDebitCard(""); setCreditCard(""); setNcbTransfer(""); setScotiaTransfer(""); setOtherPayment(""); setNote(""); setExchangeMode(false); setReturnedItem(null);
    } finally { setSaving_(false); }
  };

  if (view === "catalog") return E(ProductCatalog, { onBack:()=>setView("pos") });

  if (view === "services") return E("div", { style:{ maxWidth:560, margin:"0 auto" } },
    E("button", { onClick:()=>setView("pos"), style:{ background:"none", border:"none", color:T.blue, fontWeight:700, fontSize:13, cursor:"pointer", marginBottom:16, padding:0 } }, "← Back to POS"),
    E("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 } },
      E("h2", { style:{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:20, margin:0 } }, "🔧 Services"),
      E(Btn, { onClick:async()=>{
        const name = prompt("Service name:\n(e.g. Screen Replacement, Battery Replacement, Charging Port, Software Repair, Labour)");

// ── Staff Hours + Payroll ─────────────────────────────────────────────────────
function StaffHours({ user }) {
  const E = React.createElement;
  const [logs, setLogs] = useState([]);
  const [clockedIn, setClockedIn] = useState(null);
  const [note, setNote] = useState("");
  const name = user?.name || "Staff";

  useEffect(() => {
    loadArr("tpp-hours").then(all => {
      setLogs(all);
      const open = all.find(l => l.staff === name && !l.clockOut);
      setClockedIn(open || null);
    });
  }, []);

  const clockIn = async () => {
    const entry = { id: Date.now().toString(), staff: name, clockIn: new Date().toISOString(), clockOut: null, note: "" };
    const updated = [entry, ...logs];
    await save("tpp-hours", updated);
    setLogs(updated); setClockedIn(entry);
  };

  const clockOut = async () => {
    if (!clockedIn) return;
    const now = new Date().toISOString();
    const mins = Math.round((new Date(now) - new Date(clockedIn.clockIn)) / 60000);
    const updated = logs.map(l => l.id === clockedIn.id ? { ...l, clockOut: now, minutes: mins, note } : l);
    await save("tpp-hours", updated);
    setLogs(updated); setClockedIn(null); setNote("");
  };

  const todayLogs = logs.filter(l => l.staff === name && l.clockIn?.startsWith(todayStr()));
  const todayMins = todayLogs.filter(l=>l.minutes).reduce((s,l)=>s+l.minutes,0);
  const fmt = (iso) => iso ? new Date(iso).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}) : "—";
  const fmtMins = (m) => `${Math.floor(m/60)}h ${m%60}m`;

  return E("div", { style:{ maxWidth:480, margin:"0 auto" } },
    E("div", { style:{ marginBottom:20 } },
      E("h2", { style:{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:20, margin:0 } }, "⏱️ My Hours"),
      E("div", { style:{ fontSize:12, color:T.muted, marginTop:4 } }, `Logged in as ${name}`)
    ),
    E(Card, { style:{ textAlign:"center", marginBottom:20 } },
      clockedIn
        ? E("div", null,
            E("div", { style:{ fontSize:13, color:T.muted, marginBottom:4 } }, `Clocked in at ${fmt(clockedIn.clockIn)}`),
            E("div", { style:{ fontFamily:"'Syne',sans-serif", fontSize:28, fontWeight:800, color:T.green, marginBottom:16 } }, "🟢 On the clock"),
            E(Field, { label:"Shift note (optional)" }, E(Input, { placeholder:"e.g. Covered repairs, Terry absent", value:note, onChange:e=>setNote(e.target.value) })),
            E("div", { style:{ marginTop:12 } }, E(Btn, { full:true, variant:"danger", onClick:clockOut }, "🔴 Clock Out"))
          )
        : E("div", null,
            E("div", { style:{ fontFamily:"'Syne',sans-serif", fontSize:22, fontWeight:800, color:T.muted, marginBottom:16 } }, "⚪ Not clocked in"),
            E(Btn, { full:true, variant:"green", onClick:clockIn }, "🟢 Clock In")
          )
    ),
    todayMins > 0 && E("div", { style:{ background:T.blueLt, border:`1px solid ${T.border}`, borderRadius:10, padding:"10px 16px", fontSize:14, marginBottom:16, display:"flex", justifyContent:"space-between" } },
      E("span", null, "Today's total"),
      E("strong", { style:{ color:T.blue } }, fmtMins(todayMins))
    ),
    todayLogs.length > 0 && E("div", null,
      E(ST, null, "Today's shifts"),
      E("div", { style:{ display:"flex", flexDirection:"column", gap:8 } },
        todayLogs.map((l,i) => E(Card, { key:i },
          E("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center" } },
            E("div", null,
              E("div", { style:{ fontWeight:600, fontSize:13 } }, `${fmt(l.clockIn)} → ${l.clockOut ? fmt(l.clockOut) : "ongoing"}`),
              l.note && E("div", { style:{ fontSize:12, color:T.muted, marginTop:2 } }, l.note)
            ),
            l.minutes && E("div", { style:{ fontWeight:700, color:T.blue } }, fmtMins(l.minutes))
          )
        ))
      )
    )
  );
}

function PayrollManager() {
  const E = React.createElement;
  const [logs, setLogs] = useState([]);
  const [weekOf, setWeekOf] = useState(todayStr().slice(0,7)); // YYYY-MM
  const [staffFilter, setStaffFilter] = useState("all");

  useEffect(() => { loadArr("tpp-hours").then(setLogs); }, []);

  const staff = [...new Set(logs.map(l=>l.staff).filter(Boolean))];

  const filtered = logs.filter(l => {

  const fmt = (iso) => iso ? new Date(iso).toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "—";

                    l.note && E("div", { style:{ fontSize:11, color:T.muted, marginTop:2 } }, l.note)

                )
              ))

          )
        )
  );
}

// ── Inventory Valuation ───────────────────────────────────────────────────────
function InventoryValuation({ phones }) {
  const E = React.createElement;
  const [products, setProducts] = useState([]);
  const [view, setView] = useState("cost"); // "cost" | "retail"
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    (async () => {
      try {
        const meta = await load("tpp-products-meta");
        if (meta && meta.chunks) {
          const all = [];
          for (let i = 0; i < meta.chunks; i++) {
            const chunk = await load(`tpp-products-chunk-${i}`);
            if (Array.isArray(chunk)) all.push(...chunk);
          }
          setProducts(all);
        } else {
          setProducts(await loadArr("tpp-products"));
        }
      } catch { setProducts(await loadArr("tpp-products")); }
      setLoading(false);
    })();
  }, []);

  if (loading) return E("div", { style:{ textAlign:"center", padding:"60px 20px", color:T.muted } }, "Loading inventory...");

  // Phone valuation — available phones only
  const availablePhones = phones.filter(p => !p.voided && p.availability === "Available");
  const phoneCostTotal = availablePhones.reduce((s,p) => s + (parseFloat(p.total_invoice)||0), 0);
  const phoneRetailTotal = availablePhones.reduce((s,p) => s + (parseFloat(p.expected_sell)||0), 0);

  // Catalog products — group by category
  const catGroups = {};
  products.filter(p => (p.stock||0) > 0).forEach(p => {
    const cat = p.category || "Other";
    if (!catGroups[cat]) catGroups[cat] = { items:[], costTotal:0, retailTotal:0 };
    const cost = (parseFloat(p.cost)||0) * (p.stock||0);
    const retail = (parseFloat(p.price)||0) * (p.stock||0);
    catGroups[cat].items.push({ ...p, costValue: cost, retailValue: retail });
    catGroups[cat].costTotal += cost;
    catGroups[cat].retailTotal += retail;
  });

  const catalogCostTotal = Object.values(catGroups).reduce((s,g)=>s+g.costTotal,0);
  const catalogRetailTotal = Object.values(catGroups).reduce((s,g)=>s+g.retailTotal,0);
  const grandCost = phoneCostTotal + catalogCostTotal;
  const grandRetail = phoneRetailTotal + catalogRetailTotal;
  const showVal = view === "cost";

  return E("div", { style:{ maxWidth:700, margin:"0 auto" } },
    E("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 } },
      E("div", null,
        E("h2", { style:{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:20, margin:0 } }, "📊 Inventory Valuation"),
        E("div", { style:{ fontSize:12, color:T.muted, marginTop:4 } }, "Current stock value based on cost and retail prices.")
      ),
      E("div", { style:{ display:"flex", gap:6 } },
        E("button", { onClick:()=>setView("cost"), style:{ background:view==="cost"?T.blue:"#F3F4F6", color:view==="cost"?"#fff":T.muted, border:"none", borderRadius:7, padding:"7px 14px", fontSize:12, fontWeight:700, cursor:"pointer", fontFamily:"inherit" } }, "Cost Value"),
        E("button", { onClick:()=>setView("retail"), style:{ background:view==="retail"?T.blue:"#F3F4F6", color:view==="retail"?"#fff":T.muted, border:"none", borderRadius:7, padding:"7px 14px", fontSize:12, fontWeight:700, cursor:"pointer", fontFamily:"inherit" } }, "Retail Value")
      )
    ),

    // Grand total
    E("div", { style:{ background:T.blue, borderRadius:14, padding:"20px 24px", marginBottom:20, color:"#fff" } },
      E("div", { style:{ fontSize:13, opacity:0.8, marginBottom:4 } }, view==="cost"?"Total inventory at cost price":"Total inventory at retail price"),
      E("div", { style:{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:32 } }, fmtMoney(showVal?grandCost:grandRetail)),
      showVal && E("div", { style:{ fontSize:12, opacity:0.7, marginTop:4 } }, `Potential retail value: ${fmtMoney(grandRetail)} · Margin: ${fmtMoney(grandRetail-grandCost)}`)
    ),

    // Summary row
    E("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:24 } },
      E(Card, null,
        E("div", { style:{ fontSize:13, color:T.muted, marginBottom:4 } }, "📱 Phones (", availablePhones.length, " units)"),
        E("div", { style:{ fontWeight:700, fontSize:18, color:T.blue } }, fmtMoney(showVal?phoneCostTotal:phoneRetailTotal)),
        E("div", { style:{ fontSize:11, color:T.muted, marginTop:2 } }, showVal?`Retail: ${fmtMoney(phoneRetailTotal)}`:`Cost: ${fmtMoney(phoneCostTotal)}`)
      ),
      E(Card, null,
        E("div", { style:{ fontSize:13, color:T.muted, marginBottom:4 } }, "📦 Catalog (", products.filter(p=>(p.stock||0)>0).length, " SKUs)"),
        E("div", { style:{ fontWeight:700, fontSize:18, color:T.blue } }, fmtMoney(showVal?catalogCostTotal:catalogRetailTotal)),
        E("div", { style:{ fontSize:11, color:T.muted, marginTop:2 } }, showVal?`Retail: ${fmtMoney(catalogRetailTotal)}`:`Cost: ${fmtMoney(catalogCostTotal)}`)
      )
    ),

    // Phones breakdown
    availablePhones.length > 0 && E("div", { style:{ marginBottom:24 } },
      E(ST, null, `📱 Phones (${availablePhones.length} in stock)`),
      E("div", { style:{ display:"flex", flexDirection:"column", gap:6 } },
        availablePhones.map((p,i) => E("div", { key:i, style:{ background:T.card, border:`1px solid ${T.border}`, borderRadius:10, padding:"10px 16px", display:"flex", justifyContent:"space-between", alignItems:"center" } },
          E("div", null,
            E("div", { style:{ fontWeight:600, fontSize:13 } }, `${p.make} ${p.model} ${p.storage||""} — ${p.color||""}`),
            E("div", { style:{ fontSize:11, color:T.muted } }, p.imei ? `IMEI: ${p.imei}` : "No IMEI")
          ),
          E("div", { style:{ textAlign:"right" } },
            E("div", { style:{ fontWeight:700, color:T.blue } }, fmtMoney(showVal?parseFloat(p.total_invoice)||0:parseFloat(p.expected_sell)||0)),
            E("div", { style:{ fontSize:11, color:T.muted } }, showVal?"cost":"retail")
          )
        ))
      )
    ),

    // Catalog breakdown by category
    Object.entries(catGroups).sort((a,b)=>(b[1].costTotal-a[1].costTotal)).map(([cat, group]) =>
      E("div", { key:cat, style:{ marginBottom:20 } },
        E("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 } },
          E(ST, { style:{ margin:0 } }, cat, ` (${group.items.length} SKUs)`),
          E("div", { style:{ fontWeight:700, color:T.blue, fontSize:14 } }, fmtMoney(showVal?group.costTotal:group.retailTotal))
        ),
        E("div", { style:{ display:"flex", flexDirection:"column", gap:4 } },
          group.items.map((item,i) => E("div", { key:i, style:{ background:T.card, border:`1px solid ${T.border}`, borderRadius:8, padding:"8px 14px", display:"flex", justifyContent:"space-between", alignItems:"center" } },
            E("div", null,
              E("div", { style:{ fontSize:13, fontWeight:500 } }, item.name),
              E("div", { style:{ fontSize:11, color:T.muted } }, `${item.stock} units × ${fmtMoney(showVal?item.cost||0:item.price||0)}`)
            ),
            E("div", { style:{ fontWeight:700, color:T.blue } }, fmtMoney(showVal?item.costValue:item.retailValue))
          ))
        )
      )
    )
  );
}

// ── Inventory Count ───────────────────────────────────────────────────────────
function InventoryCount() {
  const E = React.createElement;
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [session, setSession] = useState(null); // null | "active" | "review"
  const [counts, setCounts] = useState({}); // { productId: countedQty }
  const [scanInput, setScanInput] = useState("");
  const [lastScanned, setLastScanned] = useState(null);
  const [scanMode, setScanMode] = useState(false);
  const [catFilter, setCatFilter] = useState("all");
  const [search, setSearch] = useState("");
  const scanRef = React.useRef(null);
  const [saving, setSaving] = useState(false);
  const [history, setHistory] = useState([]);

  useEffect(() => {
    (async () => {
      try {
        const meta = await load("tpp-products-meta");
        if (meta && meta.chunks) {
          const all = [];
          for (let i = 0; i < meta.chunks; i++) {
            const chunk = await load(`tpp-products-chunk-${i}`);
            if (Array.isArray(chunk)) all.push(...chunk);
          }
          setProducts(all);
        } else {
          setProducts(await loadArr("tpp-products"));
        }
      } catch { setProducts(await loadArr("tpp-products")); }
      setHistory(await loadArr("tpp-count-history"));
      setLoading(false);
    })();
  }, []);

  // Focus scan input when scan mode active
  useEffect(() => {
    if (scanMode && scanRef.current) scanRef.current.focus();
  }, [scanMode]);

  const startCount = () => {
    const initial = {};
    products.forEach(p => { initial[p.id] = ""; });
    setCounts(initial);
    setSession("active");
    setLastScanned(null);
  };

  const handleScan = (barcode) => {
    const trimmed = barcode.trim();
    if (!trimmed) return;
    const product = products.find(p => p.barcode === trimmed || p.sku === trimmed);
    if (product) {
      setCounts(prev => ({ ...prev, [product.id]: (parseInt(prev[product.id])||0) + 1 }));
      setLastScanned({ name: product.name, newCount: (parseInt(counts[product.id])||0) + 1 });
      setTimeout(() => setLastScanned(null), 2000);
    } else {
      setLastScanned({ name: `Unknown barcode: ${trimmed}`, newCount: null, error: true });
      setTimeout(() => setLastScanned(null), 2000);
    }
    setScanInput("");
  };

  const discrepancies = products.filter(p => counts[p.id] !== "" && parseInt(counts[p.id]) !== (p.stock||0));
  const counted = products.filter(p => counts[p.id] !== "");

  const commitCount = async () => {
    setSaving(true);
    try {
      const meta = await load("tpp-products-meta");
      let allProducts = [];
      if (meta && meta.chunks) {
        for (let i = 0; i < meta.chunks; i++) {
          const chunk = await load(`tpp-products-chunk-${i}`);
          if (Array.isArray(chunk)) allProducts.push(...chunk);
        }
      } else {
        allProducts = await loadArr("tpp-products");
      }

      const adjustments = [];
      const updated = allProducts.map(p => {
        const counted_qty = counts[p.id];
        if (counted_qty === "" || counted_qty === undefined) return p;
        const newStock = parseInt(counted_qty)||0;
        if (newStock !== (p.stock||0)) {
          adjustments.push({ name:p.name, expected:p.stock||0, counted:newStock, diff:newStock-(p.stock||0) });
        }
        return { ...p, stock: newStock };
      });

      // Save updated products
      if (meta && meta.chunks) {
        const CHUNK = 100; const chunks = [];
        for (let i = 0; i < updated.length; i += CHUNK) chunks.push(updated.slice(i, i+CHUNK));
        await save("tpp-products-meta", { ...meta, total:updated.length });
        for (let i = 0; i < chunks.length; i++) await save(`tpp-products-chunk-${i}`, chunks[i]);
      } else {
        await save("tpp-products", updated);
      }
      setProducts(updated);

      // Save count history
      const countRecord = { id:Date.now().toString(), date:todayStr(), createdAt:new Date().toISOString(), totalCounted:counted.length, adjustments };
      const updatedHistory = [countRecord, ...history];
      await save("tpp-count-history", updatedHistory);
      setHistory(updatedHistory);

      setSession(null); setCounts({}); setScanMode(false);
      alert(`✅ Count complete. ${adjustments.length} adjustment(s) made.`);
    } finally { setSaving(false); }
  };

  const cats = ["all", ...Array.from(new Set(products.map(p=>p.category).filter(Boolean))).sort()];
  const filteredProducts = products.filter(p => {
    const matchCat = catFilter === "all" || p.category === catFilter;
    const matchQ = !search || p.name.toLowerCase().includes(search.toLowerCase()) || (p.barcode||"").includes(search);
    return matchCat && matchQ;
  });

  if (loading) return E("div", { style:{ textAlign:"center", padding:"60px 20px", color:T.muted } }, "Loading...");

  // ── No active session ──────────────────────────────────────────────────────
  if (!session) return E("div", { style:{ maxWidth:600, margin:"0 auto" } },
    E("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 } },
      E("div", null,
        E("h2", { style:{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:20, margin:0 } }, "🔢 Stock Count"),
        E("div", { style:{ fontSize:12, color:T.muted, marginTop:4 } }, "Count your physical stock and reconcile with the system.")
      ),
      E(Btn, { onClick:startCount }, "▶ Start New Count")
    ),
    history.length > 0 && E("div", null,
      E(ST, null, "Previous Counts"),
      E("div", { style:{ display:"flex", flexDirection:"column", gap:8 } },
        history.slice(0,5).map((h,i) => E(Card, { key:i },
          E("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center" } },
            E("div", null,
              E("div", { style:{ fontWeight:600, fontSize:13 } }, fmtDate(h.createdAt)),
              E("div", { style:{ fontSize:12, color:T.muted, marginTop:2 } }, `${h.totalCounted} items counted · ${h.adjustments?.length||0} adjustments`)
            ),
            h.adjustments?.length > 0 && E("span", { style:{ background:T.amberLt, color:T.amber, borderRadius:6, padding:"2px 8px", fontSize:11, fontWeight:700 } }, `${h.adjustments.length} adj.`)
          )
        ))
      )
    )
  );

  // ── Active count session ───────────────────────────────────────────────────
  return E("div", { style:{ maxWidth:700, margin:"0 auto" } },
    // Header
    E("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 } },
      E("div", null,
        E("h2", { style:{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:20, margin:0 } }, "🔢 Count in Progress"),
        E("div", { style:{ fontSize:12, color:T.muted, marginTop:4 } }, `${counted.length} of ${products.length} items counted · ${discrepancies.length} discrepancy(s)`)
      ),
      E("div", { style:{ display:"flex", gap:8 } },
        E(Btn, { variant:"ghost", onClick:()=>{ if(confirm("Abandon this count?")) { setSession(null); setCounts({}); } } }, "✕ Abandon"),
        E(Btn, { variant:"green", disabled:counted.length===0||saving, onClick:commitCount }, saving?"Saving...":"✅ Commit Count")
      )
    ),

    // Scan mode toggle + input
    E("div", { style:{ background:scanMode?T.blueLt:T.card, border:`1px solid ${scanMode?T.blue:T.border}`, borderRadius:12, padding:"14px 16px", marginBottom:16 } },
      E("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:scanMode?12:0 } },
        E("div", null,
          E("div", { style:{ fontWeight:700, fontSize:14 } }, "📷 Barcode Scanner Mode"),
          E("div", { style:{ fontSize:12, color:T.muted } }, "Use camera or plug in USB/Bluetooth scanner — scans auto-increment count")
        ),
        E("button", { onClick:()=>setScanMode(s=>!s), style:{ background:scanMode?T.blue:"#F3F4F6", color:scanMode?"#fff":T.muted, border:"none", borderRadius:8, padding:"8px 16px", fontWeight:700, fontSize:13, cursor:"pointer", fontFamily:"inherit" } }, scanMode?"ON":"OFF")
      ),
      scanMode && E("div", null,
        lastScanned && E("div", { style:{ background:lastScanned.error?T.redLt:T.greenLt, border:`1px solid ${lastScanned.error?"#FECACA":"#A7F3D0"}`, borderRadius:8, padding:"8px 14px", marginBottom:8, fontSize:13, fontWeight:600, color:lastScanned.error?T.red:T.green } },
          lastScanned.error ? `❌ ${lastScanned.name}` : `✅ ${lastScanned.name} — Count: ${lastScanned.newCount}`
        ),
        E("div", { style:{ display:"flex", gap:8 } },
          E("input", {
            ref: scanRef,
            placeholder: "Scan barcode or type and press Enter...",
            value: scanInput,
            onChange: e => setScanInput(e.target.value),
            onKeyDown: e => { if (e.key === "Enter") { handleScan(scanInput); } },
            style: { ...iS, flex:1, fontSize:15, fontWeight:700, letterSpacing:1 },
            autoComplete: "off"
          }),
          E(Btn, { onClick:()=>handleScan(scanInput) }, "→")
        ),
        E("div", { style:{ fontSize:11, color:T.muted, marginTop:6 } }, "💡 USB/Bluetooth scanners work automatically — just scan and it increments the count.")
      )
    ),

    // Discrepancy summary
    discrepancies.length > 0 && E("div", { style:{ background:T.amberLt, border:`1px solid #FDE68A`, borderRadius:10, padding:"10px 16px", marginBottom:16, fontSize:13 } },
      E("div", { style:{ fontWeight:700, color:T.amber, marginBottom:6 } }, `⚠️ ${discrepancies.length} discrepancy(s) found`),
      discrepancies.slice(0,3).map((p,i) => E("div", { key:i, style:{ fontSize:12, color:"#92400E" } },
        `${p.name}: expected ${p.stock||0}, counted ${counts[p.id]||0} (${parseInt(counts[p.id]||0)-(p.stock||0)>0?"+":""}${parseInt(counts[p.id]||0)-(p.stock||0)})`
      )),
      discrepancies.length > 3 && E("div", { style:{ fontSize:11, color:T.amber, marginTop:4 } }, `+ ${discrepancies.length-3} more...`)
    ),

    // Filter bar
    E("div", { style:{ display:"flex", gap:8, marginBottom:12 } },
      E(Sel, { value:catFilter, onChange:e=>setCatFilter(e.target.value), style:{ width:"auto" } },
        cats.map(c=>E("option",{key:c,value:c},c==="all"?"All Categories":c))
      ),
      E(Input, { placeholder:"🔍 Search name or barcode...", value:search, onChange:e=>setSearch(e.target.value) })
    ),

    // Product list with count inputs
    E("div", { style:{ display:"flex", flexDirection:"column", gap:6 } },
      filteredProducts.map((p,i) => {
        const counted_qty = counts[p.id];
        const hasDiff = counted_qty !== "" && counted_qty !== undefined && parseInt(counted_qty) !== (p.stock||0);
        const diff = counted_qty !== "" && counted_qty !== undefined ? parseInt(counted_qty||0) - (p.stock||0) : 0;
        return E("div", { key:i, style:{ background:T.card, border:`1px solid ${hasDiff?"#FDE68A":T.border}`, borderRadius:10, padding:"10px 14px", display:"flex", justifyContent:"space-between", alignItems:"center", gap:10 } },
          E("div", { style:{ flex:1, minWidth:0 } },
            E("div", { style:{ fontSize:13, fontWeight:500, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" } }, p.name),
            E("div", { style:{ fontSize:11, color:T.muted, marginTop:2 } }, p.category, p.barcode ? ` · ${p.barcode}` : "")
          ),
          E("div", { style:{ display:"flex", alignItems:"center", gap:8, flexShrink:0 } },
            E("div", { style:{ fontSize:12, color:T.muted, textAlign:"right" } },
              E("div", null, "Expected"),
              E("div", { style:{ fontWeight:700, color:T.text } }, p.stock||0)
            ),
            E("input", {
              type: "number",
              min: "0",
              placeholder: "Count",
              value: counts[p.id] || "",
              onChange: e => setCounts(prev => ({ ...prev, [p.id]: e.target.value })),
              style: { ...iS, width:70, textAlign:"center", padding:"6px 8px", borderColor: hasDiff?"#FDE68A":T.border }
            }),
            hasDiff && E("div", { style:{ fontSize:12, fontWeight:700, color:diff>0?T.green:T.red, minWidth:36, textAlign:"center" } }, `${diff>0?"+":""}${diff}`)
          )
        );
      })
    )
  );
}

// ── Purchases Tab ─────────────────────────────────────────────────────────────
const PURCHASE_TYPE_CATS = {
  phones: ["Like New Samsung","Like New IPhones","New in box","HOTWAV","Tablets","Gadgets"],
  accessories: ["Accessories - Samsung Cases","Accessories - Apple Cases","Accessories - Other","Accessories- Samsung","Accessories- Apple","Tablet Cases"],
  parts: ["Parts & Components"],
  gadgets: ["Gadgets"]
};

function PurchasesTab() {
  const E = React.createElement;
  const [history, setHistory] = useState([]);
  const [pos, setPos] = useState([]); // purchase orders
  const [filter, setFilter] = useState("all");
  const [monthFilter, setMonthFilter] = useState(todayStr().slice(0,7));
  const [showAddPO, setShowAddPO] = useState(false);
  const [newPO, setNewPOS] = useState({ supplier:"", poRef:"", date:todayStr(), total:"", type:"accessories", notes:"" });
  const setNPO = (k,v) => setNewPOS(p=>({...p,[k]:v}));
  const [view, setView] = useState("history"); // "history" | "pos"

  useEffect(() => {
    loadArr("tpp-stock-receives").then(setHistory);
    loadArr("tpp-purchase-orders").then(setPos);
  }, []);

  const savePO = async () => {
    if (!newPO.supplier.trim()) { alert("Supplier required."); return; }
    const po = { id: Date.now().toString(), ...newPO, total: parseFloat(newPO.total)||0, createdAt: new Date().toISOString(), status: "open" };
    const updated = [po, ...pos];
    await save("tpp-purchase-orders", updated);
    setPos(updated);
    setNewPOS({ supplier:"", poRef:"", date:todayStr(), total:"", type:"accessories", notes:"" });
    setShowAddPO(false);
  };

  const voidPO = async (id) => {
    const reason = prompt("Reason for voiding this PO?");
    if (!reason) return;
    const updated = pos.map(p => p.id===id ? {...p, status:"voided", voidReason:reason, voidedAt:new Date().toISOString()} : p);
    await save("tpp-purchase-orders", updated);
    setPos(updated);
  };

  const getType = (entry) => {
    const cat = (entry.category||"").toLowerCase();
    if (cat.includes("part") || cat.includes("screen") || cat.includes("battery") || cat.includes("port")) return "parts";
    if (PURCHASE_TYPE_CATS.phones.some(c=>c.toLowerCase()===cat)) return "phones";
    if (cat.includes("case") || cat.includes("accessory") || cat.includes("accessories")) return "accessories";
    if (cat.includes("gadget") || cat.includes("tablet")) return "gadgets";
    return "accessories";
  };

  const filtered = history.filter(h => {
    const matchType = filter === "all" || getType(h) === filter;
    const matchMonth = !monthFilter || (h.receivedDate||h.createdAt||"").startsWith(monthFilter);
    return matchType && matchMonth;
  });

  const pending = history.filter(h => h.purchase_pending);

  const totalByType = { phones:0, accessories:0, parts:0, gadgets:0 };
  filtered.forEach(h => {
    const t = getType(h);
    const amt = (parseFloat(h.costPerUnit)||0) * (parseInt(h.qty)||0);
    totalByType[t] = (totalByType[t]||0) + amt;
  });
  const grandTotal = Object.values(totalByType).reduce((s,v)=>s+v,0);
  const TYPE_LABELS = { phones:"📱 Phones", accessories:"📦 Accessories", parts:"🔧 Parts", gadgets:"📡 Gadgets" };

  return E("div", { style:{ maxWidth:680, margin:"0 auto" } },
    E("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 } },
      E("h2", { style:{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:20, margin:0 } }, "💸 Purchases"),
      E("div", { style:{ display:"flex", gap:8 } },
        E("button", { onClick:()=>setView("history"), style:{ background:view==="history"?T.blue:"#F3F4F6", color:view==="history"?"#fff":T.muted, border:"none", borderRadius:8, padding:"8px 14px", fontSize:13, fontWeight:700, cursor:"pointer", fontFamily:"inherit" } }, "📋 History"),
        E("button", { onClick:()=>setView("pos"), style:{ background:view==="pos"?T.blue:"#F3F4F6", color:view==="pos"?"#fff":T.muted, border:"none", borderRadius:8, padding:"8px 14px", fontSize:13, fontWeight:700, cursor:"pointer", fontFamily:"inherit" } }, "📄 Purchase Orders"),
        E(Btn, { onClick:()=>{ setShowAddPO(s=>!s); setView("pos"); } }, showAddPO?"✕ Cancel":"+ New PO")
      )
    ),

    // Add PO form
    showAddPO && E(Card, { style:{ marginBottom:16 } },
      E(ST, null, "New Purchase Order"),
      E("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:12 } },
        E(Field, { label:"Supplier", required:true }, E(Input, { placeholder:"e.g. Cell Parts JA", value:newPO.supplier, onChange:e=>setNPO("supplier",e.target.value) })),
        E(Field, { label:"PO / Invoice Reference" }, E(Input, { placeholder:"Invoice # or PO number", value:newPO.poRef, onChange:e=>setNPO("poRef",e.target.value) })),
        E(Field, { label:"Date" }, E(Input, { type:"date", value:newPO.date, onChange:e=>setNPO("date",e.target.value) })),
        E(Field, { label:"Total Amount (JMD)" }, E(Input, { type:"number", placeholder:"0", value:newPO.total, onChange:e=>setNPO("total",e.target.value) })),
        E(Field, { label:"Stock Type" }, E(Sel, { value:newPO.type, onChange:e=>setNPO("type",e.target.value) },
          E("option",{value:"accessories"},"📦 Accessories"),
          E("option",{value:"phones"},"📱 Phones"),
          E("option",{value:"parts"},"🔧 Parts"),
          E("option",{value:"gadgets"},"📡 Gadgets"),
          E("option",{value:"mixture"},"🔀 Mixture")
        ))
      ),
      E(Field, { label:"Notes" }, E(Input, { placeholder:"Optional", value:newPO.notes, onChange:e=>setNPO("notes",e.target.value) })),
      E("div", { style:{ marginTop:12 } }, E(Btn, { onClick:savePO }, "Save Purchase Order"))
    ),

    // Purchase Orders list
    view === "pos" && E("div", null,
      E(ST, null, `Purchase Orders (${pos.filter(p=>p.status==="open").length} open)`),
      pos.length === 0
        ? E("div", { style:{ textAlign:"center", padding:"30px 20px", color:T.muted } }, "No purchase orders yet. Create one above and reference it when receiving stock.")
        : E("div", { style:{ display:"flex", flexDirection:"column", gap:8 } },
            pos.map((po,i) => E("div", { key:i, style:{ background:T.card, border:`1px solid ${po.status==="voided"?"#FECACA":T.border}`, borderRadius:12, padding:"14px 16px", opacity:po.status==="voided"?0.5:1, borderLeft:`3px solid ${po.status==="voided"?T.red:po.status==="closed"?T.green:T.blue}` } },
              E("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" } },
                E("div", null,
                  E("div", { style:{ fontWeight:700, fontSize:14 } }, po.supplier, po.poRef ? ` — ${po.poRef}` : ""),
                  E("div", { style:{ fontSize:12, color:T.muted, marginTop:2 } }, po.date, ` · ${TYPE_LABELS[po.type]||po.type}`, po.notes ? ` · ${po.notes}` : ""),
                  po.status === "voided" && E("div", { style:{ fontSize:11, color:T.red, marginTop:2 } }, `Voided: ${po.voidReason}`)
                ),
                E("div", { style:{ display:"flex", alignItems:"center", gap:8 } },
                  po.total > 0 && E("div", { style:{ fontWeight:700, color:T.blue } }, fmtMoney(po.total)),
                  E("span", { style:{ background:po.status==="open"?T.blueLt:po.status==="closed"?T.greenLt:T.redLt, color:po.status==="open"?T.blue:po.status==="closed"?T.green:T.red, borderRadius:6, padding:"2px 8px", fontSize:11, fontWeight:700 } }, po.status),
                  po.status === "open" && E("button", { onClick:()=>voidPO(po.id), style:{ background:T.redLt, color:T.red, border:"none", borderRadius:6, padding:"4px 8px", fontSize:11, fontWeight:700, cursor:"pointer" } }, "Void")
                )
              )
            ))
          )
    ),

    // History view
    view === "history" && E("div", null,
      E(R2, null,
        E(StatCard, { label:"Total spent", value:fmtMoney(grandTotal), color:T.blue }),
        E(StatCard, { label:"PO pending details", value:String(pending.length), color:pending.length>0?T.amber:T.green })
      ),
      E("div", { style:{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:8, marginBottom:20, marginTop:12 } },
        Object.entries(TYPE_LABELS).map(([type, label]) => E("div", { key:type, style:{ background:T.card, border:`1px solid ${T.border}`, borderRadius:10, padding:"10px 12px", textAlign:"center" } },
          E("div", { style:{ fontSize:11, color:T.muted } }, label),
          E("div", { style:{ fontWeight:700, fontSize:14, color:T.blue, marginTop:4 } }, fmtMoney(totalByType[type]||0))
        ))
      ),
      E("div", { style:{ display:"flex", gap:8, marginBottom:16 } },
        E("input", { type:"month", value:monthFilter, onChange:e=>setMonthFilter(e.target.value), style:{ ...iS, width:"auto" } }),
        E(Sel, { value:filter, onChange:e=>setFilter(e.target.value), style:{ width:"auto" } },
          E("option", { value:"all" }, "All Types"),
          ...Object.entries(TYPE_LABELS).map(([type,label])=>E("option",{key:type,value:type},label))
        )
      ),
      pending.length > 0 && E("div", { style:{ background:T.amberLt, border:`1px solid #FDE68A`, borderRadius:10, padding:"12px 16px", marginBottom:16, fontSize:13, color:T.amber } },
        `⚠️ ${pending.length} stock receive(s) missing purchase details — check your ✅ To Do list.`
      ),
      filtered.length === 0
        ? E("div", { style:{ textAlign:"center", padding:"40px 20px", color:T.muted } }, "No purchases found for this period.")
        : E("div", { style:{ display:"flex", flexDirection:"column", gap:8 } },
            filtered.map((h,i) => {
              const lineTotal = (parseFloat(h.costPerUnit)||0) * (parseInt(h.qty)||0);
              const linkedPO = pos.find(p => p.poRef === h.poRef && p.supplier === h.supplier);
              return E(Card, { key:i, style:{ borderLeft:`3px solid ${h.purchase_pending?T.amber:T.green}` } },
                E("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center" } },
                  E("div", null,
                    E("div", { style:{ fontWeight:600, fontSize:13 } }, h.productName),
                    E("div", { style:{ fontSize:11, color:T.muted, marginTop:2 } },
                      `${h.qty} units @ ${fmtMoney(h.costPerUnit||0)} · ${h.receivedDate||fmtDate(h.createdAt)}`,
                      h.supplier ? ` · ${h.supplier}` : "",
                      h.poRef ? ` · PO: ${h.poRef}` : "",
                      linkedPO ? E("span", { style:{ color:T.green, marginLeft:4 } }, "✅ PO on file") : ""
                    ),
                    h.purchase_pending && E("span", { style:{ background:T.amberLt, color:T.amber, borderRadius:4, padding:"1px 6px", fontSize:10, fontWeight:700 } }, "⚠️ PO pending")
                  ),
                  E("div", { style:{ fontWeight:700, color:T.blue, fontSize:14 } }, fmtMoney(lineTotal))
                )
              );
            })
          )
    )
  );
}

// ── Settings Tab ──────────────────────────────────────────────────────────────
const API_KEY_STORE = "tpp_anthropic_key";

function SettingsTab() {
  const E = React.createElement;
  const [apiKey, setApiKeyState] = useState(() => {
    try { return localStorage.getItem(API_KEY_STORE) || ""; } catch { return ""; }
  });
  const [keyInput, setKeyInput] = useState("");
  const [showKey, setShowKey] = useState(false);
  const [saved, setSaved] = useState(false);

  const saveKey = () => {
    if (!keyInput.trim().startsWith("sk-ant-")) {
      alert("That doesn't look like a valid Anthropic API key. It should start with sk-ant-");
      return;
    }
    try { localStorage.setItem(API_KEY_STORE, keyInput.trim()); } catch {}
    setApiKeyState(keyInput.trim());
    setKeyInput("");
    setSaved(true);
    setTimeout(() => setSaved(false), 3000);
  };

  const clearKey = () => {
    if (!confirm("Remove the saved API key? AI scanning on the Phones tab will stop working until you add it back.")) return;
    try { localStorage.removeItem(API_KEY_STORE); } catch {}
    setApiKeyState("");
  };

  const masked = apiKey ? `sk-ant-...${apiKey.slice(-6)}` : "";

  return E("div", { style:{ maxWidth:520, margin:"0 auto" } },
    E("h2", { style:{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:20, marginBottom:4 } }, "⚙️ Settings"),
    E("div", { style:{ fontSize:13, color:T.muted, marginBottom:28 } }, "Manage API keys and system configuration."),

    // ── Anthropic API Key ──
    E(Card, { style:{ marginBottom:20 } },
      E(ST, null, "Anthropic API Key"),
      E("div", { style:{ fontSize:13, color:T.muted, marginBottom:16, lineHeight:1.7 } },
        "Required for AI invoice scanning on the 📦 Products tab. ",
        E("a", { href:"https://console.anthropic.com", target:"_blank", rel:"noopener noreferrer", style:{ color:T.blue } }, "Get your key at console.anthropic.com"),
        " — it starts with ", E("code", { style:{ background:"#F3F4F6", padding:"1px 6px", borderRadius:4, fontSize:12 } }, "sk-ant-..."),
        ". The key is stored only in this browser — never sent to any server except Anthropic."
      ),
      apiKey
        ? E("div", null,
            E("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center", background:T.greenLt, border:"1px solid #A7F3D0", borderRadius:10, padding:"12px 16px", marginBottom:12 } },
              E("div", null,
                E("div", { style:{ fontSize:13, fontWeight:700, color:T.green } }, "✅ API key saved"),
                E("div", { style:{ fontSize:12, color:T.muted, marginTop:2 } }, showKey ? apiKey : masked,
                  E("button", { onClick:()=>setShowKey(s=>!s), style:{ background:"none", border:"none", cursor:"pointer", color:T.blue, fontSize:11, marginLeft:8 } }, showKey?"Hide":"Show")
                )
              ),
              E(Btn, { variant:"danger", style:{ fontSize:12, padding:"6px 12px" }, onClick:clearKey }, "Remove")
            ),
            E("div", { style:{ fontSize:12, color:T.muted } }, "To replace it, enter a new key below:"),
            E("div", { style:{ display:"flex", gap:8, marginTop:8 } },

function DebtLedger() {
  const E = React.createElement;
  const [debts, setDebts] = useState(null);
  const [payments, setPayments] = useState([]);
  const [checkins, setCheckins] = useState([]);

  const [newDebt, setNewDebt] = useState({ name:"", type:"Personal", category:"Credit Card", balance:"", apr:"", minPayment:"", due:"", notes:"" });
  const setND = (k,v) => setNewDebt(p=>({...p,[k]:v}));

  const fetchAll = async () => {
    let d = await loadArr("tpp-debts");
    const p = await loadArr("tpp-debt-payments");
    const c = await loadArr("tpp-debt-checkins");
    setDebts(d); setPayments(p); setCheckins(c);
  };
  useEffect(() => { fetchAll(); }, []);

  if (debts === null) return E("div", { style: { textAlign:"center", padding:"60px 20px", color:T.muted } }, "Loading...");

  const totalRemaining = debts.filter(d=>!d.voided).reduce((s,d)=>s+(parseFloat(d.balance)||0),0);
  const now = new Date();
  const paidThisMonth = payments.filter(p => { const dt=new Date(p.date); return dt.getMonth()===now.getMonth()&&dt.getFullYear()===now.getFullYear(); }).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
  const checkedInToday = checkins.includes(todayStr());
  const streak = computeStreak(checkins);

  const checkIn = async () => {
    if (checkedInToday) return;
    const updated = [todayStr(), ...checkins];
    await save("tpp-debt-checkins", updated); setCheckins(updated);
  };

  const addDebt = async () => {
    if (!newDebt.name.trim()||!newDebt.balance) { alert("Name and balance required."); return; }
    const debt = { id: Date.now().toString(), ...newDebt, balance: parseFloat(newDebt.balance)||0, apr: parseFloat(newDebt.apr)||0, minPayment: parseFloat(newDebt.minPayment)||0, due: parseInt(newDebt.due)||1, createdAt: new Date().toISOString(), voided: false };
