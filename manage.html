    await save("tpp-debts", updated); setDebts(updated);
    setNewDebt({ name:"", type:"Personal", category:"Credit Card", balance:"", apr:"", minPayment:"", due:"", notes:"" });
    setShowAdd(false);
  };

  const logPayment = async debt => {
    const amt = parseFloat(payAmt[debt.id]);
    if (!amt||amt<=0) { alert("Enter an amount greater than 0."); return; }
    const updatedDebts = debts.map(d=>d.id===debt.id?{...d,balance:Math.max(0,(parseFloat(d.balance)||0)-amt)}:d);
    const newPayment = { debtId:debt.id, name:debt.name, amount:amt, date:new Date().toISOString() };
    const updatedPayments = [newPayment,...payments];
    await save("tpp-debts",updatedDebts); await save("tpp-debt-payments",updatedPayments);
    setDebts(updatedDebts); setPayments(updatedPayments);
    setPayAmt(p=>({...p,[debt.id]:""})); setExpanded(null);
  };

  const saveEdit = async debt => {
    const newBal = parseFloat(editVal);
    if (isNaN(newBal)||newBal<0) { alert("Enter a valid balance."); return; }
    const updated = debts.map(d=>d.id===debt.id?{...d,balance:newBal}:d);
    await save("tpp-debts",updated); setDebts(updated); setEditing(null); setEditVal("");
  };

  const voidDebt = async debt => {
    const reason = prompt("Reason for voiding this debt?");
    if (reason===null) return;
    const updated = debts.map(d=>d.id===debt.id?{...d,voided:true,voidReason:reason,voidedAt:new Date().toISOString()}:d);
    await save("tpp-debts",updated); setDebts(updated);
  };

  // Group debts
  const activeDebts = debts.filter(d=>!d.voided);
  const groups = groupBy === "type"
    ? { Personal: activeDebts.filter(d=>d.type==="Personal"), Business: activeDebts.filter(d=>d.type==="Business") }
    : DEBT_CATEGORIES.reduce((acc,cat)=>({ ...acc, [cat]: activeDebts.filter(d=>d.category===cat) }), {});

  const renderDebtCard = (debt) => {
    const isPaid = debt.balance<=0;
    const days = daysUntilDue(parseInt(debt.due)||1);
    let statusColor, statusLabel;
    if (isPaid) { statusColor=T.green; statusLabel="Paid off ✅"; }
    else if (days===0) { statusColor=T.red; statusLabel="Due today!"; }
    else if (days<=3) { statusColor=T.amber; statusLabel=`Due in ${days}d`; }
    else { statusColor=T.muted; statusLabel=`Due in ${days}d`; }
    const isExpanded=expanded===debt.id, isEditing=editing===debt.id;

    return E(Card, { key:debt.id, style:{ marginBottom:8, opacity:isPaid?0.55:1, borderLeft:`3px solid ${debt.category==="Credit Card"?T.blue:debt.category==="Loan"?T.amber:debt.category==="Creditor"?T.red:"#7C3AED"}` } },
      E("div", { onClick:()=>{ if(!isPaid&&!isEditing){ setExpanded(isExpanded?null:debt.id); } }, style:{ display:"flex", justifyContent:"space-between", alignItems:"center", cursor:isPaid?"default":"pointer" } },
        E("div", null,
          E("div", { style:{ fontWeight:700, fontSize:14 } }, debt.name),
          E("div", { style:{ fontSize:11, color:T.muted, marginTop:2 } }, debt.category, debt.apr ? ` · ${debt.apr}% APR` : " · 0% APR", ` · ${debt.type}`)
        ),
        E("div", { style:{ display:"flex", alignItems:"center", gap:8 } },
          E("div", { style:{ textAlign:"right" } },
            E("div", { style:{ fontWeight:700, fontSize:14 } }, fmtUSD(debt.balance)),
            E("div", { style:{ fontSize:11, color:statusColor, marginTop:2, fontWeight:600 } }, statusLabel)
          ),
          E("button", { onClick:e=>{ e.stopPropagation(); setEditing(isEditing?null:debt.id); setEditVal(String(debt.balance)); setExpanded(null); }, style:{ background:T.blueLt, color:T.blue, border:"none", borderRadius:6, padding:"4px 8px", fontSize:11, fontWeight:700, cursor:"pointer" } }, isEditing?"Cancel":"Edit"),
          !isPaid && E("button", { onClick:e=>{ e.stopPropagation(); voidDebt(debt); }, style:{ background:T.redLt, color:T.red, border:"none", borderRadius:6, padding:"4px 8px", fontSize:11, fontWeight:700, cursor:"pointer" } }, "Void")
        )
      ),
      isEditing && E("div", { style:{ marginTop:12, paddingTop:12, borderTop:`1px solid ${T.border}` } },
        E("div", { style:{ fontSize:12, color:T.muted, marginBottom:6 } }, "Enter exact current balance from your statement (USD):"),
        E("div", { style:{ display:"flex", gap:8 } },
          E("div", { style:{ flex:1 } }, E(Input, { type:"number", placeholder:"e.g. 1234.56", value:editVal, onChange:e=>setEditVal(e.target.value) })),
          E(Btn, { onClick:()=>saveEdit(debt) }, "Save"),
          E(Btn, { variant:"ghost", onClick:()=>{ setEditing(null); setEditVal(""); } }, "Cancel")
        )
      ),
      isExpanded&&!isPaid&&!isEditing&&E("div", { style:{ marginTop:12, paddingTop:12, borderTop:`1px solid ${T.border}`, display:"flex", gap:8 } },
        E("div", { style:{ flex:1 } }, E(Input, { type:"number", placeholder:"Amount paid (USD)", value:payAmt[debt.id]||"", onChange:e=>setPayAmt(p=>({...p,[debt.id]:e.target.value})) })),
        E(Btn, { onClick:()=>logPayment(debt) }, "💰 Confirm Payment")
      )
    );
  };

  return E("div", { style:{ maxWidth:560, margin:"0 auto" } },
    // Header
    E("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 } },
      E("div", null,
        E("h2", { style:{ fontFamily:"'Syne',sans-serif", fontSize:20, fontWeight:800, color:T.text, margin:0 } }, "Debt Ledger"),
        E("div", { style:{ fontSize:12, color:T.muted, marginTop:4 } }, "Log payments, track due dates, build the streak.")
      ),
      E(Btn, { onClick:()=>setShowAdd(s=>!s) }, showAdd?"✕ Cancel":"+ Add Debt")
    ),

    // Add debt form
    showAdd && E(Card, { style:{ marginBottom:20, borderLeft:`3px solid ${T.blue}` } },
      E(ST, null, "New Debt"),
      E("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:12 } },
        E(Field, { label:"Lender / Name", required:true }, E(Input, { placeholder:"e.g. NCB Business Edge", value:newDebt.name, onChange:e=>setND("name",e.target.value) })),
        E(Field, { label:"Type" }, E(Sel, { value:newDebt.type, onChange:e=>setND("type",e.target.value) }, DEBT_TYPES.map(t=>E("option",{key:t},t)))),
        E(Field, { label:"Category" }, E(Sel, { value:newDebt.category, onChange:e=>setND("category",e.target.value) }, DEBT_CATEGORIES.map(c=>E("option",{key:c},c)))),
        E(Field, { label:"Current Balance (USD)", required:true }, E(Input, { type:"number", placeholder:"0.00", value:newDebt.balance, onChange:e=>setND("balance",e.target.value) })),
        E(Field, { label:"APR (%)", hint:"0 if interest-free" }, E(Input, { type:"number", placeholder:"0", value:newDebt.apr, onChange:e=>setND("apr",e.target.value) })),
        E(Field, { label:"Min. Payment (USD)" }, E(Input, { type:"number", placeholder:"0", value:newDebt.minPayment, onChange:e=>setND("minPayment",e.target.value) })),
        E(Field, { label:"Due Day of Month" }, E(Input, { type:"number", placeholder:"e.g. 15", min:1, max:31, value:newDebt.due, onChange:e=>setND("due",e.target.value) }))
      ),
      E(Field, { label:"Notes" }, E(Input, { placeholder:"Optional", value:newDebt.notes, onChange:e=>setND("notes",e.target.value) })),
      E("div", { style:{ marginTop:12 } }, E(Btn, { onClick:addDebt }, "Save Debt"))
    ),

    // Check-in
    E("div", { style:{ background:checkedInToday?T.greenLt:T.card, border:`1px solid ${checkedInToday?"#A7F3D0":T.border}`, borderRadius:12, padding:16, marginBottom:14, display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, boxShadow:"0 1px 3px rgba(0,0,0,0.06)" } },
      E("div", null,
        E("div", { style:{ fontWeight:700, fontSize:14 } }, checkedInToday?"Checked in for today":"Did you stick to plan today?"),
        E("div", { style:{ fontSize:12, color:T.muted, marginTop:2 } }, "No impulse spending — money went where it should")
      ),
      E(Btn, { variant:checkedInToday?"green":"primary", onClick:checkIn, disabled:checkedInToday }, checkedInToday?"✅ Logged":"Yes, log it")
    ),
    E("div", { style:{ display:"flex", alignItems:"center", gap:8, marginBottom:18, fontSize:13, color:T.muted } }, "🔥 ", E("b", { style:{ color:T.text } }, streak), " day streak of sticking to the plan"),

    // Summary
    E(R2, null,
      E(StatCard, { label:"Total remaining (USD)", value:fmtUSD(totalRemaining), color:T.blue }),
      E(StatCard, { label:"Paid this month", value:fmtUSD(paidThisMonth), color:T.green })
    ),
    E("div", { style:{ height:20 } }),

    // Group toggle
    E("div", { style:{ display:"flex", gap:8, marginBottom:16, alignItems:"center" } },
      E("span", { style:{ fontSize:12, color:T.muted } }, "Group by:"),
      E("button", { onClick:()=>setGroupBy("type"), style:{ background:groupBy==="type"?T.blue:"#F3F4F6", color:groupBy==="type"?"#fff":T.muted, border:"none", borderRadius:7, padding:"6px 12px", fontSize:12, fontWeight:600, cursor:"pointer", fontFamily:"inherit" } }, "Personal / Business"),
      E("button", { onClick:()=>setGroupBy("category"), style:{ background:groupBy==="category"?T.blue:"#F3F4F6", color:groupBy==="category"?"#fff":T.muted, border:"none", borderRadius:7, padding:"6px 12px", fontSize:12, fontWeight:600, cursor:"pointer", fontFamily:"inherit" } }, "Category")
    ),

    // Grouped debts
    Object.entries(groups).map(([group, groupDebts]) =>
      groupDebts.length === 0 ? null :
      E("div", { key:group, style:{ marginBottom:20 } },
        E(ST, null, group, ` (${groupDebts.length})`),
        groupDebts.map(renderDebtCard)
      )
    ),

    debts.filter(d=>!d.voided).length === 0 && E("div", { style:{ textAlign:"center", padding:"40px 20px", color:T.muted } },
      E("div", { style:{ fontSize:36, marginBottom:12 } }, "💳"),
      "No debts added yet. Tap + Add Debt to get started."
    ),

    // Payment history
    E(ST, null, "Payment History"),
    E(Card, null,
      payments.length===0
        ? E("div", { style:{ textAlign:"center", color:T.muted, fontSize:13, padding:"20px 0" } }, "No payments logged yet.")
        : payments.map((p,i)=>E("div", { key:i, style:{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", padding:"10px 0", borderBottom:i<payments.length-1?`1px dashed ${T.border}`:"none" } },
            E("div", null,
              E("div", { style:{ fontSize:13, fontWeight:600 } }, p.name),
              E("div", { style:{ fontSize:11, color:T.muted, marginTop:2 } }, new Date(p.date).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}))
            ),
            E("div", { style:{ fontWeight:700, color:T.green, fontFamily:"monospace" } }, "-"+fmtUSD(p.amount))
          ))
    )
  );
}

// ── Stock Receiving ───────────────────────────────────────────────────────────
function StockReceiving({ products, onProductsUpdate, invoiceType, allPhones = [], onPhonesDone }) {
  const E = React.createElement;
  const [drafts, setDrafts] = useState([]);
  const [activeDraft, setActiveDraft] = useState(null);
  const [history, setHistory] = useState([]);
  const [view, setView] = useState("main"); // "main" | "po" | "history"
  const [saving, setSaving] = useState(false);

  // AI scanning state
  const [scanning, setScanning] = useState(false);
  const [scanError, setScanError] = useState("");
  const fileInputRef = React.useRef(null);

  const scanInvoice = async (file) => {
    // Phone invoices go through InvoiceImporter (already has full flow)
    if (invoiceType === "phones") {
      alert("For phone invoices, use the 📱 Phones tab → Import Invoice. This gives you full IMEI entry and per-device verification.");
      return;
    }
    setScanning(true); setScanError("");
    const typeHints = {
      accessories: "accessories like phone cases, chargers, cables, screen protectors, headphones",
      parts: "phone repair parts like screens, batteries, charging ports, cameras, back glass",
      gadgets: "tech gadgets like smartwatches, earbuds, powerbanks, tablets",
      mixture: "a mix of phone accessories, parts, and gadgets"
    };
    const typeHint = typeHints[invoiceType] || "phone shop accessories and parts";
    try {
      const base64 = await new Promise((res, rej) => {
        const reader = new FileReader();
        reader.onload = () => res(reader.result.split(",")[1]);
        reader.onerror = rej;
        reader.readAsDataURL(file);
      });
      const isPDF = file.type === "application/pdf";
      const mediaType = isPDF ? "application/pdf" : file.type || "image/jpeg";

      const response = await fetch("/api/claude", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{
            role: "user",
            content: [
              isPDF
                ? { type: "document", source: { type: "base64", media_type: mediaType, data: base64 } }
                : { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
              { type: "text", text: `You are parsing a supplier invoice for a phone shop. This invoice contains ${typeHint}. Extract all line items and invoice details.

Return ONLY valid JSON, no markdown:
{
  "supplier": "supplier name or empty string",
  "poRef": "invoice number or empty string",
  "invoiceTotal": "total as number string or empty string",
  "receivedDate": "date YYYY-MM-DD or empty string",
  "lines": [
    {
      "name": "exact product name from invoice",
      "qty": "quantity as number string",
      "costPerUnit": "unit cost as number string",
      "category": "one of: Accessories - Samsung Cases, Accessories - Apple Cases, Accessories- Samsung, Accessories- Apple, Parts & Components, Gadgets, Tablets, Other",
      "barcode": "barcode or SKU if visible, else empty string"
    }
  ]
}` }
            ]
          }]
        })
      });

      const data = await response.json();
      const text = data.content?.find(c=>c.type==="text")?.text || "";
      const clean = text.replace(/```json|```/g,"").trim();
      const parsed = JSON.parse(clean);

      if (parsed.supplier) setPO("supplier", parsed.supplier);
      if (parsed.poRef) setPO("poRef", parsed.poRef);
      if (parsed.invoiceTotal) setPO("invoiceTotal", parsed.invoiceTotal);
      if (parsed.receivedDate) setPO("receivedDate", parsed.receivedDate);

      if (parsed.lines?.length > 0) {
        const newLines = parsed.lines.map(line => {
          const q = (line.name||"").toLowerCase();
          // Try to match to existing catalog
          const match = products.find(p =>
            p.name.toLowerCase().includes(q.slice(0,12)) ||
            q.includes(p.name.toLowerCase().slice(0,12)) ||
            (line.barcode && p.barcode === line.barcode)
          );
          return {
            productId: match?.id || null,
            name: match?.name || line.name,
            aiName: line.name,
            category: match?.category || line.category || "Other",
            isNew: !match,
            costPerUnit: line.costPerUnit || "",
            qty: line.qty || "1",
            barcode: line.barcode || match?.barcode || "",
            sku: match?.sku || "",
            price: match?.price || 0,
            needsVerification: !match
          };
        });
        setLines(newLines);
        setView("po");
        alert(`✅ Scanned ${parsed.lines.length} line items. Review — items flagged ⚠️ need to be matched or confirmed as new.`);
      } else {
        setScanError("No line items found. Try a clearer image or enter manually.");
      }
    } catch(e) {
      setScanError("Scan failed: " + e.message);
      console.error(e);
    } finally { setScanning(false); }
  };

  // PO header state
  const emptyPO = { supplier:"", poRef:"", invoiceTotal:"", receivedDate:todayStr(), notes:"" };
  const [po, setPOS] = useState(emptyPO);
  const [savedPOs, setSavedPOs] = useState([]);
  const [showPOPicker, setShowPOPicker] = useState(false);

  useEffect(() => {
    loadArr("tpp-purchase-orders").then(all => setSavedPOs((all||[]).filter(p=>p.status==="open")));
  }, [view]);
  const setPO = (k,v) => setPOS(p=>({...p,[k]:v}));

  // Line items
  const [lines, setLines] = useState([]);
  const [search, setSearch] = useState("");
  const [catFilter, setCatFilter] = useState("all");
  const [searchResults, setSearchResults] = useState([]);
  const [showNewLine, setShowNewLine] = useState(false);
  const emptyNew = { name:"", category:"Accessory", price:"", costPerUnit:"", barcode:"", qty:"1", sku:"" };
  const [newLine, setNewLine] = useState(emptyNew);
  const setNL = (k,v) => setNewLine(p=>({...p,[k]:v}));

  useEffect(() => {
    loadArr("tpp-stock-receives").then(setHistory);
    loadArr("tpp-po-drafts").then(setDrafts);
  }, []);

  // Categories from products
  const categories = ["all", ...Array.from(new Set(products.map(p=>p.category).filter(Boolean))).sort()];

  // Search
  useEffect(() => {
    if (!search.trim()) { setSearchResults([]); return; }
    const q = search.toLowerCase();
    const results = products.filter(p => {
      const matchCat = catFilter === "all" || p.category === catFilter;
      const matchQ = p.name.toLowerCase().includes(q) || (p.barcode||"").includes(q) || (p.sku||"").toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
      return matchCat && matchQ;
    }).slice(0,8);
    setSearchResults(results);
  }, [search, catFilter, products]);

  const lineTotal = lines.reduce((s,l) => s + (parseFloat(l.costPerUnit)||0)*(parseInt(l.qty)||0), 0);
  const invoiceAmt = parseFloat(po.invoiceTotal)||0;
  const variance = invoiceAmt > 0 ? invoiceAmt - lineTotal : 0;
  const reconciled = invoiceAmt > 0 && Math.abs(variance) < 0.01;

  const addExistingLine = (product) => {
    const existing = lines.find(l=>l.productId===product.id);
    if (existing) { setLines(ls=>ls.map(l=>l.productId===product.id?{...l,qty:String(parseInt(l.qty)+1)}:l)); }
    else { setLines(ls=>[...ls, { productId:product.id, name:product.name, category:product.category, isNew:false, costPerUnit:String(product.cost||0), qty:"1", barcode:product.barcode||"", sku:product.sku||"", price:product.price||0 }]); }
    setSearch(""); setSearchResults([]);
  };

  const addNewLine = () => {
    if (!newLine.name.trim()||!newLine.qty) { alert("Name and quantity required."); return; }
    setLines(ls=>[...ls, { ...newLine, productId:null, isNew:true }]);
    setNewLine(emptyNew); setShowNewLine(false);
  };

  const removeLine = (i) => setLines(ls=>ls.filter((_,idx)=>idx!==i));
  const updateLine = (i,k,v) => setLines(ls=>ls.map((l,idx)=>idx===i?{...l,[k]:v}:l));

  const saveDraft = async () => {
    const draft = { id: activeDraft?.id || Date.now().toString(), po, lines, savedAt: new Date().toISOString() };
    const updated = drafts.filter(d=>d.id!==draft.id);
    updated.unshift(draft);
    await save("tpp-po-drafts", updated);
    setDrafts(updated); setActiveDraft(draft);
    alert("✅ Draft saved. Resume anytime from the main screen.");
  };

  const loadDraft = (draft) => {
    setPOS(draft.po); setLines(draft.lines); setActiveDraft(draft); setView("po");
  };

  const deleteDraft = async (id) => {
    const updated = drafts.filter(d=>d.id!==id);
    await save("tpp-po-drafts", updated); setDrafts(updated);
    if (activeDraft?.id===id) { setPOS(emptyPO); setLines([]); setActiveDraft(null); }
  };

  const receiveAll = async () => {
    if (lines.length===0) { alert("Add at least one line item."); return; }
    if (invoiceAmt > 0 && !reconciled) {
      const proceed = confirm(`⚠️ Invoice total (${fmtMoney(invoiceAmt)}) does not match line item sum (${fmtMoney(lineTotal)}).

Variance: ${fmtMoney(Math.abs(variance))} ${variance>0?"short":"over"}.

Proceed anyway?`);
      if (!proceed) return;
    }
    const hasPO = po.supplier.trim() || po.poRef.trim();
    setSaving(true);
    try {
      let updatedProducts = [...products];
      const receiveEntries = [];
      const todos = await loadArr("tpp-todos");
      const newTodos = [];

      for (const line of lines) {
        const qty = parseInt(line.qty)||0;
        const cost = parseFloat(line.costPerUnit)||0;

        if (line.isNew) {
          // Create new product
          const newId = `new-${Date.now()}-${Math.random().toString(36).slice(2,6)}`;
          const newProduct = { id:newId, name:line.name, category:line.category, price:parseFloat(line.price)||0, cost, stock:qty, barcode:line.barcode||"", sku:line.sku||newId, variable_price:false, purchase_pending:!hasPO };
          updatedProducts.unshift(newProduct);
          receiveEntries.push({ id:Date.now().toString()+Math.random(), type:"new", productId:newId, productName:line.name, qty, costPerUnit:cost, poRef:po.poRef, supplier:po.supplier, receivedDate:po.receivedDate, purchase_pending:!hasPO, createdAt:new Date().toISOString() });
        } else {
          // Update existing
          updatedProducts = updatedProducts.map(p => p.id===line.productId ? {...p, stock:(p.stock||0)+qty, cost:cost||p.cost, purchase_pending:!hasPO} : p);
          receiveEntries.push({ id:Date.now().toString()+Math.random(), type:"existing", productId:line.productId, productName:line.name, qty, costPerUnit:cost, poRef:po.poRef, supplier:po.supplier, receivedDate:po.receivedDate, purchase_pending:!hasPO, createdAt:new Date().toISOString() });
        }
      }

      if (!hasPO) {
        newTodos.push({ id:Date.now().toString(), text:`Add purchase details for PO received ${po.receivedDate} — ${lines.length} items, total JMD ${fmtMoney(lineTotal)}`, createdAt:new Date().toISOString(), resolved:false, source:"system", priority:"high" });
      }

      await onProductsUpdate(updatedProducts);
      const updatedHistory = [...receiveEntries, ...history];
      await save("tpp-stock-receives", updatedHistory);
      setHistory(updatedHistory);
      if (newTodos.length) await save("tpp-todos", [...newTodos, ...todos]);

      // Remove draft if this was one
      if (activeDraft) {
        const updatedDrafts = drafts.filter(d=>d.id!==activeDraft.id);
        await save("tpp-po-drafts", updatedDrafts); setDrafts(updatedDrafts);
      }

      setPOS(emptyPO); setLines([]); setActiveDraft(null); setView("main");
      setSaving(false);
      alert(`✅ Received ${lines.length} line items across ${receiveEntries.reduce((s,e)=>s+e.qty,0)} total units.${!hasPO?" ⚠️ To-do created to add purchase details.":""}`);
    } catch(e) {
      setSaving(false);
      alert("Error: " + e.message);
    }
  };

  // ── MAIN VIEW ─────────────────────────────────────────────────────────────
  if (view === "main") return E("div", { style:{ maxWidth:600, margin:"0 auto" } },
    E("div", { style:{ marginBottom:20 } },
      E("h2", { style:{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:20, margin:0 } }, "📥 Receive Stock"),
      E("div", { style:{ fontSize:12, color:T.muted, marginTop:4 } }, "Log incoming stock against a purchase order. Draft and resume at any time.")
    ),
    drafts.length > 0 && E("div", { style:{ marginBottom:20 } },
      E(ST, null, `Saved Drafts (${drafts.length})`),
      E("div", { style:{ display:"flex", flexDirection:"column", gap:8 } },
        drafts.map((d,i) => E(Card, { key:i, style:{ borderLeft:`3px solid ${T.amber}` } },
          E("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center" } },
            E("div", null,
              E("div", { style:{ fontWeight:600, fontSize:13 } }, d.po.supplier||"No supplier", d.po.poRef ? ` — ${d.po.poRef}` : ""),
              E("div", { style:{ fontSize:11, color:T.muted, marginTop:2 } }, `${d.lines.length} line items · Saved ${fmtDate(d.savedAt)}`)
            ),
            E("div", { style:{ display:"flex", gap:8 } },
              E(Btn, { style:{ fontSize:12, padding:"6px 12px" }, onClick:()=>loadDraft(d) }, "▶ Continue"),
              E(Btn, { variant:"danger", style:{ fontSize:12, padding:"6px 12px" }, onClick:()=>deleteDraft(d.id) }, "✕")
            )
          )
        ))
      )
